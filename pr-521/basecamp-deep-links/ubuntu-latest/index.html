s keyed on the resolved user directory rather than being global\n- Why a link is not the shell, and what would break if it were\n- {'Why an app\\'s capability is not reachable from a URL until its author opts in with `\"web\"': 'true`'}\n\n## Prerequisites\n\n- **Nix** with flakes enabled. Install from [nixos.org](https://nixos.org/download.html), then enable flakes:\n\n```bash\nmkdir -p ~/.config/nix\necho 'experimental-features = nix-command flakes' >> ~/.config/nix/nix.conf\n```\n\n- **Linux, macOS or Windows.** The app runs headless via `QT_QPA_PLATFORM=offscreen`, so no display is required.\n- **Windows:** the two outputs the build steps below link, staged as `bin-bundle-dir-inspector/` and `logos-qt-mcp/`, plus Git Bash, Python 3 and Node.js."}, {"execs": [], "md": "## What registers the scheme, and what the socket is for\n\nThese are two separate mechanisms and it is worth being clear which does\nwhat, because it is easy to build one and think the feature works.\n\n| | Cold (nothing running) | Warm (already running) |\n| --- | --- | --- |\n| macOS | `CFBundleURLTypes` in `Info.plist` | same \u2014 LaunchServices delivers a `QFileOpenEvent` |\n| Linux | `MimeType=x-scheme-handler/basecamp` + `Exec=\u2026 --uri=%u` | second process \u2192 local socket \u2192 first |\n| Windows | `HKCU\\Software\\Classes\\basecamp` | same as Linux |\n\n**The registration is what makes cold start work at all.** With nothing\nrunning there is no socket to talk to, so the OS reads a command line and\nruns it. The socket only ever covers the warm path.\n\nOn Linux the shipped artifact is an AppImage, and the desktop file\nembedded inside it is never seen by the system \u2014 so Basecamp writes an\nequivalent entry into `~/.local/share/applications` on first run, using\n`$APPIMAGE` rather than its own `applicationFilePath()`, which points into\na temporary mount that disappears when the app exits.\n\n> Set `LOGOS_NO_SCHEME_REGISTER=1` to skip that write. The steps below do,\n> because a doc-test should not take over your desktop's handler for\n> `basecamp://`."}, {"execs": [], "md": "## The socket is keyed on the user directory\n\n`--user-dir` exists so several Basecamps can run side by side against\nisolated data trees. A global single-instance lock would break exactly\nthat, so the socket name is derived from the **resolved** base directory \u2014\nwhich is also why the guard runs after `--user-dir` is applied and before\nanything else touches a path.\n\nTwo instances with different user dirs never see each other. Two with the\nsame one do, and the second forwards its URL and exits."}, {"execs": [], "md": "## Step 1: Build the UI test driver\n\n[`logos-qt-mcp`](https://github.com/logos-co/logos-qt-mcp) connects to the\napp's QML inspector and drives it."}, {"execs": [{"cmd": "if [ -n \"${BASECAMP_QT_MCP:-}\" ]; then ln -sfn \"$BASECAMP_QT_MCP\" logos-qt-mcp\nelse nix build 'github:logos-co/logos-basecamp/5bc233ca6a27ff8eebd5854b6d5aa8965cae38b0#logos-qt-mcp' -o logos-qt-mcp; fi\n", "exit_code": 0, "kind": "run", "note": "", "output": "", "status": "pass"}], "md": "### 1.1 Build logos-qt-mcp\n\n```bash\nnix build 'github:logos-co/logos-basecamp/5bc233ca6a27ff8eebd5854b6d5aa8965cae38b0#logos-qt-mcp' -o logos-qt-mcp\n```"}, {"execs": [], "md": "## Step 2: Build the Basecamp bundle\n\nThe portable bundle, with the inspector compiled in."}, {"execs": [{"cmd": "if [ -n \"${BASECAMP_BUNDLE:-}\" ]; then ln -sfn \"$BASECAMP_BUNDLE\" bin-bundle-dir-inspector\nelse nix build \"${BASECAMP_FLAKE:-github:logos-co/logos-basecamp/5bc233ca6a27ff8eebd5854b6d5aa8965cae38b0}#bin-bundle-dir-inspector\" -o bin-bundle-dir-inspector; fi\n", "exit_code": 0, "kind": "run", "note": "", "output": "", "status": "pass"}], "md": "### 2.1 Build the bundle\n\n```bash\n# From inside the clone this is simply: nix build '.#bin-bundle-dir-inspector'\nnix build 'github:logos-co/logos-basecamp/5bc233ca6a27ff8eebd5854b6d5aa8965cae38b0#bin-bundle-dir-inspector' -o bin-bundle-dir-ins eme handler and is\nattacker-influenced, so one that happened to look like a flag must not be\nread as one.\n\n**Watch what has to happen in order.** The URL is on the command line\nbefore `logos_core_start()`, but nothing can resolve it until\n`IntentRegistry` has read every installed app's `metadata.json` \u2014 which is\nseconds later, after the package manager's first refresh. So the URL is\nparked, and replayed on the first successful registry rebuild. Gating on\nthe window appearing instead would be too early, and every cold-start link\nwould answer `unavailable`."}, {"execs": [{"actions": [{"description": "App window opens: wait for ['Applications', 'Settings']", "duration_ms": 7, "index": 1, "status": "pass"}, {"description": "The fixture apps are listed: wait for ['Link Target']", "duration_ms": 4, "index": 2, "status": "pass"}, {"description": "\u2026and the link brought the app forward on its own: wait for ['LINK TARGET READY']", "duration_ms": 46, "index": 3, "status": "pass"}], "cmd": "env HOME=\"$PWD/testdata/links-home\" USERPROFILE=\"$PWD/testdata/links-home\" LOGOS_NO_SCHEME_REGISTER=1 ./bin-bundle-dir-inspector/bin/LogosBasecamp --user-dir \"$PWD/testdata/links-user\" --uri=basecamp://app/link_target_demo", "kind": "ui_test", "note": "", "output": "\nRunning 1 test(s)...\n\n  \u001b[32m\u2713\u001b[0m Deep links: opening Basecamp, and an app inside it, from a browser: Launch with a basecamp:// URL, as the OS would\n\n1 passed, 0 failed\n\n", "runner_cmd": "node \"/home/runner/work/_temp/doctest-test-rynm3y8a/ui-test.mjs\" --verbose", "status": "pass"}], "md": "### 4.1 Launch with a basecamp:// URL, as the OS would\n\n```bash\nenv HOME=\"$PWD/testdata/links-home\" USERPROFILE=\"$PWD/testdata/links-home\" LOGOS_NO_SCHEME_REGISTER=1 ./bin-bundle-dir-inspector/bin/LogosBasecamp --user-dir \"$PWD/testdata/links-user\" --uri=basecamp://app/link_target_demo\n```\n\nThe bundle launches headless against the seeded user-dir. At this point the URL is sitting , which is exactly the\n\"a request names a capability, never a provider\" line the whole\nmechanism rests on.\n\n**The answer is the same whether or not the app exists.** Ask for an\napp that is not installed and the request still reports `ok`, on the\nsame timing floor. \"Launch X, tell me if it worked\" is otherwise an\ninstalled-app enumeration oracle: iterate plausible names, read the\nanswers, recover the user's whole app list from a web page."}, {"execs": [], "md": "## Step 5: The registered command, run the way the OS runs it\n\nEvery step above launches the binary with `--uri=` written out by hand.\nThat is what the OS ends up running, but *nothing so far has checked that*\n\u2014 the string came from this document, not from the registration.\n\nIt is a gap worth closing precisely because everything downstream of it\nstill works. A desktop entry whose `Exec` ends in a bare `%u` registers\nfine, the browser finds it, the app launches, and the URL sits unread in\n`argv` because `main()` takes it only from `--uri` \u2014 an explicit option\nrather than a positional, because a scheme handler's value is\nattacker-influenced and one that happened to look like a flag must not be\nread as one. Nothing fails; the click just does nothing.\n\nSo this step reads the entry the registrar actually wrote and runs *that*,\nsubstituting the URL for the field code exactly as a launcher does.\n\n**The same gap exists on macOS, in a different file.** Nothing is written\nat runtime there \u2014 `CFBundleURLTypes` in the bundle's `Info.plist` is what\nLaunchServices reads \u2014 so the step asserts the shipped `.app` really\ndeclares the `basecamp` scheme, then drives the bundle's own binary. The\nscheme name is defined once, in `LinkUrl::scheme()`, and the plist is the\none place that can silently drift from it.\n\n**On Windows the registration is a registry key**, and the Windows steps\nbelow read the command back from it."}, {"execs": [{"cmd": "set -u\nexport QT_QPA_PLATFORM=offscreen\n\n# The one step that must let the registrar run. Every other step here\n# sets LOGOS_NO_SCHEME_REGISTER so a doc-test does not take over the\n# machine's basecamp:// handler; this one redirects where the entry\n# is written instead, which gets the same protection and still\n# exercises the real code path.\nunset LOGOS_NO_SCHEME_REGISTER || true\nexport XDG_DATA_HOME=\"$PWD/testdata/links-xdg\"\nrm -rf \"$XDG_DATA_HOME\"\nmkdir -p \"$XDG_DATA_HOME\"\n\nBIN=\"$PWD/bin-bundle-dir-inspector/bin/LogosBasecamp\"\nDESKTOP=\"$XDG_DATA_HOME/applications/logos-basecamp.desktop\"\n\n# Its own user-dir \u2014 same reason as the warm-path step below: a\n# leftover instance on the shared one would make this step's launches\n# forward to it instead of starting.\nUSER_DIR=\"$PWD/testdata/links-user-register\"\nchmod -R u+w \"$USER_DIR\" 2>/dev/null || true\nrm -rf \"$USER_DIR\"\ncp -a \"$PWD/testdata/links-user\" \"$USER_DIR\"\n\n# A launch whose only job is to register and go away. Registration\n# runs after the window is up, so this waits on the file rather than\n# on a fixed interval.\nURL=\"basecamp://app/link_target_demo\"\n\n# THE TWO PLATFORMS REGISTER BY DIFFERENT MECHANISMS, and this step\n# used to assert only the Linux one \u2014 on both. SchemeRegistrar writes\n# nothing at all on macOS (CFBundleURLTypes in the bundle's Info.plist\n# is what LaunchServices reads), so the wait below could never find a\n# .desktop file there and macOS failed this step every single run.\nif [ \"$(uname -s)\" = \"Darwin\" ]; then\n  # The shipped .app, not the dir bundle \u2014 that has no plist.\n  # CI hands it in as BASECAMP_MACOS_APP, built once by its build job.\n  # Otherwise  is what pins this to the commit under test \u2014\n  # the same form the bundle prerequisite uses. Without it this\n  # would quietly assert the plist of the default branch.\n  if [ -n \"${BASECAMP_MACOS_APP:-}\" ]; then ln -sfn \"$BASECAMP_MACOS_APP\" result-app\n  else\n    nix build \"${BASECAMP_FLAKE:-github:logos-co/logos-basecamp/5bc233ca6a27ff8eebd5854b6d5aa8965cae38b0}#bin-macos-app\" \\\n      -o result-app || { echo \"MACOS_APP_BUILD_FAILED\"; exit 1; }\n  fi\n  PLIST=\"result-app/LogosBasecamp.app/Contents/Info.plist\"\n\n  SCHEMES=$(plutil -extract CFBundleURLTypes.0.CFBundleURLSchemes json \\\n              -o - \"$PLIST\" 2>/dev/null || true)\n  echo \"REGISTERED_SCHEMES=${SCHEMES}\"\n  case \"$SCHEMES\" in\n    *'\"basecamp\"'*) echo \"SCHEME_HANDLER_DECLARED\" ;;\n    *) echo \"NO_SCHEME_IN_INFO_PLIST\"; exit 1 ;;\n  esac\n\n  # The delivery half. LaunchServices is not drivable in CI, so run\n  # the bundle's own binary the way the plist says the OS would.\n  \"result-app/LogosBasecamp.app/Contents/MacOS/LogosBasecamp\" \\\n    --uri=\"$URL\" --user-dir \"$USER_DIR\" >/tmp/link-fromentry.log 2>&1 &\n  LAUNCHED=$!\nelse\n  \"$BIN\" --user-dir \"$USER_DIR\" >/tmp/link-register.log 2>&1 &\n  REG=$!\n  WAITED=0\n  while [ \"$WAITED\" -lt 90 ] && [ ! -f \"$DESKTOP\" ]; do\n    sleep 1\n    WAITED=$((WAITED + 1))\n  done\n  kill \"$REG\" 2>/dev/null || true\n  wait \"$REG\" 2>/dev/null || true\n\n  if [ ! -f \"$DESKTOP\" ]; then\n    echo \"NO_DESKTOP_ENTRY_WRITTEN\"\n    exit 1\n  fi\n  echo \"DESKTOP_ENTRY_WRITTEN\"\n\n  EXEC_LINE=$(grep '^Exec=' \"$DESKTOP\" || true)\n  echo \"REGISTERED_EXEC=${EXEC_LINE#Exec=}\"\n\n  # Asserted here rather than left to expect_contains, so that losing\n  # it fails with a sentence instead of an absent substring. A bare\n  # `%u` hands the URL over positionally and main() reads it only from\n  # --uri, so every layer works and nothing consumes the URL.\n  case \"$EXEC_LINE\" in\n    *--uri=%u*) echo \"SCHEME_HANDLER_DECLARED\" ;;\n    *) echo \"EXEC_LINE_DOES_NOT_PASS_THE_URL_AS_URI\"; exit 1 ;;\n  esac\n\n  # The field code substitution a desktop launcher performs. `%u` is\n  # replaced by the URL and the rest of the command line is left alone.\n  COMMAND=$(printf '%s' \"${EXEC_LINE#Exec=}\" | sed \"s|%u|$URL|\")\n\n  # eval, because the Exec line quotes the path the way the entry does\n  # and the shell has to unpick that the same way a launcher would.\n  # `exec` makes $! the app, not the eval subshell: otherwise the kill\n  # below misses it, and it keeps the inspector port for later specs.\n  eval \"exec $COMMAND --user-dir \\\"$USER_DIR\\\"\" >/tmp/link-fromentry.log 2>&1 &\n  LAUNCHED=$!\nfi\n\n# Cold start: the URL is parked until the registry's first rebuild.\nWAITED=0\nwhile [ \"$WAITED\" -lt 90 ]; do\n  grep -q \"dispatching link request\" /tmp/link-fromentry.log && break\n  kill -0 \"$LAUNCHED\" 2>/dev/null || break\n  sleep 1\n  WAITED=$((WAITED + 1))\ndone\n\nif grep -q \"for intent basecamp.apps.launch\" /tmp/link-fromentry.log; then\n  echo \"REGISTERED_COMMAND_DELIVERED_THE_URL\"\nelse\n  echo \"REGISTERED_COMMAND_DROPPED_THE_URL\"\n  echo \"--- tail of the launched instance's log ---\"\n  tail -40 /tmp/link-fromentry.log\n  echo \"--- end ---\"\nfi\n\nkill \"$LAUNCHED\" 2>/dev/null || true\nwait \"$LAUNCHED\" 2>/dev/null || true\n", "exit_code": 0, "kind": "run", "note": "", "output": "DESKTOP_ENTRY_WRITTEN\nREGISTERED_EXEC=\"/home/runner/work/_temp/basecamp/bin-bundle-dir-inspector/bin/.LogosBasecamp.elf\" --uri=%u\nSCHEME_HANDLER_DECLARED\nREGISTERED_COMMAND_DELIVERED_THE_URL\n", "status": "pass"}], "md": "### 5.1 Register, then launch from the generated Exec line\n\n```bash\nset -u\nexport QT_QPA_PLATFORM=offscreen\n\n# The one step that must let the registrar run. Every other step here\n# sets LOGOS_NO_SCHEME_REGISTER so a doc-test does not take over the\n# machine's basecamp:// handler; this one redirects where the entry\n# is written instead, which gets the same protection and still\n# exercises the real code path.\nunset LOGOS_NO_SCHEME_REGISTER || true\nexport XDG_DATA_HOME=\"$PWD/testdata/links-xdg\"\nrm -rf \"$XDG_DATA_HOME\"\nmkdir -p \"$XDG_DATA_HOME\"\n\nBIN=\"$PWD/bin-bundle-dir-inspector/bin/LogosBasecamp\"\nDESKTOP=\"$XDG_DATA_HOME/applications/logos-basecamp.desktop\"\n\n# Its own user-dir \u2014 same reason as the warm-path step below: a\n# leftover instance on the shared one would make this step's launches\n# forward to it instead of starting.\nUSER_DIR=\"$PWD/testdata/links-user-register\"\nchmod -R u+w \"$USER_DIR\" 2>/dev/null || true\nrm -rf \"$USER_DIR\"\ncp -a \"$PWD/testdata/links-user\" \"$USER_DIR\"\n\n# A launch whose only job is to register and go away. Registration\n# runs after the window is up, so this waits on the file rather than\n# on a fixed interval.\nURL=\"basecamp://app/link_target_demo\"\n\n# THE TWO PLATFORMS REGISTER BY DIFFERENT MECHANISMS, and this step\n# used to assert only the Linux one \u2014 on both. SchemeRegistrar writes\n# nothing at all on macOS (CFBundleURLTypes in the bundle's Info.plist\n# is what LaunchServices reads), so the wait below could never find a\n# .desktop file there and macOS failed this step every single run.\nif [ \"$(uname -s)\" = \"Darwin\" ]; then\n  # The shipped .app, not the dir bundle \u2014 that has no plist.\n  # CI hands it in as BASECAMP_MACOS_APP, built once by its build job.\n  # Otherwise  is what pins this to the commit under test \u2014\n  # the same form the bundle prerequisite uses. Without it this\n  # would quietly assert the plist of the default branch.\n  if [ -n \"${BASECAMP_MACOS_APP:-}\" ]; then ln -sfn \"$BASECAMP_MACOS_APP\" result-app\n  else\n    nix build \"${BASECAMP_FLAKE:-github:logos-co/logos-basecamp/5bc233ca6a27ff8eebd5854b6d5aa8965cae38b0}#bin-macos-app\" \\\n      -o result-app || { echo \"MACOS_APP_BUILD_FAILED\"; exit 1; }\n  fi\n  PLIST=\"result-app/LogosBasecamp.app/Contents/Info.plist\"\n\n  SCHEMES=$(plutil -extract CFBundleURLTypes.0.CFBundleURLSchemes json \\\n              -o - \"$PLIST\" 2>/dev/null || true)\n  echo \"REGISTERED_SCHEMES=${SCHEMES}\"\n  case \"$SCHEMES\" in\n    *'\"basecamp\"'*) echo \"SCHEME_HANDLER_DECLARED\" ;;\n    *) echo \"NO_SCHEME_IN_INFO_PLIST\"; exit 1 ;;\n  esac\n\n  # The delivery half. LaunchServices is not drivable in CI, so run\n  # the bundle's own binary the way the plist says the OS would.\n  \"result-app/LogosBasecamp.app/Contents/MacOS/LogosBasecamp\" \\\n    --uri=\"$URL\" --user-dir \"$USER_DIR\" >/tmp/link-fromentry.log 2>&1 &\n  LAUNCHED=$!\nelse\n  \"$BIN\" --user-dir \"$USER_DIR\" >/tmp/link-register.log 2>&1 &\n  REG=$!\n  WAITED=0\n  while [ \"$WAITED\" -lt 90 ] && [ ! -f \"$DESKTOP\" ]; do\n    sleep 1\n    WAITED=$((WAITED + 1))\n  done\n  kill \"$REG\" 2>/dev/null || true\n  wait \"$REG\" 2>/dev/null || true\n\n  if [ ! -f \"$DESKTOP\" ]; then\n    echo \"NO_DESKTOP_ENTRY_WRITTEN\"\n    exit 1\n  fi\n  echo \"DESKTOP_ENTRY_WRITTEN\"\n\n  EXEC_LINE=$(grep '^Exec=' \"$DESKTOP\" || true)\n  echo \"REGISTERED_EXEC=${EXEC_LINE#Exec=}\"\n\n  # Asserted here rather than left to expect_contains, so that losing\n  # it fails with a sentence instead of an absent substring. A bare\n  # `%u` hands the URL over positionally and main() reads it only from\n  # --uri, so every layer works and nothing consumes the URL.\n  case \"$EXEC_LINE\" in\n    *--uri=%u*) echo \"SCHEME_HANDLER_DECLARED\" ;;\n    *) echo \"EXEC_LINE_DOES_NOT_PASS_THE_URL_AS_URI\"; exit 1 ;;\n  esac\n\n  # The field code substitution a desktop launcher performs. `%u` is\n  # replaced by the URL and the rest of the command line is left alone.\n  COMMAND=$(printf '%s' \"${EXEC_LINE#Exec=}\" | sed \"s|%u|$URL|\")\n\n  # eval, because the Exec line quotes the path the way the entry does\n  # and the shell has to unpick that the same way a launcher would.\n  # `exec` makes $! the app, not the eval subshell: otherwise the kill\n  # below misses it, and it keeps the inspector port for later specs.\n  eval \"exec $COMMAND --user-dir \\\"$USER_DIR\\\"\" >/tmp/link-fromentry.log 2>&1 &\n  LAUNCHED=$!\nfi\n\n# Cold start: the URL is parked until the registry's first rebuild.\nWAITED=0\nwhile [ \"$WAITED\" -lt 90 ]; do\n  grep -q \"dispatching link request\" /tmp/link-fromentry.log && break\n  kill -0 \"$LAUNCHED\" 2>/dev/null || break\n  sleep 1\n  WAITED=$((WAITED + 1))\ndone\n\nif grep -q \"for intent basecamp.apps.launch\" /tmp/link-fromentry.log; then\n  echo \"REGISTERED_COMMAND_DELIVERED_THE_URL\"\nelse\n  echo \"REGISTERED_COMMAND_DROPPED_THE_URL\"\n  echo \"--- tail of the launched instance's log ---\"\n  tail -40 /tmp/link-fromentry.log\n  echo \"--- end ---\"\nfi\n\nkill \"$LAUNCHED\" 2>/dev/null || true\nwait \"$LAUNCHED\" 2>/dev/null || true\n\n```\n\n`REGISTERED_EXEC` is echoed rather than only asserted on, because the\nshape of that one line is the whole feature on Linux \u2014 and a reader\ncomparing it against their own `~/.local/share/applications` entry is\nthe fastest way to explain a link that does nothing on a machine that\nupgraded from a build which wrote the old form."}, {"execs": [], "md": "### 5.2 On Windows: a helper that stops what it starts\n\nThe two Windows steps below start Basecamp themselves. Git Bash's `&`\nand `kill` do not reach a native program's process tree, so each\nlaunch is held in a kill-on-close job object instead.\n\n```python\nimport ctypes, subprocess\nfrom ctypes import wintypes\n\n\nclass _Basic(ctypes.Structure):  # JOBOBJECT_BASIC_LIMIT_INFORMATION\n    _fields_ = [(\"PerProcessUserTimeLimit\", ctypes.c_int64),\n                (\"PerJobUserTimeLimit\", ctypes.c_int64), (\"LimitFlags\", wintypes.DWORD),\n                (\"MinimumWorkingSetSize\", ctypes.c_size_t),\n                (\"MaximumWorkingSetSize\", ctypes.c_size_t),\n                (\"ActiveProcessLimit\", wintypes.DWORD), (\"Affinity\", ctypes.c_size_t),\n                (\"PriorityClass\", wintypes.DWORD), (\"SchedulingClass\", wintypes.DWORD)]\n\n\nclass _Limits(ctypes.Structure):  # JOBOBJECT_EXTENDED_LIMIT_INFORMATION\n    _fields_ = [(\"Basic\", _Basic), (\"IoInfo\", ctypes.c_uint64 * 6),\n                (\"ProcessMemoryLimit\", ctypes.c_size_t), (\"JobMemoryLimit\", ctypes.c_size_t),\n                (\"PeakProcessMemoryUsed\", ctypes.c_size_t),\n                (\"PeakJobMemoryUsed\", ctypes.c_size_t)]\n\n\nkernel32 = ctypes.WinDLL(\"kernel32\", use_last_error=True)\nkernel32.CreateJobObjectW.restype = wintypes.HANDLE\nkernel32.CreateJobObjectW.argtypes = [ctypes.c_void_p, wintypes.LPCWSTR]\nkernel32.SetInformationJobObject.argtypes = [wintypes.HANDLE, ctypes.c_int,\n                                             ctypes.c_void_p, wintypes.DWORD]\nkernel32.AssignProcessToJobObject.argtypes = [wintypes.HANDLE, wintypes.HANDLE]\nkernel32.TerminateJobObject.argtypes = [wintypes.HANDLE, wintypes.UINT]\nntdll = ctypes.WinDLL(\"ntdll\")\nntdll.NtResumeProcess.argtypes = [wintypes.HANDLE]\n\n\nclass Job:\n    \"\"\"`command` (an argv list, or a command line as the shell runs it), output to `log`.\"\"\"\n\n    def __init__(self, command, log, env):\n        self.log = open(log, \"w\")\n        # Started suspended (0x4), so nothing it starts can escape the job.\n        self.proc = subprocess.Popen(command, stdout=self.log, stderr=subprocess.STDOUT,\n                                     env=env, creationflags=0x4)\n        self.job = kernel32.CreateJobObjectW(None, None)\n        limits = _Limits()\n        limits.Basic.LimitFlags = 0x2000  # JOB_OBJECT_LIMIT_KILL_ON_JOB_CLOSE\n        if not (self.job\n                and kernel32.SetInformationJobObject(self.job, 9, ctypes.byref(limits),\n                                                     ctypes.sizeof(limits))\n                and kernel32.AssignProcessToJobObject(self.job, int(self.proc._handle))):\n            self.proc.kill()\n            raise OSError(\"no job object: error %d\" % ctypes.get_last_error())\n        ntdll.NtResumeProcess(int(self.proc._handle))\n\n    def running(self):\n        return self.proc.poll() is None\n\n    def stop(self):\n        kernel32.TerminateJobObject(self.job, 1)\n        self.proc.wait(timeout=30)\n        self.log.close()\n\n\ndef read(path):\n    with open(path, encoding=\"utf-8\", errors=\"replace\") as f:\n        return f.read()\n```"}, {"execs": [], "md": "### 5.3 On Windows: register, then run the command the registry holds\n\nOn Windows the registrar writes `HKCU\\Software\\Classes\\basecamp`, and the\nshell runs its `shell\\open\\command` with the clicked URL in place of\n`%1`. This reads that command back and runs it the same way. A handler\nalready registered on the machine (an installed Basecamp, say) is\nexported first and imported back afterwards.\n\n```python\nimport os, subprocess, sys, time, winreg\nfrom winjob import Job, read\n\nexe = os.path.abspath(r\"bin-bundle-dir-inspector\\bin\\LogosBasecamp.exe\")\nuser_dir = os.path.abspath(r\"testdata\\links-user-register\")\nurl = \"basecamp://app/link_target_demo\"\nkey = r\"Software\\Classes\\basecamp\"\nbackup = os.path.abspath(r\"build\\links\\handler-before.reg\")\nenv = {k: v for k, v in os.environ.items() if k != \"LOGOS_NO_SCHEME_REGISTER\"}\nenv.update(QT_QPA_PLATFORM=\"offscreen\", QT_FORCE_STDERR_LOGGING=\"1\")\n\n\ndef registered_command():\n    try:\n        return winreg.QueryValue(winreg.HKEY_CURRENT_USER, key + r\"\\shell\\open\\command\")\n    except OSError:\n        return \"\"\n\n\ndef reg(*args):\n    return subprocess.run([\"reg\", *args], capture_output=True).returncode == 0\n\n\nhad_handler = reg(\"export\", \"HKCU\\\\\" + key, backup, \"/y\")\nreg(\"delete\", \"HKCU\\\\\" + key, \"/f\")\ntry:\n    # A launch whose only job is to register; waits on the registry, not a timer.\n    app = Job([exe, \"--user-dir\", user_dir], r\"build\\links\\register.log\", env)\n    for _ in range(90):\n        if exe.lower() in registered_command().lower():\n            break\n        time.sleep(1)\n    app.stop()\n\n    command = registered_command()\n    print(\"REGISTERED_COMMAND=\" + command)\n    if '\"--uri=%1\"' not in command:\n        print(\"COMMAND_DOES_NOT_PASS_THE_URL_AS_URI\")\n        sys.exit(1)\n    print(\"SCHEME_HANDLER_DECLARED\")\n\n    # The shell's substitution: %1 becomes the URL, the rest runs as written.\n    app = Job(command.replace(\"%1\", url) + ' --user-dir \"%s\"' % user_dir,\n              r\"build\\links\\fromentry.log\", env)\n    for _ in range(90):\n        if \"dispatching link request\" in read(r\"build\\links\\fromentry.log\") or not app.running():\n            break\n        time.sleep(1)\n    app.stop()\n    log = read(r\"build\\links\\fromentry.log\")\n    if \"for intent basecamp.apps.launch\" in log:\n        print(\"REGISTERED_COMMAND_DELIVERED_THE_URL\")\n    else:\n        print(\"REGISTERED_COMMAND_DROPPED_THE_URL\")\n        print(log[-3000:])\nfinally:\n    reg(\"delete\", \"HKCU\\\\\" + key, \"/f\")\n    if had_handler:\n        reg(\"import\", backup)\n```"}, {"execs": [], "md": "### 5.4 On Windows: run it\n\n```bash\nchmod -R u+w testdata/links-user-register 2>/dev/null || true\nrm -rf testdata/links-user-register\ncp -a testdata/links-user testdata/links-user-register\npython3 build/links/register.py\n\n```"}, {"execs": [], "md": "## Step 6: The shell's own web-reachable intents\n\n`basecamp://app/<name>` is sugar. The general form names an intent\ndirectly, and the shell provides four that a link may reach \u2014 all\nnavigation, all hand-offs.\n\n**Why navigation and nothing else.** The broker skips the chooser when\nthe shell is the only provider, so every entry in this set is something a\nweb page can cause *without a consent dialog*. That is right for moving\nbetween the shell's own sections: nothing crosses a boundary, nothing is\ndestructive, and confirming a navigation the user just asked for is a\ndialog answering itself. It stops being right the moment an entry mutates\nstate \u2014 which is why the three `basecamp.packages.confirm_*` intents are\ndeliberately absent, and must stay absent.\n\nEach launch below is a separate cold start, because the OS hands a URL to\none process invocation."}, {"execs": [{"actions": [{"description": "App window opens: wait for ['Applications', 'Settings']", "duration_ms": 7, "index": 1, "status": "pass"}, {"description": "\u2026and the link landed on Settings with no dialog in the way: wait for ['Apps Inspector', 'Module Inspector']", "duration_ms": 51, "index": 2, "status": "pass"}], "cmd": "env HOME=\"$PWD/testdata/links-home\" USERPROFILE=\"$PWD/testdata/links-home\" LOGOS_NO_SCHEME_REGISTER=1 ./bin-bundle-dir-inspector/bin/LogosBasecamp --user-dir \"$PWD/testdata/links-user\" --uri=basecamp://intent/basecamp.settings.open", "kind": "ui_test", "note": "", "output": "\nRunning 1 test(s)...\n\n  \u001b[32m\u2713\u001b[0m Deep links: opening Basecamp, and an app inside it, from a browser: basecamp.settings.open\n\n1 passed, 0 failed\n\n", "runner_cmd": "node \"/home/runner/work/_temp/doctest-test-rynm3y8a/ui-test.mjs\" --verbose", "status": "pass"}], "md": "### 6.1 basecamp.settings.open\n\n```bash\nenv HOME=\"$PWD/testdata/links-home\" USERPROFILE=\"$PWD/testdata/links-home\" LOGOS_NO_SCHEME_REGISTER=1 ./bin-bundle-dir-inspector/bin/LogosBasecamp --user-dir \"$PWD/testdata/links-user\" --uri=basecamp://intent/basecamp.settings.open\n```\n\nThe URL is parked in the inbox while the app boots.\n\nNobody clicked anything. The shell is the only provider, so the broker dispatched without raising a chooser \u2014 and the request is a hand-off, so the user is left here rather than being returned anywhere.\n\n![\u2026and the link landed on Settings with no dialog in the way](data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABkAAAAOECAIAAAB2L2r1AAAACXBIWXMAAA7EAAAOxAGVKw4bAAAgAElEQVR4nOzdeXxN1/74/7XPlFESQYIYQhCqIggihmpqCoIWNVOqVOvDdaul9GpV61bJralVRbk1VgxV1HBLzUNRIcYgZjKKjCc54++P/bv7e25EBIlzxOv5x32svfbae733TvTxyPuu9d6Sr6+vAAAAAAAAAByVyt4BAAAAAAAAAIUhgQUAAAAAAACHRgILAAAAAAAADo0EFgAAAAAAABwaCSwAAAAAAAA4NBJYAAAAAAAAcGgksAAAAAAAAODQNE98pVar1Wg0KpVKkiT5f4sxrKdntVotFov8vyaTyWg02jsiAAAAAAAAPInHTmCpVConJyetVutoGat8JElSq9VyW6fTWa1Wo9GYl5dnsVjsGxgAAAAAAAAey+MlsJydnZ2cnEoolBIlSZJOp9PpdHl5ebm5ufYOBwAAAAAAAEVV1ASWSqVydXVV1jQ9v5ycnDQaTU5O s immediately** rather than\nbooting a second runtime against the same `plugins/` and `module_data/`."}, {"execs": [{"cmd": "set -u\nexport LOGOS_NO_SCHEME_REGISTER=1\n# Offscreen, or there is no display on a CI runner and the first\n# instance dies before it can listen \u2014 which reads as \"the guard is\n# broken\" rather than \"there is no X server\". The ui_test steps get\n# this from the harness; a raw shell step does not.\nexport QT_QPA_PLATFORM=offscreen\nBIN=./bin-bundle-dir-inspector/bin/LogosBasecamp\n\n# ITS OWN USER-DIR, not the shared one. The guard keys its socket on\n# the resolved user-dir, so sharing one couples every step that starts\n# an instance: the harness gives a terminating app 10s and then moves\n# on regardless, and one that outlives that still holds the socket.\n# The next step's \"instance 1\" then forwards to it and exits 0 \u2014\n# indistinguishable from a crash through `kill -0`, which is exactly\n# how this step failed.\nUSER_DIR=\"$PWD/testdata/links-user-warm\"\nchmod -R u+w \"$USER_DIR\" 2>/dev/null || true\nrm -rf \"$USER_DIR\"\ncp -a \"$PWD/testdata/links-user\" \"$USER_DIR\"\n\n# Instance 1: the running app.\n\"$BIN\" --user-dir \"$USER_DIR\" >/tmp/link-first.log 2>&1 &\nFIRST=$!\nsleep 25\n\nif ! kill -0 \"$FIRST\" 2>/dev/null; then\n  echo \"FIRST_INSTANCE_DIED\"\n  # WHY it died, because \"FIRST_INSTANCE_DIED\" alone is unreadable\n  # from a CI log and this branch used to print nothing else.\n  #\n  # The likely cause is not a crash at all. Every step in this file\n  # shares one user-dir, the harness gives a terminating app 10s and\n  # then moves on regardless, and a Basecamp that outlives that window\n  # still holds the guard's socket. This process then probes it,\n  # becomes a SECONDARY, and main() returns 0 \u2014 an orderly exit that\n  # looks identical to a crash through `kill -0`.\n  wait \"$FIRST\" 2>/dev/null\n  echo \"FIRST_INSTANCE_EXIT_CODE=$?\"\n  if grep -q \"Logos Core started successfully\" /tmp/link-first.log; then\n    echo \"FIRST_INSTANCE_BOOTED_THEN_DIED\"\n  else\n    echo \"FIRST_INSTANCE_NEVER_BOOTED_A_RUNTIME (became a secondary?)\"\n  fi\n  echo \"--- tail of the first instance's log ---\"\n  tail -40 /tmp/link-first.log\n  echo \"--- end ---\"\n  exit 1\nfi\n\n# Instance 2: what the OS runs when the link is clicked. It should\n# forward and exit, NOT become a second Basecamp.\nSTART=$(date +%s)\n\"$BIN\" --user-dir \"$USER_DIR\" --uri=basecamp://app/link_target_demo \\\n  >/tmp/link-second.log 2>&1\nSECOND_RC=$?\nELAPSED=$(( $(date +%s) - START ))\n\necho \"SECOND_EXIT_CODE=$SECOND_RC\"\necho \"SECOND_ELAPSED=${ELAPSED}s\"\n\n# A forwarding secondary lives for about as long as a socket\n# round-trip. Anything near a real startup means it booted instead.\nif [ \"$SECOND_RC\" -eq 0 ] && [ \"$ELAPSED\" -lt 10 ]; then\n  echo \"SECOND_INSTANCE_FORWARDED_AND_EXITED\"\nfi\n\n# It must not have started a runtime of its own.\nif grep -q \"Logos Core started successfully\" /tmp/link-second.log; then\n  echo \"SECOND_INSTANCE_BOOTED_A_RUNTIME\"\nelse\n  echo \"SECOND_INSTANCE_STARTED_NO_RUNTIME\"\nfi\n\n# The half that matters, and the one it is easy to forget to assert:\n# the second process exiting quietly proves it FORWARDED, not that\n# anybody RECEIVED. Both look identical from outside the first\n# instance, so we go and look inside it.\n#\n# Polled rather than slept on. The socket read and the 400 ms answer\n# floor are quick, but a link that arrives before the registry's\n# first rebuild is parked until it lands \u2014 correct behaviour, and on\n# a loaded runner it can be well past any fixed interval that looks\n# generous on a developer's machine.\nWAITED=0\nwhile [ \"$WAITED\" -lt 60 ]; do\n  grep -q \"dispatching link request\" /tmp/link-first.log && break\n  sleep 1\n  WAITED=$((WAITED + 1))\ndone\n\nif grep -q \"dispatching link request\" /tmp/link-first.log; then\n  echo \"FIRST_INSTANCE_HANDLED_THE_LINK\"\nelse\n  echo \"FIRST_INSTANCE_NEVER_SAW_T thread, which freezes the running app\nfor the whole timeout whenever something connects and sends nothing \u2014\ntrivial to trigger, and it looks like a hang rather than a link bug."}, {"execs": [], "md": "### 7.2 On Windows: start one instance, then click a link at it\n\nThe same two processes, held by the job helper above. The first\ninstance's single-instance socket listens before its runtime reports\nit started, so the second goes once that line is in the log.\n\n```python\nimport os, subprocess, sys, time\nfrom winjob import Job, read\n\nexe = os.path.abspath(r\"bin-bundle-dir-inspector\\bin\\LogosBasecamp.exe\")\nuser_dir = os.path.abspath(r\"testdata\\links-user-warm\")\nenv = dict(os.environ, LOGOS_NO_SCHEME_REGISTER=\"1\", QT_QPA_PLATFORM=\"offscreen\",\n           QT_FORCE_STDERR_LOGGING=\"1\")\nfirst_log, second_log = r\"build\\links\\first.log\", r\"build\\links\\second.log\"\n\nfirst = Job([exe, \"--user-dir\", user_dir], first_log, env)\ntry:\n    for _ in range(120):\n        if \"Logos Core started successfully\" in read(first_log) or not first.running():\n            break\n        time.sleep(1)\n    if not first.running():\n        print(\"FIRST_INSTANCE_DIED\")\n        print(read(first_log)[-3000:])\n        sys.exit(1)\n\n    # What the shell runs when the link is clicked.\n    start = time.time()\n    second = Job([exe, \"--user-dir\", user_dir, \"--uri=basecamp://app/link_target_demo\"],\n                 second_log, env)\n    try:\n        rc = second.proc.wait(timeout=30)\n    except subprocess.TimeoutExpired:\n        rc = None\n    elapsed = time.time() - start\n    second.stop()\n    print(\"SECOND_EXIT_CODE=%s\" % rc)\n    print(\"SECOND_ELAPSED=%ds\" % elapsed)\n    if rc == 0 and elapsed < 10:\n        print(\"SECOND_INSTANCE_FORWARDED_AND_EXITED\")\n    if \"Logos Core started successfully\" in read(second_log):\n        print(\"SECOND_INSTANCE_BOOTED_A_RUNTIME\")\n    else:\n        print(\"SECOND_INSTANCE_STARTED_NO_RUNTIME\")\n\n    for _ in range(60):\n        if \"dispatching link request\" in read(first_log):\n            break\n        time.sleep(1)\n    log = read(first_log)\n    if \"dispatching link request\" in log:\n        print(\"FIRST_INSTANCE_HANDLED_THE_LINK\")\n    else:\n        print(\"FIRST_INSTANCE_NEVER_SAW_THE_LINK\")\n        print(log[-3000:])\n    if \"for intent basecamp.apps.launch\" in log:\n        print(\"FIRST_INSTANCE_GOT_THE_RIGHT_INTENT\")\nfinally:\n    first.stop()\n```"}, {"execs": [], "md": "### 7.3 On Windows: run it\n\n```bash\nchmod -R u+w testdata/links-user-warm 2>/dev/null || true\nrm -rf testdata/links-user-warm\ncp -a testdata/links-user testdata/links-user-warm\npython3 build/links/warm.py\n\n```"}, {"execs": [], "md": "## Why a link is not the shell\n\nThe shell provides capabilities of its own, and the broker skips the\nchooser when the shell is either party to a request \u2014 confirming a\nnavigation the user just asked for is a dialog answering itself.\n\nA URL submits under its **own** requester identity, never the shell's.\nThat one line is what keeps the consent step in the path for links into\ninstalled apps: if a link were treated as the shell, every web link would\ndispatch into an app with no dialog at all. Nothing else would look wrong,\nand no other test would fail \u2014 which is why there is one whose entire\npurpose is that a link faces the chooser.\n\nThe one thing the shell cannot honestly do here is say **who** is asking.\nA browser does not tell us the originating page, and any origin carried\n*in* the URL is written by whoever wrote the URL. So the dialog says a\nlink was clicked and nothing more; it must not render an attacker-supplied\nstring as if it were an identity."}, {"execs": [], "md": "## Why an app's capability is not reachable until it opts in\n\n`uses` cannot gate a link \u2014 there is no manifest on the calling side \u2014 so\nreachability is declared by the **provider**, per intent:\n\n```json\n\"provides\": [\n  { \"intent\": \"wallet.send\", \"web\": true, \"params\": [ \u2026 ] }\n]\n```\n\nWithout that flag, every entry in every installed app's `provides` would\nsilently have become a web entry point the day link support shipped.\n\nThe shell's own web-reachable set is navigation only \u2014 opening Settings,\nthe App Manager, repositories, and launching an app. The package\nconfirmation intents are deliberately absent: a web page must not be able\nto raise a prompt to install or remove a package.\n\nA non-boolean is refused rather than coerced. `\"web\": \"false\"` is a\n*string*, and reading it through the usual conversion gives `true` \u2014 which\nwould publish a capability whose author was explicitly declining to\npublish it."}, {"execs": [], "md": "## What this does not do\n\n**No browser will tell a page whether Basecamp is installed.** It is a\nfingerprinting vector and it is blocked deliberately. The usual fallback \u2014\nnavigate, then show a download link if nothing happened within a second or\ntwo \u2014 is a heuristic that misfires whenever the app is merely slow to\nstart, which is precisely the cold path above.\n\nWorth saying plainly to anyone who asks for this: *\"open it if they have\nit, otherwise offer the download\"* sounds like one feature and is two, of\nwhich the second is guesswork. The honest arrangement is to make\n`https://\u2026/i/<intent>` and `basecamp://intent/<intent>` the same link, so\n\"not installed\" lands on a real page that offers the download.\n\n**Nothing goes back to the browser.** There is no channel. Every failure \u2014\na malformed URL, an intent nobody published, a user dismissing the chooser\n\u2014 surfaces inside Basecamp and in the log. That is also why no error code\nhere can leak anything: there is nobody on the far side to read it."}]}], "version": 1}</script>
<script>
  const DATA = JSON.parse(document.getElementById("report-data").textContent);
  if (window.marked) { marked.setOptions({ gfm: true, breaks: false }); }
  const mdToHtml = (s) => window.marked ? marked.parse(s || "") : ("<pre>" + (s || "") + "</pre>");

  const sum = DATA.summary;
  document.getElementById("summary").innerHTML =
    `<span class="pill pass">${sum.passed} passed</span> ` +
    (sum.failed ? `<span class="pill fail">${sum.failed} failed</span> ` : "") +
    (sum.skipped ? `<span class="pill skip">${sum.skipped} skipped</span>` : "");

  const picker = document.getElementById("picker");
  DATA.tutorials.forEach((t, i) => {
    const o = document.createElement("option");
    o.value = i; o.textContent = t.meta.name; picker.appendChild(o);
  });

  function execHtml(e) {
    const badge = `<span class="badge ${e.status}">${e.status.toUpperCase()}</span>`;
    const kind = `<span class="kind">${e.kind}${e.platform ? " · " + e.platform : ""}${e.exit_code !== undefined ? " · exit " + e.exit_code : ""}</span>`;
    let h = `<div class="exec"><div class="exec-head">${badge}${kind}</div>`;
    if (e.note) h += `<div class="note">${escapeHtml(e.note)}</div>`;
    if (e.cmd) h += `<pre class="cmd">${escapeHtml(e.cmd)}</pre>`;
    if (e.runner_cmd) h += `<pre class="cmd">${escapeHtml(e.runner_cmd)}</pre>`;
    if (e.actions) {
      const passed = e.actions.filter(a => a.status === "pass").length;
      h += `<div class="kind">UI actions: ${passed}/${e.actions.length} passed</div>`;
      h += `<table class="ui-actions"><tbody>`;
      for (const a of e.actions) {
        const label = a.status === "not_run" ? "NOT RUN" :
          a.status === "running" ? "INTERRUPTED" : a.status.toUpperCase();
        h += `<tr><td>${a.index}</td><td><span class="badge ${a.status}">${label}</span></td>`;
        h += `<td>${escapeHtml(a.description)}`;
        if (a.error) h += `<div class="note">${escapeHtml(a.error)}</div>`;
        h += `</td><td>${a.duration_ms !== undefined ? a.duration_ms + " ms" : ""}</td></tr>`;
      }
      h += `</tbody></table>`;
    }
    const out = (e.output || "").trim();
    if (out) {
      const long = out.split("\n").length > 12;
      if (long) {
        h += `<details><summary>output (${out.split("\n").length} lines)</summary><pre class="output">${escapeHtml(out)}</pre></details>`;
      } else {
        h += `<pre class="output">${escapeHtml(out)}</pre>`;
      }
    }
    h += `</div>`;
    return h;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  }

  function render(idx) {
    const t = DATA.tutorials[idx];
    const main = document.getElementById("main");
    main.innerHTML = "";
    const h = document.createElement("div");
    h.className = "tutorial-title";
    h.textContent = t.meta.name + "  —  " + t.meta.platform;
    main.appendChild(h);

    t.rows.forEach(row => {
      const isStructural = row.execs.length === 0 &&
        (/^#\s|^##\s/.test(row.md.trim()));
      const div = document.createElement("div");
      const hasExec = row.execs.length > 0;
      const hasFail = row.execs.some(e => e.status === "fail");
      div.className = "row" + (hasExec ? "" : (isStructural ? " section" : " preamble")) +
        (hasFail ? " has-fail" : "");

      const left = document.createElement("div");
      left.className = "col left";
      left.innerHTML = `<div class="md">${mdToHtml(row.md)}</div>`;
      div.appendChild(left);

      if (hasExec || !isStructural) {
        const right = document.createElement("div");
        right.className = "col right";
        if (hasExec) {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            row.execs.map(execHtml).join("");
        } else {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            `<div class="empty">No commands run for this step.</div>`;
        }
        div.appendChild(right);
      }
      main.appendChild(div);
    });

    addAnchors(main, slug(t.meta.name));
  }

  function slug(s) {
    return String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  }

  // Octicon "link" — the same glyph GitHub puts next to markdown headings.
  const LINK_ICON =
    '<svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d=' +
    '"M7.775 3.275a.75.75 0 0 0 1.06 1.06l1.25-1.25a2 2 0 1 1 2.83 2.83l-2.5 2.5a2 2 0 0 1-2.83 0 ' +
    '.75.75 0 0 0-1.06 1.06 3.5 3.5 0 0 0 4.95 0l2.5-2.5a3.5 3.5 0 0 0-4.95-4.95l-1.25 1.25Zm-4.69 ' +
    '9.64a2 2 0 0 1 0-2.83l2.5-2.5a2 2 0 0 1 2.83 0 .75.75 0 0 0 1.06-1.06 3.5 3.5 0 0 0-4.95 0l-2.5 ' +
    '2.5a3.5 3.5 0 0 0 4.95 4.95l1.25-1.25a.75.75 0 0 0-1.06-1.06l-1.25 1.25a2 2 0 0 1-2.83 0Z"></path></svg>';

  // Give every heading a stable slug id (deduplicated the way GitHub does, with
  // -1/-2 suffixes) and a permalink whose href is "#<tutorial>/<heading>".
  function addAnchors(container, tutSlug) {
    const used = new Map();
    const nodes = container.querySelectorAll(
      ".tutorial-title, .md h1, .md h2, .md h3, .md h4, .md h5, .md h6"
    );
    nodes.forEach(node => {
      const text = node.textContent.trim();
      const isTitle = node.classList.contains("tutorial-title");
      let href = "#" + tutSlug;
      if (!isTitle) {
        const base = slug(text) || "section";
        const n = (used.get(base) || 0) + 1;
        used.set(base, n);
        node.id = n > 1 ? base + "-" + n : base;
        href += "/" + node.id;
      }
      node.classList.add("heading-anchored");
      const a = document.createElement("a");
      a.className = "anchor";
      a.href = href;
      a.title = "Copy link to this section";
      a.setAttribute("aria-label", "Permalink: " + text);
      a.innerHTML = LINK_ICON;
      node.insertBefore(a, node.firstChild);
    });
  }

  let toastTimer = null;
  function toast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 1600);
  }

  // navigator.clipboard needs a secure context; reports are often opened over
  // file://, so fall back to the old execCommand path there.
  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(
        () => toast("Link copied"),
        () => toast(text)
      );
      return;
    }
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    toast(ok ? "Link copied" : text);
  }

  function scrollToId(id) {
    if (!id) { window.scrollTo(0, 0); return; }
    const el = document.getElementById(id);
    if (!el) return;
    el.scrollIntoView({ block: "start" });
    el.classList.remove("flash");
    void el.offsetWidth;  // restart the animation on a repeat click
    el.classList.add("flash");
  }

  document.addEventListener("click", ev => {
    const a = ev.target.closest && ev.target.closest("a.anchor");
    if (!a) return;
    ev.preventDefault();
    const href = a.getAttribute("href");
    copyText(location.href.split("#")[0] + href);
    if (location.hash === href) scrollToId(a.parentNode.id);
    else location.hash = href;  // hashchange scrolls
  });

  // "#<tutorial>" (name, slug, or index) optionally followed by "/<heading>".
  function parseHash() {
    const raw = decodeURIComponent(location.hash.replace(/^#/, ""));
    if (!raw) return { idx: 0, frag: "" };
    const cut = raw.indexOf("/");
    const tut = cut >= 0 ? raw.slice(0, cut) : raw;
    const frag = cut >= 0 ? raw.slice(cut + 1) : "";
    if (/^\d+$/.test(tut) && +tut < DATA.tutorials.length) return { idx: +tut, frag };
    const i = DATA.tutorials.findIndex(
      t => slug(t.meta.name) === tut || t.meta.name === tut
    );
    if (i >= 0) return { idx: i, frag };
    // No tutorial matched: treat a bare hash as a heading in the current one.
    return { idx: currentIdx >= 0 ? currentIdx : 0, frag: cut >= 0 ? frag : raw };
  }

  let currentIdx = -1;
  function show(idx, frag) {
    if (idx !== currentIdx) {
      picker.value = idx;
      render(idx);
      currentIdx = idx;
    }
    if (frag) requestAnimationFrame(() => scrollToId(frag));
  }
  picker.addEventListener("change", () => {
    location.hash = slug(DATA.tutorials[+picker.value].meta.name);
    show(+picker.value);
  });
  window.addEventListener("hashchange", () => {
    const h = parseHash();
    show(h.idx, h.frag);
  });
  const initial = parseHash();
  show(initial.idx, initial.frag);
  // Inlined screenshots have no intrinsic size until decoded, so the first
  // scroll can land short; re-anchor once everything has loaded.
  if (initial.frag) {
    window.addEventListener("load", () => scrollToId(initial.frag), { once: true });
  }
</script>
</body>
</html>
