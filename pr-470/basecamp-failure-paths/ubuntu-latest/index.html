ce\n\nThe valid fixture is a QML-only (`ui_qml`) app, hand-built exactly the\nway the package-lifecycle doc-test documents: a stamped `manifest.json`\nseeded into a plain-**ustar** gzipped tar, payload injected and content\nhashes stamped by [`lgx add`](https://github.com/logos-co/logos-package).\nFrom that one good file the two broken ones are derived mechanically \u2014\nno packaging tool involved, because breaking things is easy."}, {"execs": [{"cmd": "write build/failpath/manifest.json", "kind": "file", "note": "Wrote build/failpath/manifest.json", "status": "pass"}], "md": "### 3.1 Write the manifest\n\n```json\n{\n  \"author\": \"\",\n  \"category\": \"testing\",\n  \"dependencies\": [],\n  \"description\": \"Failure-path doc-test fixture (QML-only app)\",\n  \"display_name\": \"Failure Demo\",\n  \"icon\": \"\",\n  \"main\": {},\n  \"manifestVersion\": \"0.3.0\",\n  \"name\": \"test_failpath_qml\",\n  \"type\": \"ui_qml\",\n  \"version\": \"0.1.1\",\n  \"view\": \"Main.qml\"\n}\n```"}, {"execs": [{"cmd": "write build/failpath/payload/metadata.json", "kind": "file", "note": "Wrote build/failpath/payload/metadata.json", "status": "pass"}], "md": "### 3.2 Write the module metadata\n\n```json\n{\n  \"name\": \"test_failpath_qml\",\n  \"display_name\": \"Failure Demo\",\n  \"version\": \"0.1.1\",\n  \"type\": \"ui_qml\",\n  \"category\": \"testing\",\n  \"description\": \"Failure-path doc-test fixture (QML-only app)\",\n  \"view\": \"Main.qml\",\n  \"dependencies\": []\n}\n```"}, {"execs": [{"cmd": "write build/failpath/payload/Main.qml", "kind": "file", "note": "Wrote build/failpath/payload/Main.qml", "status": "pass"}], "md": "### 3.3 Write the QML view\n\n```qml\nimport QtQuick\n\nRectangle {\n    id: root\n    color: \"#1e1e1e\"\n    Text {\n        anchors.centerIn: parent\n        text: \"Failure demo view v0.1.1\"\n        color: \"#ffffff\"\n        font.pixelSize: 24\n    }\n}\n```"}, {"execs": [{"cmd": "write build/failpath/payload/qmldir", "kind": "file", "note": "Wrote build/failpath/payload/qmldir", "status": "pass"}], "md": "### 3.4 Write the qmldir\n\n```text\nmodule com.logos.module.test_failpath_qml\n```"}, {"execs": [{"cmd": "case \"$(uname -s) $(uname -m)\" in\n  \"Linux x86_64\")   VARIANT=linux-x86_64 ;;\n  \"Linux aarch64\")  VARIANT=linux-arm64 ;;\n  \"Darwin arm64\")   VARIANT=darwin-arm64 ;;\n  \"Darwin x86_64\")  VARIANT=darwin-x86_64 ;;\n  *) echo \"unsupported platform: $(uname -sm)\" >&2; exit 1 ;;\nesac\nchmod -R u+w /tmp/basecamp-failpath 2>/dev/null || true\nrm -rf /tmp/basecamp-failpath\nmkdir -p /tmp/basecamp-failpath\nseed=\"build/failpath/seed\"\nrm -rf \"$seed\"\nmkdir -p \"$seed/variants\"\ncp build/failpath/manifest.json \"$seed/manifest.json\"\ntar --format ustar -C \"$seed\" -czf /tmp/basecamp-failpath/test_failpath_qml-0.1.1.lgx manifest.json variants\n./result-lgx/bin/lgx add /tmp/basecamp-failpath/test_failpath_qml-0.1.1.lgx \\\n  --variant \"$VARIANT\" --files build/failpath/payload -y\n./result-lgx/bin/lgx verify /tmp/basecamp-failpath/test_failpath_qml-0.1.1.lgx\nhead -c 400 /tmp/basecamp-failpath/test_failpath_qml-0.1.1.lgx \\\n  > /tmp/basecamp-failpath/test_failpath_qml-truncated.lgx\nprintf 'This is not an LGX package, whatever the extension claims.\\n' \\\n  > /tmp/basecamp-failpath/not-a-package.lgx\nchmod -R u+w testdata/failpath-user 2>/dev/null || true\nrm -rf testdata/failpath-user\nmkdir -p testdata/failpath-user/modules testdata/failpath-user/plugins\nls /tmp/basecamp-failpath\n", "exit_code": 0, "kind": "run", "note": "", "output": "Added variant 'linux-x86_64' to /tmp/basecamp-failpath/test_failpath_qml-0.1.1.lgx\nPackage structure is valid: /tmp/basecamp-failpath/test_failpath_qml-0.1.1.lgx\nPackage is unsigned\nnot-a-package.lgx\ntest_failpath_qml-0.1.1.lgx\ntest_failpath_qml-truncated.lgx\n", "status": "pass"}], "md": "### 3.5 Pack the valid .lgx, then derive the two broken files\n\nBuild the valid package (`lgx verify` proves it), then break it:\n\n- **`test_failpath_qml-truncated.lgx`** \u2014 the first 400 bytes of the\n  valid package. That's a well-formed gzip *header* followed by a\n  cliff: exactly what an interrupted download leaves behind.\n- **`not-a-package.lgx`** \u2014 a sentence of plain text with an `.lgx`\n  extension. Not gzip, not tar, not close.\n\nEverything lands at a **fixed absolute path**\n(`/tmp/basecamp-failpath/`) because the UI run passes these paths\ninto the app over the inspector, where a relative path would be\nambiguous. A fresh, empty `--user-dir` is created alongside \u2014 and\nsince nothing in this spec ever completes an install, it is expected\nto stay empty.\n\n```bash\ncase \"$(uname -s) $(uname -m)\" in\n  \"Linux x86_64\")   VARIANT=linux-x86_64 ;;\n  \"Linux aarch64\")  VARIANT=linux-arm64 ;;\n  \"Darwin arm64\")   VARIANT=darwin-arm64 ;;\n  \"Darwin x86_64\")  VARIANT=darwin-x86_64 ;;\n  *) echo \"unsupported platform: $(uname -sm)\" >&2; exit 1 ;;\nesac\nchmod -R u+w /tmp/basecamp-failpath 2>/dev/null || true\nrm -rf /tmp/basecamp-failpath\nmkdir -p /tmp/basecamp-failpath\nseed=\"build/failpath/seed\"\nrm -rf \"$seed\"\nmkdir -p \"$seed/variants\"\ncp build/failpath/manifest.json \"$seed/manifest.json\"\ntar --format ustar -C \"$seed\" -czf /tmp/basecamp-failpath/test_failpath_qml-0.1.1.lgx manifest.json variants\n./result-lgx/bin/lgx add /tmp/basecamp-failpath/test_failpath_qml-0.1.1.lgx \\\n  --variant \"$VARIANT\" --files build/failpath/payload -y\n./result-lgx/bin/lgx verify /tmp/basecamp-failpath/test_failpath_qml-0.1.1.lgx\nhead -c 400 /tmp/basecamp-failpath/test_failpath_qml-0.1.1.lgx \\\n  > /tmp/basecamp-failpath/test_failpath_qml-truncated.lgx\nprintf 'This is not an LGX package, whatever the extension claims.\\n' \\\n  > /tmp/basecamp-failpath/not-a-package.lgx\nchmod -R u+w testdata/failpath-user 2>/dev/null || true\nrm -rf testdata/failpath-user\nmkdir -p testdata/failpath-user/modules testdata/failpath-user/plugins\nls /tmp/basecamp-failpath\n\n```"}, {"execs": [], "md": "## Step 4: Feed the broken files to the Package Manager\n\nLaunch the bundle headless against the empty user-dir and hand each\nbroken file to the bundled **Package Manager** app the way every local\ninstall starts: PMU's `installLocalPackage` slot (the code path behind\nits \"Select LGX Package\" file picker, which a headless driver can't\noperate), invoked via the inspector on the `pmui.BackendStore` hook with\nan explicit `file://` URL.\n\nFor a *valid* file this kicks off inspect \u2192 install gate \u2192 confirm \u2192\ninstall. For a broken file the very first step \u2014 reading the archive \u2014\nfails, and the flow is over before any gate could open. The assertions\nare therefore dialog-identity assertions: the **Install Failed** notice\n(and no other dialog) must become visible, carry the failing file's\nname, and quote the package manager's error. Buttons are clicked by\ntheir stable `objectName`s, and dialog identity is asserted via the\nper-mode dialog instances' `visible` properties \u2014 the same conventions\nthe package-lifecycle doc-test established."}, {"execs": [{"actions": [{"description": "App window opens with the sidebar visible: wait for ['Applications', 'Settings']", "duration_ms": 61, "index": 1, "status": "pass"}, {"description": "Open the Package Manager: click 'Package Manager'", "duration_ms": 0, "index": 2, "status": "pass"}, {"description": "The Package Manager view loads: wait for ['Manage your plugins and packages.']", "duration_ms": 513, "index": 3, "status": "pass"}, {"description": "Let its backend connections settle: sleep 3000ms", "duration_ms": 3003, "index": 4, "status": "pass"}, {"description": "Hand the truncated package to the Package Manager: call 'pmui.BackendStore'.installLocalPackage('file:///tmp/basecamp-failpath/test_failpath_qml-truncated.lgx')", "duration_ms": 17, "index": 5, "status": "pass"}, {"description": "Basecamp surfaces the failure \u2014 by name, with the error: wait for ['Install Failed', \"'test_failpath_qml-truncated.lgx' could not be installed. The package manager reported:\", 'Failed to load LGX package: Failed to load package: /tmp/basecamp-failpath/test_failpath_qml-truncated.lgx']", "duration_ms": 37, "index": 6, "status": "pass"}, {"description": "It is the Install Failed notice that is open: expect objectName='confirmationDialog.installError' .visible == True", "duration_ms": 13, "index": 7, "status": "pass"}, {"description": "\u2026and it carries the package manager's error: expect objectName='confirmationDialog.installError' .errorMessage == 'Failed to load LGX package: Failed to load package: /tmp/basecamp-failpath/test_failpath_qml-truncated.lgx'", "duration_ms": 9, "index": 8, "status": "pass"}, {"description": "Let the notice paint: sleep 1000ms", "duration_ms": 1040, "index": 9, "status": "pass"}, {"description": "\u2026and the install gate never opened: expect objectName='confirmationDialog.installGate' .visible == False", "duration_ms": 15, "index": 10, "status": "pass"}, {"description": "Dismiss the notice: click objectName='confirmationDialog.installError.confirm'", "duration_ms": 13, "index": 11, "status": "pass"}, {"description": "Let the dialog close: sleep 1000ms", "duration_ms": 1001, "index": 12, "status": "pass"}, {"description": "The notice is closed again: expect objectName='confirmationDialog.installError' .visible == False", "duration_ms": 15, "index": 13, "status": "pass"}, {"description": "Hand over the text file wearing an .lgx extension: call 'pmui.BackendStore'.installLocalPackage('file:///tmp/basecamp-failpath/not-a-package.lgx')", "duration_ms": 13, "index": 14, "status": "pass"}, {"description": "The same notice fires for the impostor file: wait for ['Install Failed', \"'not-a-package.lgx' could not be installed. The package manager reported:\", 'Failed to load LGX package: Failed to load package: /tmp/basecamp-failpath/not-a-package.lgx']", "duration_ms": 25, "index": 15, "status": "pass"}, {"description": "It is t <script>
  const DATA = JSON.parse(document.getElementById("report-data").textContent);
  if (window.marked) { marked.setOptions({ gfm: true, breaks: false }); }
  const mdToHtml = (s) => window.marked ? marked.parse(s || "") : ("<pre>" + (s || "") + "</pre>");

  const sum = DATA.summary;
  document.getElementById("summary").innerHTML =
    `<span class="pill pass">${sum.passed} passed</span> ` +
    (sum.failed ? `<span class="pill fail">${sum.failed} failed</span> ` : "") +
    (sum.skipped ? `<span class="pill skip">${sum.skipped} skipped</span>` : "");

  const picker = document.getElementById("picker");
  DATA.tutorials.forEach((t, i) => {
    const o = document.createElement("option");
    o.value = i; o.textContent = t.meta.name; picker.appendChild(o);
  });

  function execHtml(e) {
    const badge = `<span class="badge ${e.status}">${e.status.toUpperCase()}</span>`;
    const kind = `<span class="kind">${e.kind}${e.platform ? " · " + e.platform : ""}${e.exit_code !== undefined ? " · exit " + e.exit_code : ""}</span>`;
    let h = `<div class="exec"><div class="exec-head">${badge}${kind}</div>`;
    if (e.note) h += `<div class="note">${escapeHtml(e.note)}</div>`;
    if (e.cmd) h += `<pre class="cmd">${escapeHtml(e.cmd)}</pre>`;
    if (e.runner_cmd) h += `<pre class="cmd">${escapeHtml(e.runner_cmd)}</pre>`;
    if (e.actions) {
      const passed = e.actions.filter(a => a.status === "pass").length;
      h += `<div class="kind">UI actions: ${passed}/${e.actions.length} passed</div>`;
      h += `<table class="ui-actions"><tbody>`;
      for (const a of e.actions) {
        const label = a.status === "not_run" ? "NOT RUN" :
          a.status === "running" ? "INTERRUPTED" : a.status.toUpperCase();
        h += `<tr><td>${a.index}</td><td><span class="badge ${a.status}">${label}</span></td>`;
        h += `<td>${escapeHtml(a.description)}`;
        if (a.error) h += `<div class="note">${escapeHtml(a.error)}</div>`;
        h += `</td><td>${a.duration_ms !== undefined ? a.duration_ms + " ms" : ""}</td></tr>`;
      }
      h += `</tbody></table>`;
    }
    const out = (e.output || "").trim();
    if (out) {
      const long = out.split("\n").length > 12;
      if (long) {
        h += `<details><summary>output (${out.split("\n").length} lines)</summary><pre class="output">${escapeHtml(out)}</pre></details>`;
      } else {
        h += `<pre class="output">${escapeHtml(out)}</pre>`;
      }
    }
    h += `</div>`;
    return h;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  }

  function render(idx) {
    const t = DATA.tutorials[idx];
    const main = document.getElementById("main");
    main.innerHTML = "";
    const h = document.createElement("div");
    h.className = "tutorial-title";
    h.textContent = t.meta.name + "  —  " + t.meta.platform;
    main.appendChild(h);

    t.rows.forEach(row => {
      const isStructural = row.execs.length === 0 &&
        (/^#\s|^##\s/.test(row.md.trim()));
      const div = document.createElement("div");
      const hasExec = row.execs.length > 0;
      const hasFail = row.execs.some(e => e.status === "fail");
      div.className = "row" + (hasExec ? "" : (isStructural ? " section" : " preamble")) +
        (hasFail ? " has-fail" : "");

      const left = document.createElement("div");
      left.className = "col left";
      left.innerHTML = `<div class="md">${mdToHtml(row.md)}</div>`;
      div.appendChild(left);

      if (hasExec || !isStructural) {
        const right = document.createElement("div");
        right.className = "col right";
        if (hasExec) {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            row.execs.map(execHtml).join("");
        } else {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            `<div class="empty">No commands run for this step.</div>`;
        }
        div.appendChild(right);
      }
      main.appendChild(div);
    });

    addAnchors(main, slug(t.meta.name));
  }

  function slug(s) {
    return String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  }

  // Octicon "link" — the same glyph GitHub puts next to markdown headings.
  const LINK_ICON =
    '<svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d=' +
    '"M7.775 3.275a.75.75 0 0 0 1.06 1.06l1.25-1.25a2 2 0 1 1 2.83 2.83l-2.5 2.5a2 2 0 0 1-2.83 0 ' +
    '.75.75 0 0 0-1.06 1.06 3.5 3.5 0 0 0 4.95 0l2.5-2.5a3.5 3.5 0 0 0-4.95-4.95l-1.25 1.25Zm-4.69 ' +
    '9.64a2 2 0 0 1 0-2.83l2.5-2.5a2 2 0 0 1 2.83 0 .75.75 0 0 0 1.06-1.06 3.5 3.5 0 0 0-4.95 0l-2.5 ' +
    '2.5a3.5 3.5 0 0 0 4.95 4.95l1.25-1.25a.75.75 0 0 0-1.06-1.06l-1.25 1.25a2 2 0 0 1-2.83 0Z"></path></svg>';

  // Give every heading a stable slug id (deduplicated the way GitHub does, with
  // -1/-2 suffixes) and a permalink whose href is "#<tutorial>/<heading>".
  function addAnchors(container, tutSlug) {
    const used = new Map();
    const nodes = container.querySelectorAll(
      ".tutorial-title, .md h1, .md h2, .md h3, .md h4, .md h5, .md h6"
    );
    nodes.forEach(node => {
      const text = node.textContent.trim();
      const isTitle = node.classList.contains("tutorial-title");
      let href = "#" + tutSlug;
      if (!isTitle) {
        const base = slug(text) || "section";
        const n = (used.get(base) || 0) + 1;
        used.set(base, n);
        node.id = n > 1 ? base + "-" + n : base;
        href += "/" + node.id;
      }
      node.classList.add("heading-anchored");
      const a = document.createElement("a");
      a.className = "anchor";
      a.href = href;
      a.title = "Copy link to this section";
      a.setAttribute("aria-label", "Permalink: " + text);
      a.innerHTML = LINK_ICON;
      node.insertBefore(a, node.firstChild);
    });
  }

  let toastTimer = null;
  function toast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 1600);
  }

  // navigator.clipboard needs a secure context; reports are often opened over
  // file://, so fall back to the old execCommand path there.
  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(
        () => toast("Link copied"),
        () => toast(text)
      );
      return;
    }
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    toast(ok ? "Link copied" : text);
  }

  function scrollToId(id) {
    if (!id) { window.scrollTo(0, 0); return; }
    const el = document.getElementById(id);
    if (!el) return;
    el.scrollIntoView({ block: "start" });
    el.classList.remove("flash");
    void el.offsetWidth;  // restart the animation on a repeat click
    el.classList.add("flash");
  }

  document.addEventListener("click", ev => {
    const a = ev.target.closest && ev.target.closest("a.anchor");
    if (!a) return;
    ev.preventDefault();
    const href = a.getAttribute("href");
    copyText(location.href.split("#")[0] + href);
    if (location.hash === href) scrollToId(a.parentNode.id);
    else location.hash = href;  // hashchange scrolls
  });

  // "#<tutorial>" (name, slug, or index) optionally followed by "/<heading>".
  function parseHash() {
    const raw = decodeURIComponent(location.hash.replace(/^#/, ""));
    if (!raw) return { idx: 0, frag: "" };
    const cut = raw.indexOf("/");
    const tut = cut >= 0 ? raw.slice(0, cut) : raw;
    const frag = cut >= 0 ? raw.slice(cut + 1) : "";
    if (/^\d+$/.test(tut) && +tut < DATA.tutorials.length) return { idx: +tut, frag };
    const i = DATA.tutorials.findIndex(
      t => slug(t.meta.name) === tut || t.meta.name === tut
    );
    if (i >= 0) return { idx: i, frag };
    // No tutorial matched: treat a bare hash as a heading in the current one.
    return { idx: currentIdx >= 0 ? currentIdx : 0, frag: cut >= 0 ? frag : raw };
  }

  let currentIdx = -1;
  function show(idx, frag) {
    if (idx !== currentIdx) {
      picker.value = idx;
      render(idx);
      currentIdx = idx;
    }
    if (frag) requestAnimationFrame(() => scrollToId(frag));
  }
  picker.addEventListener("change", () => {
    location.hash = slug(DATA.tutorials[+picker.value].meta.name);
    show(+picker.value);
  });
  window.addEventListener("hashchange", () => {
    const h = parseHash();
    show(h.idx, h.frag);
  });
  const initial = parseHash();
  show(initial.idx, initial.frag);
  // Inlined screenshots have no intrinsic size until decoded, so the first
  // scroll can land short; re-anchor once everything has loaded.
  if (initial.frag) {
    window.addEventListener("load", () => scrollToId(initial.frag), { once: true });
  }
</script>
</body>
</html>
