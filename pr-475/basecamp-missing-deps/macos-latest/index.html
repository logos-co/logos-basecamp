<script id="report-data" type="application/json">{"generated_platform": "Darwin", "summary": {"failed": 0, "passed": 4, "skipped": 0}, "tutorials": [{"meta": {"name": "Missing dependencies in Basecamp: the sidebar marker and the load gate", "platform": "Darwin (ext=dylib)", "release": "(none)"}, "rows": [{"execs": [], "md": "# Missing dependencies in Basecamp: the sidebar marker and the load gate\n\nEvery app in [`logos-basecamp`](https://github.com/logos-co/logos-basecamp)\ndeclares the core modules it runs on top of, and Basecamp checks that they\nare all installed **before** it ever tries to load the app. When one is\nmissing, two things happen:\n\n1. The app's sidebar tile gets a **red-cross marker** \u2014 the app is\n   installed, but Basecamp already knows it cannot run.\n2. Clicking the tile does **not** attempt the load. Instead the\n   **Missing Dependencies** dialog opens and names exactly which modules\n   are absent \u2014 no cryptic \"plugin load failed\" after the fact.\n\nThis doc-test drives that flow end to end inside the real, shippable\nBasecamp bundle. The broken state is manufactured hermetically: a QML-only\napp is seeded into a throwaway `--user-dir` with a manifest that depends on\na core module which is installed nowhere. That is exactly the on-disk shape\nBasecamp has to survive in the wild \u2014 a dependency uninstalled out from\nunder an app, a hand-copied plugin directory, or the leftovers of a failed\ninstall.\n\nThe machinery under test is the dependency-information pipeline:\n`PackageCoordinator` asks the `package_manager` module to resolve each\ninstalled package's flat dependency tree, derives the missing set (every\nnode the resolver reports as `not_installed`), and hands it to\n`UIPluginManager`, whose load gate turns it into the sidebar marker\n(`hasMissingDeps`) and the `missingDeps` dialog.\n\n**What you'll build:** The inspector-enabled Basecamp bundle and the logos-qt-mcp UI driver, a\nhand-crafted \"installed\" QML-only app whose manifest depends on a core\nmodule that does not exist, and a headless UI run that proves the sidebar\nflags the app, the click raises the Missing Dependencies dialog naming the\nabsent module, and the load is never attempted.\n\n\n**What you'll learn:**\n\n- How an installed package declares its core-module dependencies (`dependencies` in `manifest.json`) and what an installed plugin looks like on disk\n- How Basecamp resolves dependency status for every installed package at startup, and where \"missing\" comes from (`resolveFlatDependencies` nodes reported `not_installed`)\n- What the sidebar's red-cross marker means and when it appears\n- Why clicking a broken app is safe \u2014 the load gate shows the **Missing Dependencies** dialog instead of attempting a load that the runtime would refuse\n- How to assert non-textual UI state headlessly with logos-qt-mcp (`expect_property` on stable objectNames, not screenshots alone)\n\n## Prerequisites\n\n- **Nix** with flakes enabled. Install from [nixos.org](https://nixos.org/download.html), then enable flakes:\n\n```bash\nmkdir -p ~/.config/nix\necho 'experimental-features = nix-command flakes' >> ~/.config/nix/nix.conf\n```\n\nVerify: `nix flake --help >/dev/null 2>&1 && echo \"Flakes enabled\"`\n\n- **Linux, macOS or Windows.** The app runs headless via `QT_QPA_PLATFORM=offscreen`, so no display is required. Network access is only needed to fetch the flakes and the Nix binary cache \u2014 the run itself is offline.\n- **Windows:** the two outputs the build steps below link, staged as `bin-bundle-dir-inspector/` and `logos-qt-mcp/`, plus Git Bash, Python 3 and Node.js."}, {"execs": [], "md": "## How a dependency goes missing\n\nAn installed package is just a directory under the user dir's\n`plugins/` (or `modules/` for core modules) with a `manifest.json` at\nits root. The manifest's `dependencies` array names the core modules\nthe package needs, each entry referencing the target's canonical\n`name`:\n\n```\nmissing_deps_demo    (UI plugin, \"Missing Deps Demo\")\n    \u2514\u2500\u25ba demo_core_module    (core module \u2014 installed NOWHERE)\n```\n\nNothing ties those directories together transactionally \u2014 a dependency\ncan be uninstalled while its dependents stay behind, a plugin directory\ncan be copied in by hand, a failed install can leave a partial set.\nBasecamp therefore never trusts that an installed app is loadable: at\nstartup (and after every package operation) it resolves each installed\npackage's full dependency tree and records every node the resolver\ncannot find as *missing*.\n\nFor this doc-test we simply create the broken end state directly: the\ndemo app is written into a fresh `--user-dir` as an already-installed\npackage, with a dependency on `demo_core_module` \u2014 a name that no\nmodule anywhere provides. The package scanner only reads\n`manifest.json`, so a hand-written directory is indistinguishable from\nthe leftovers of a real install gone wrong."}, {"execs": [], "md": "## Step 1: Build the UI test driver\n\n[`logos-qt-mcp`](https://github.com/logos-co/logos-qt-mcp) is the harness\nthe doc-test uses to connect to the app's QML inspector and drive it."}, {"execs": [{"cmd": "if [ -n \"${BASECAMP_QT_MCP:-}\" ]; then ln -sfn \"$BASECAMP_QT_MCP\" logos-qt-mcp\nelse nix build 'github:logos-co/logos-basecamp/de1a83939aa17fdc7cf3739a4570ff7bdb9cfadd#logos-qt-mcp' -o logos-qt-mcp; fi\n", "exit_code": 0, "kind": "run", "note": "", "output": "", "status": "pass"}], "md": "### 1.1 Build logos-qt-mcp\n\n```bash\nnix build 'github:logos-co/logos-basecamp/de1a83939aa17fdc7cf3739a4570ff7bdb9cfadd#logos-qt-mcp' -o logos-qt-mcp\n```"}, {"execs": [], "md": "## Step 2: Build the Basecamp bundle\n\nBuild **this** basecamp commit as the portable bundle \u2014 the same\nself-contained directory you ship, with the QML inspector compiled in so\nthe driver can attach (`#bin-bundle-dir-inspector`, the inspector-enabled\ntwin of `#bin-bundle-dir`). The bundle carries the `package_manager`\nmodule that performs the dependency resolution under test."}, {"execs": [{"cmd": "if [ -n \"${BASECAMP_BUNDLE:-}\" ]; then ln -sfn \"$BASECAMP_BUNDLE\" bin-bundle-dir-inspector\nelse nix build \"${BASECAMP_FLAKE:-github:logos-co/logos-basecamp/de1a83939aa17fdc7cf3739a4570ff7bdb9cfadd}#bin-bundle-dir-inspector\" -o bin-bundle-dir-inspector; fi\n", "exit_code": 0, "kind": "run", "note": "", "output": "", "status": "pass"}], "md": "### 2.1 Build the bundle\n\n```bash\n# From inside the clone this is simply: nix build '.#bin-bundle-dir-inspector'\nnix build 'github:logos-co/logos-basecamp/de1a83939aa17fdc7cf3739a4570ff7bdb9cfadd#bin-bundle-dir-inspector' -o bin-bundle-dir-inspector\n```"}, {"execs": [], "md": "## Step 3: Seed the broken app\n\nWrite the four files of an installed QML-only app. The manifest's\n`display_name` (\"Missing Deps Demo\") is what the sidebar shows; its\n`dependencies` names the phantom `demo_core_module`. The QML view\nrenders a give-away message \u2014 if it ever appears on screen, the load\ngate failed."}, {"execs": [{"cmd": "write build/missing-deps/manifest.json", "kind": "file", "note": "Wrote build/missing-deps/manifest.json", "status": "pass"}], "md": "### 3.1 Write the package manifest\n\nThe root `manifest.json` \u2014 the one file the package scanner\nrequires. A real install also stamps content hashes and a `variant`\nfile into the directory; neither is read when enumerating installed\npackages, so the fixture stays minimal:\n\n```json\n{\n  \"author\": \"\",\n  \"category\": \"testing\",\n  \"dependencies\": [\"demo_core_module\"],\n  \"description\": \"Missing-dependencies doc-test fixture (QML-only app)\",\n  \"display_name\": \"Missing Deps Demo\",\n  \"icon\": \"\",\n  \"main\": {},\n  \"manifestVersion\": \"0.3.0\",\n  \"name\": \"missing_deps_demo\",\n  \"type\": \"ui_qml\",\n  \"version\": \"0.1.0\",\n  \"view\": \"Main.qml\"\n}\n```"}, {"execs": [{"cmd": "write build/missing-deps/metadata.json", "ki <script>
  const DATA = JSON.parse(document.getElementById("report-data").textContent);
  if (window.marked) { marked.setOptions({ gfm: true, breaks: false }); }
  const mdToHtml = (s) => window.marked ? marked.parse(s || "") : ("<pre>" + (s || "") + "</pre>");

  const sum = DATA.summary;
  document.getElementById("summary").innerHTML =
    `<span class="pill pass">${sum.passed} passed</span> ` +
    (sum.failed ? `<span class="pill fail">${sum.failed} failed</span> ` : "") +
    (sum.skipped ? `<span class="pill skip">${sum.skipped} skipped</span>` : "");

  const picker = document.getElementById("picker");
  DATA.tutorials.forEach((t, i) => {
    const o = document.createElement("option");
    o.value = i; o.textContent = t.meta.name; picker.appendChild(o);
  });

  function execHtml(e) {
    const badge = `<span class="badge ${e.status}">${e.status.toUpperCase()}</span>`;
    const kind = `<span class="kind">${e.kind}${e.platform ? " · " + e.platform : ""}${e.exit_code !== undefined ? " · exit " + e.exit_code : ""}</span>`;
    let h = `<div class="exec"><div class="exec-head">${badge}${kind}</div>`;
    if (e.note) h += `<div class="note">${escapeHtml(e.note)}</div>`;
    if (e.cmd) h += `<pre class="cmd">${escapeHtml(e.cmd)}</pre>`;
    if (e.runner_cmd) h += `<pre class="cmd">${escapeHtml(e.runner_cmd)}</pre>`;
    if (e.actions) {
      const passed = e.actions.filter(a => a.status === "pass").length;
      h += `<div class="kind">UI actions: ${passed}/${e.actions.length} passed</div>`;
      h += `<table class="ui-actions"><tbody>`;
      for (const a of e.actions) {
        const label = a.status === "not_run" ? "NOT RUN" :
          a.status === "running" ? "INTERRUPTED" : a.status.toUpperCase();
        h += `<tr><td>${a.index}</td><td><span class="badge ${a.status}">${label}</span></td>`;
        h += `<td>${escapeHtml(a.description)}`;
        if (a.error) h += `<div class="note">${escapeHtml(a.error)}</div>`;
        h += `</td><td>${a.duration_ms !== undefined ? a.duration_ms + " ms" : ""}</td></tr>`;
      }
      h += `</tbody></table>`;
    }
    const out = (e.output || "").trim();
    if (out) {
      const long = out.split("\n").length > 12;
      if (long) {
        h += `<details><summary>output (${out.split("\n").length} lines)</summary><pre class="output">${escapeHtml(out)}</pre></details>`;
      } else {
        h += `<pre class="output">${escapeHtml(out)}</pre>`;
      }
    }
    h += `</div>`;
    return h;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  }

  function render(idx) {
    const t = DATA.tutorials[idx];
    const main = document.getElementById("main");
    main.innerHTML = "";
    const h = document.createElement("div");
    h.className = "tutorial-title";
    h.textContent = t.meta.name + "  —  " + t.meta.platform;
    main.appendChild(h);

    t.rows.forEach(row => {
      const isStructural = row.execs.length === 0 &&
        (/^#\s|^##\s/.test(row.md.trim()));
      const div = document.createElement("div");
      const hasExec = row.execs.length > 0;
      const hasFail = row.execs.some(e => e.status === "fail");
      div.className = "row" + (hasExec ? "" : (isStructural ? " section" : " preamble")) +
        (hasFail ? " has-fail" : "");

      const left = document.createElement("div");
      left.className = "col left";
      left.innerHTML = `<div class="md">${mdToHtml(row.md)}</div>`;
      div.appendChild(left);

      if (hasExec || !isStructural) {
        const right = document.createElement("div");
        right.className = "col right";
        if (hasExec) {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            row.execs.map(execHtml).join("");
        } else {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            `<div class="empty">No commands run for this step.</div>`;
        }
        div.appendChild(right);
      }
      main.appendChild(div);
    });

    addAnchors(main, slug(t.meta.name));
  }

  function slug(s) {
    return String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  }

  // Octicon "link" — the same glyph GitHub puts next to markdown headings.
  const LINK_ICON =
    '<svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d=' +
    '"M7.775 3.275a.75.75 0 0 0 1.06 1.06l1.25-1.25a2 2 0 1 1 2.83 2.83l-2.5 2.5a2 2 0 0 1-2.83 0 ' +
    '.75.75 0 0 0-1.06 1.06 3.5 3.5 0 0 0 4.95 0l2.5-2.5a3.5 3.5 0 0 0-4.95-4.95l-1.25 1.25Zm-4.69 ' +
    '9.64a2 2 0 0 1 0-2.83l2.5-2.5a2 2 0 0 1 2.83 0 .75.75 0 0 0 1.06-1.06 3.5 3.5 0 0 0-4.95 0l-2.5 ' +
    '2.5a3.5 3.5 0 0 0 4.95 4.95l1.25-1.25a.75.75 0 0 0-1.06-1.06l-1.25 1.25a2 2 0 0 1-2.83 0Z"></path></svg>';

  // Give every heading a stable slug id (deduplicated the way GitHub does, with
  // -1/-2 suffixes) and a permalink whose href is "#<tutorial>/<heading>".
  function addAnchors(container, tutSlug) {
    const used = new Map();
    const nodes = container.querySelectorAll(
      ".tutorial-title, .md h1, .md h2, .md h3, .md h4, .md h5, .md h6"
    );
    nodes.forEach(node => {
      const text = node.textContent.trim();
      const isTitle = node.classList.contains("tutorial-title");
      let href = "#" + tutSlug;
      if (!isTitle) {
        const base = slug(text) || "section";
        const n = (used.get(base) || 0) + 1;
        used.set(base, n);
        node.id = n > 1 ? base + "-" + n : base;
        href += "/" + node.id;
      }
      node.classList.add("heading-anchored");
      const a = document.createElement("a");
      a.className = "anchor";
      a.href = href;
      a.title = "Copy link to this section";
      a.setAttribute("aria-label", "Permalink: " + text);
      a.innerHTML = LINK_ICON;
      node.insertBefore(a, node.firstChild);
    });
  }

  let toastTimer = null;
  function toast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 1600);
  }

  // navigator.clipboard needs a secure context; reports are often opened over
  // file://, so fall back to the old execCommand path there.
  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(
        () => toast("Link copied"),
        () => toast(text)
      );
      return;
    }
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    toast(ok ? "Link copied" : text);
  }

  function scrollToId(id) {
    if (!id) { window.scrollTo(0, 0); return; }
    const el = document.getElementById(id);
    if (!el) return;
    el.scrollIntoView({ block: "start" });
    el.classList.remove("flash");
    void el.offsetWidth;  // restart the animation on a repeat click
    el.classList.add("flash");
  }

  document.addEventListener("click", ev => {
    const a = ev.target.closest && ev.target.closest("a.anchor");
    if (!a) return;
    ev.preventDefault();
    const href = a.getAttribute("href");
    copyText(location.href.split("#")[0] + href);
    if (location.hash === href) scrollToId(a.parentNode.id);
    else location.hash = href;  // hashchange scrolls
  });

  // "#<tutorial>" (name, slug, or index) optionally followed by "/<heading>".
  function parseHash() {
    const raw = decodeURIComponent(location.hash.replace(/^#/, ""));
    if (!raw) return { idx: 0, frag: "" };
    const cut = raw.indexOf("/");
    const tut = cut >= 0 ? raw.slice(0, cut) : raw;
    const frag = cut >= 0 ? raw.slice(cut + 1) : "";
    if (/^\d+$/.test(tut) && +tut < DATA.tutorials.length) return { idx: +tut, frag };
    const i = DATA.tutorials.findIndex(
      t => slug(t.meta.name) === tut || t.meta.name === tut
    );
    if (i >= 0) return { idx: i, frag };
    // No tutorial matched: treat a bare hash as a heading in the current one.
    return { idx: currentIdx >= 0 ? currentIdx : 0, frag: cut >= 0 ? frag : raw };
  }

  let currentIdx = -1;
  function show(idx, frag) {
    if (idx !== currentIdx) {
      picker.value = idx;
      render(idx);
      currentIdx = idx;
    }
    if (frag) requestAnimationFrame(() => scrollToId(frag));
  }
  picker.addEventListener("change", () => {
    location.hash = slug(DATA.tutorials[+picker.value].meta.name);
    show(+picker.value);
  });
  window.addEventListener("hashchange", () => {
    const h = parseHash();
    show(h.idx, h.frag);
  });
  const initial = parseHash();
  show(initial.idx, initial.frag);
  // Inlined screenshots have no intrinsic size until decoded, so the first
  // scroll can land short; re-anchor once everything has loaded.
  if (initial.frag) {
    window.addEventListener("load", () => scrollToId(initial.frag), { once: true });
  }
</script>
</body>
