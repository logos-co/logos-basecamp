<script id="report-data" type="application/json">{"generated_platform": "Darwin", "summary": {"failed": 0, "passed": 12, "skipped": 1}, "tutorials": [{"meta": {"name": "Basecamp's dependency gate: every verdict, against the real binary", "platform": "Darwin (ext=dylib)", "release": "(none)"}, "rows": [{"execs": [], "md": "# Basecamp's dependency gate: every verdict, against the real binary\n\nBefore Basecamp loads an app it asks the `package_manager` module to resolve\nthat app's dependencies, and refuses the load if any of them is unusable.\n\"Unusable\" is not one thing. A dependency can be **absent**, **installed at a\nversion the app does not accept**, or **installed under the right name but\npublished by somebody else** \u2014 three different problems, three different\nthings the user has to do about them, and one identical observable if the UI\nonly says \"blocked\".\n\nThe companion doc-test\n([basecamp-missing-deps](./basecamp-missing-deps.md)) covers the absent case\non its own. This one drives the **whole verdict matrix** through the real,\nshippable bundle in a single launch \u2014 including the two verdicts that must\n**not** block, because a gate that refuses everything is not a gate.\n\n| dependency's state | verdict | gate |\n|---|---|---|\n| installed, version satisfies the range | `installed` | **admits** |\n| installed, signed by the pinned key | `installed` | **admits** |\n| installed, nothing records who published it | `signer_unknown` | **admits** |\n| not installed anywhere | `not_installed` | **blocks** |\n| installed at a version the range rejects | `version_mismatch` | **blocks** |\n| installed, signed by a different key | `signer_mismatch` | **blocks** |\n\nThe last admitting row is deliberate, not an oversight. Embedded packages are\nplaced by the build and never pass through the installer that writes a\n`manifest.sig`, so they can never carry one; blocking on \"we could not check\"\nwould make a signer pin on an embedded dependency unsatisfiable forever.\n\nThe fixtures are real: two Ed25519 publisher keys from `lgx keygen`, **both\nanchored in the keyring**, so trust cannot be the discriminator between the\nadmitting and the blocking signer case \u2014 only identity can.\n\n**What you'll build:** The inspector-enabled Basecamp bundle, the logos-qt-mcp UI driver, two real\npublisher keys, one genuinely compiled core module signed by one of them and\ninstalled with signature verification on, seven hand-seeded QML-only apps\npinning that module (and an embedded one) seven different ways, and a single\nheadless UI run that clicks all seven and asserts the specific verdict each\none produces.\n\n\n**What you'll learn:**\n\n- The closed vocabulary the resolver reports per dependency (`installed`, `not_installed`, `version_mismatch`, `signer_mismatch`, `signer_unknown`) and which of them refuse a load\n- How a manifest pins a dependency's version range and its publisher (`{\"name\": \u2026, \"version\": \"^2.0.0\", \"signer\": \"did:jwk:\u2026\"}`)\n- Why `signer_unknown` admits \u2014 and why tightening it would break every pin on an embedded package\n- That the three refusals are told apart in the UI by title, body and detail clause, not just by \"blocked\"\n- How to build, sign, and install a real fixture module (`lgx keygen` / `lgx sign` / `lgx keyring add` / `lgpm --require-signatures`)\n\n## Prerequisites\n\n- **Nix** with flakes enabled. Install from [nixos.org](https://nixos.org/download.html), then enable flakes:\n\n```bash\nmkdir -p ~/.config/nix\necho 'experimental-features = nix-command flakes' >> ~/.config/nix/nix.conf\n```\n\nVerify: `nix flake --help >/dev/null 2>&1 && echo \"Flakes enabled\"`\n\n- **Windows:** the outputs the build steps below link, staged as `bin-bundle-dir-inspector/`, `logos-qt-mcp/`, `lgx/`, `lgpm/` and `depsvc-lgx/`, plus Git Bash, Python 3 and Node.js.\n- **Linux, macOS or Windows.** The app runs headless via `QT_QPA_PLATFORM=offscreen`, so no display is required. Network access is only needed to fetch the flakes and the Nix binary cache \u2014 the run itself is offline."}, {"execs": [], "md": "## Seven apps, one dependency, seven pins\n\nEvery fixture app is a QML-only (`ui_qml`) package seeded straight into a\nthrowaway `--user-dir` \u2014 the same on-disk shape an install leaves behind,\nand what the package scanner reads. They differ only in what their\nmanifest's `dependencies` array pins:\n\n```\nadmits                                                    verdict\n  dg_ok_exact     \u2500\u25ba capability_module  ^1.0.0            installed\n  dg_ok_range     \u2500\u25ba depsvc             ^2.0.0            installed\n  dg_ok_signer    \u2500\u25ba depsvc  ^2.0.0 + signer publisher-b  installed\n  dg_ok_unsigned  \u2500\u25ba capability_module  ^1.0.0\n                                       + signer publisher-a  signer_unknown\n\nblocks\n  dg_absent       \u2500\u25ba dg_phantom_module  ^1.0.0            not_installed\n  dg_mismatch     \u2500\u25ba depsvc             ^3.0.0            version_mismatch\n  dg_signer_bad   \u2500\u25ba depsvc  ^2.0.0 + signer publisher-a  signer_mismatch\n```\n\nTwo dependencies carry the whole matrix. **`capability_module`** ships\ninside the bundle at 1.0.0 and \u2014 like every embedded package \u2014 has no\n`manifest.sig`, which is what makes `dg_ok_unsigned` a `signer_unknown`\npin rather than a mismatch. **`depsvc`** is built here as a real,\nloadable core module at 2.1.0 and signed by `publisher-b`; the three apps\nthat point at it get three different answers from the same installed\nbytes.\n\n`depsvc` is compiled rather than faked because the four admitting apps\nassert they *actually load*. A dummy payload admits at the gate and then\ndies in the runtime, which would prove the opposite of what is wanted."}, {"execs": [], "md": "## Step 1: Build the tools\n\nThe UI driver, the packaging CLI (keys, signing, `.lgx`), and the local\npackage installer. The installer must be the **portab bundle-dir-inspector; fi\n", "exit_code": 0, "kind": "run", "note": "", "output": "", "status": "pass"}], "md": "### 2.1 Build the bundle\n\n```bash\n# From inside the clone this is simply: nix build '.#bin-bundle-dir-inspector'\nnix build 'github:logos-co/logos-basecamp/8eaf67b7d89df30a5da76ba3b9e9bd84c25d3edc#bin-bundle-dir-inspector' -o bin-bundle-dir-inspector\n```"}, {"execs": [], "md": "## Step 3: Two publishers, both trusted\n\nGenerate two real Ed25519 publisher identities and anchor **both** in the\nkeyring. Anchoring both is the point: the difference between\n`dg_ok_signer` and `dg_signer_bad` is then purely *which* key signed the\ninstalled package, not whether that key is trusted at all.\n\n(A pin must carry a real key. A placeholder DID with no `x` member is an\nunparseable pin, which also reports `signer_mismatch` \u2014 a suite built on\none stays green while documenting the wrong cause.)"}, {"execs": [{"cmd": "rm -rf build/depgate\nmkdir -p build/depgate/keys build/depgate/keyring\n./lgx/bin/lgx keygen --name publisher-a --output-dir build/depgate/keys\n./lgx/bin/lgx keygen --name publisher-b --output-dir build/depgate/keys\n./lgx/bin/lgx keyring add publisher-a \"$(cat build/depgate/keys/publisher-a.did)\" --dir build/depgate/keyring\n./lgx/bin/lgx keyring add publisher-b \"$(cat build/depgate/keys/publisher-b.did)\" --dir build/depgate/keyring\n# A pin with no `x` member is unparseable, and reports signer_mismatch\n# for the wrong reason \u2014 the suite would stay green documenting it.\nfor k in publisher-a publisher-b; do\n  printf '%s' \"$(cat build/depgate/keys/$k.did)\" | sed 's/^did:jwk://' \\\n    | tr '_-' '/+' | base64 -d 2>/dev/null | grep -q '\"x\"' \\\n    || { echo \"FATAL: $k.did carries no public key\"; exit 1; }\ndone\necho \"both DIDs carry a public key\"\n./lgx/bin/lgx keyring list --dir build/depgate/keyring\n", "exit_code": 0, "kind": "run", "note": "", "output": "did:jwk:eyJjcnYiOiJFZDI1NTE5Iiwia3R5IjoiT0tQIiwieCI6Ik55am5YQTBOaVN1MDNiUGtjaUF4bkVRMF9tLUNNS1FvOGRtZ0lwenAxWTgifQ\nKeypair generated: build/depgate/keys/publisher-a.{jwk,pub,did}\ndid:jwk:eyJjcnYiOiJFZDI1NTE5Iiwia3R5IjoiT0tQIiwieCI6IndydXBCS2s3QjZWZUZtRUNNN01HZWs3Y1d2cDZOOS1VMUd0cFNLU0k3dkEifQ\nKeypair generated: build/depgate/keys/publisher-b.{jwk,pub,did}\nAdded trusted key: publisher-a\nDID: did:jwk:eyJjcnYiOiJFZDI1NTE5Iiwia3R5IjoiT0tQIiwieCI6Ik55am5YQTBOaVN1MDNiUGtjaUF4bkVRMF9tLUNNS1FvOGRtZ0lwenAxWTgifQ\nAdded trusted key: publisher-b\nDID: did:jwk:eyJjcnYiOiJFZDI1NTE5Iiwia3R5IjoiT0tQIiwieCI6IndydXBCS2s3QjZWZUZtRUNNN01HZWs3Y1d2cDZOOS1VMUd0cFNLU0k3dkEifQ\nboth DIDs carry a public key\npublisher-a\n  DID: did:jwk:eyJjcnYiOiJFZDI1NTE5Iiwia3R5IjoiT0tQIiwieCI6Ik55a...\n  Added: 2026-10-28T11:02:33Z\npublisher-b\n  DID: did:jwk:eyJjcnYiOiJFZDI1NTE5Iiwia3R5IjoiT0tQIiwieCI6Indyd...\n  Added: 2026-10-28T11:02:33Z\n", "status": "pass"}], "md": "### 3.1 Generate and anchor the keys\n\n```bash\nrm -rf build/depgate\nmkdir -p build/depgate/keys build/depgate/keyring\n./lgx/bin/lgx keygen --name publisher-a --output-dir build/depgate/keys\n./lgx/bin/lgx keygen --name publisher-b --output-dir build/depgate/keys\n./lgx/bin/lgx keyring add publisher-a \"$(cat build/depgate/keys/publisher-a.did)\" --dir build/depgate/keyring\n./lgx/bin/lgx keyring add publisher-b \"$(cat build/depgate/keys/publisher-b.did)\" --dir build/depgate/keyring\n# A pin with no `x` member is unparseable, and reports signer_mismatch\n# for the wrong reason \u2014 the suite would stay green documenting it.\nfor k in publisher-a publisher-b; do\n  printf '%s' \"$(cat build/depgate/keys/$k.did)\" | sed 's/^did:jwk://' \\\n    | tr '_-' '/+' | base64 -d 2>/dev/null | grep -q '\"x\"' \\\n    || { echo \"FATAL: $k.did carries no public key\"; exit 1; }\ndone\necho \"both DIDs carry a public key\"\n./lgx/bin/lgx keyring list --dir build/depgate/keyring\n\n```"}, {"execs": [], "md": "## Step 4: Build, sign and install the dependency\n\n`depsvc` is an ordinary universal module \u2014 the same five files\n`nix flake init -t github:logos-co/logos-module-builder` scaffolds. Only\n`metadata.json` matters to the gate (name, version, type), but the module\nis really compiled so the apps that depend on it really load."}, {"execs": [{"cmd": "write build/depgate/depsvc/metadata.json", "kind": "file", "note": "Wrote build/depgate/depsvc/metadata.json", "status": "pass"}], "md": "### 4.1 Write the module's identity\n\n`version` 2.1.0 is what makes `^2.0.0` a match and `^3.0.0` a\nmismatch; `display_name` is what the blocked dialog will name.\n\n```json\n{\n  \"name\": \"depsvc\",\n  \"display_name\": \"Dep Service\",\n  \"version\": \"2.1.0\",\n  \"type\": \"core\",\n  \"interface\": \"universal\",\n  \"category\": \"testing\",\n  \"description\": \"Dependency-gate doc-test fixture: the module every pin points at\",\n  \"main\": \"depsvc_plugin\",\n  \"dependencies\": []\n}\n```"}, {"execs": [{"cmd": "write build/depgate/depsvc/flake.nix", "kind": "file", "note": "Wrote build/depgate/depsvc/flake.nix", "status": "pass"}], "md": "### 4.2 Write the flake\n\n```nix\n{\n  description = \"Dependency-gate doc-test fixture module\";\n\n  inputs.logos-module-builder.url = \"github:logos-co/logos-module-builder\";\n\n  outputs = inputs@{ logos-module-builder, ... }:\n    logos-module-builder.lib.mkLogosModule {\n      src = ./.;\n      configFile = ./metadata.json;\n      flakeInputs = inputs;\n    };\n}\n```"}, {"execs": [{"cmd": "write build/depgate/depsvc/CMakeLists.txt", "kind": "file", "note": "Wrote build/depgate/depsvc/CMakeLists.txt", "status": "pass"}], "md": "### 4.3 Write the CMakeLists\n\n```cmake\ncmake_minimum_required(VERSION 3.14)\nproject(DepsvcModulePlugin LANGUAGES CXX)\n\ninclude($ENV{LOGOS_MODULE_BUILDER_ROOT}/cmake/LogosModule.cmake)\n\nfile(READ \"${CMAKE_CURRENT_SOURCE_DIR}/metadata.json\" METADATA_JSON)\nstring(JSON MODULE_NAME GET ${METADATA_JSON} name)\n\nlogos_module(\n    NAME ${MODULE_NAME}\n    SOURCES\n        src/depsvc_impl.h\n        src/depsvc_impl.cpp\n)\n```"}, {"execs": [{"cmd": "write build/depgate/depsvc/src/depsvc_impl.h", "kind": "file", "note": "Wrote build/depgate/depsvc/src/depsvc_impl.h", "status": "pass"}], "md": "### 4.4 Write the implementation\n\nThe public methods are the module's API; the Qt plugin glue is\ngenerated from this header.\n\n```cpp\n#pragma once\n\n#include <string>\n#include \"logos_module_context.h\"\n\nclass DepsvcImpl : public LogosModuleContext\n{\npublic:\n    std::string getStatus();\n};\n```"}, {"execs": [{"cmd": "write build/depgate/depsvc/src/depsvc_impl.cpp", "kind": "file", "note": "Wrote build/depgate/depsvc/src/depsvc_impl.cpp", "status": "pass"}], "md": "### 4.5 \u2026and its body\n\n```cpp\n#include \"depsvc_impl.h\"\n\nstd::string DepsvcImpl::getStatus()\n{\n    return \"depsvc 2.1.0 is running.\";\n}\n```"}, {"execs": [{"cmd": "src=\"$(nix eval --impure --raw --expr \"(builtins.fetchTree \\\"${BASECAMP_FLAKE:-github:logos-co/logos-basecamp/8eaf67b7d89df30a5da76ba3b9e9bd84c25d3edc}\\\").outPath\")\"\ndiff -r \"$src/tests/fixtures/depsvc\" build/depgate/depsvc && echo \"identical to tests/fixtures/depsvc\"\n", "exit_code": 0, "kind": "run", "note": "", "output": "unpacking 'github:logos-co/logos-basecamp/8eaf67b7d89df30a5da76ba3b9e9bd84c25d3edc' into the Git cache...\nidentical to tests/fixtures/depsvc\n", "status": "pass"}], "md": "### 4.6 Windows builds the same files, from the repo\n\nWindows has no Nix to build these files with. Basecamp's flake builds\nthe same five from `tests/fixtures/depsvc/` (`#depsvc-lgx`), and\nlogos-windows-ci stages that `.lgx` as `depsvc-lgx/`. This keeps the\ntwo copies identical.\n\n```bash\nsrc=\"$(nix eval --impure --raw --expr \"(builtins.fetchTree \\\"${BASECAMP_FLAKE:-github:logos-co/logos-basecamp/8eaf67b7d89df30a5da76ba3b9e9bd84c25d3edc}\\\").outPath\")\"\ndiff -r \"$src/tests/fixtures/depsvc\" build/depgate/depsvc && echo \"identical to tests/fixtures/depsvc\"\n\n```"}, {"execs": [{"cmd": "nix buil ore/grak7qxvp42x4lhpdd9snlzncn2c75z6-source' from 'https://cache.nix.logos.co/ci'...\nthis path will be fetched (0.0 KiB download, 3.4 MiB unpacked):\n  /nix/store/hrw76hhna94ig2h2phxcnzsiww0ca6hi-logos-depsvc-module-lib-lgx-2.1.0\ncopying path '/nix/store/hrw76hhna94ig2h2phxcnzsiww0ca6hi-logos-depsvc-module-lib-lgx-2.1.0' from 'https://cache.nix.logos.co/ci'...\n", "status": "pass"}], "md": "### 4.7 Build the .lgx\n\n`#lgx-portable` (not `#lgx`) emits the plain platform variant the\nportable bundle installs and loads.\n\n```bash\nnix build \"path:$PWD/build/depgate/depsvc#lgx-portable\" -o build/depgate/result-depsvc\ncp -f build/depgate/result-depsvc/*.lgx build/depgate/depsvc.lgx\n\n```"}, {"execs": [], "md": "### 4.8 On Windows: take the .lgx built from the same files\n\n```bash\ncp -f depsvc-lgx/*.lgx build/depgate/depsvc.lgx\n```"}, {"execs": [{"cmd": "chmod u+w build/depgate/depsvc.lgx\n./lgx/bin/lgx sign build/depgate/depsvc.lgx -k publisher-b -d build/depgate/keys\nchmod -R u+w testdata/depgate-user 2>/dev/null || true\nrm -rf testdata/depgate-user\nmkdir -p testdata/depgate-user/modules testdata/depgate-user/plugins\n./lgpm/bin/lgpm \\\n  --modules-dir testdata/depgate-user/modules \\\n  --ui-plugins-dir testdata/depgate-user/plugins \\\n  --keyring build/depgate/keyring --require-signatures \\\n  install --file build/depgate/depsvc.lgx\nls testdata/depgate-user/modules/depsvc\n# The suffix is the platform's; expect_contains is matched verbatim.\ntest -f testdata/depgate-user/modules/depsvc/depsvc_plugin.dylib \\\n  && echo \"plugin binary installed\"\n", "exit_code": 0, "kind": "run", "note": "", "output": "Package signed: build/depgate/depsvc.lgx\nSigner DID: did:jwk:eyJjcnYiOiJFZDI1NTE5Iiwia3R5IjoiT0tQIiwieCI6IndydXBCS2s3QjZWZUZtRUNNN01HZWs3Y1d2cDZOOS1VMUd0cFNLU0k3dkEifQ\nInstalling from file: build/depgate/depsvc.lgx... done\nInstalled to: testdata/depgate-user/modules\nassets\ndepsvc_plugin.dylib\nlibboost_system.dylib\nlibcrypto.3.dylib\nlibssl.3.dylib\nmanifest.json\nmanifest.sig\nvariant\nplugin binary installed\n", "status": "pass"}], "md": "### 4.9 Sign it as publisher-b, install it\n\nThe archive comes out of the Nix store read-only and `lgx sign`\nwrites in place, hence the copy above.\n`--require-signatures` makes the install itself verify the signature\nagainst the keyring rather than take it on trust.\n\n```bash\nchmod u+w build/depgate/depsvc.lgx\n./lgx/bin/lgx sign build/depgate/depsvc.lgx -k publisher-b -d build/depgate/keys\nchmod -R u+w testdata/depgate-user 2>/dev/null || true\nrm -rf testdata/depgate-user\nmkdir -p testdata/depgate-user/modules testdata/depgate-user/plugins\n./lgpm/bin/lgpm \\\n  --modules-dir testdata/depgate-user/modules \\\n  --ui-plugins-dir testdata/depgate-user/plugins \\\n  --keyring build/depgate/keyring --require-signatures \\\n  install --file build/depgate/depsvc.lgx\nls testdata/depgate-user/modules/depsvc\n# The suffix is the platform's; expect_contains is matched verbatim.\ntest -f testdata/depgate-user/modules/depsvc/depsvc_plugin.dylib \\\n  && echo \"plugin binary installed\"\n\n```"}, {"execs": [{"cmd": "grep -o '\"version\": \"[^\"]*\"' bin-bundle-dir-inspector/modules/capability_module/manifest.json\nls bin-bundle-dir-inspector/modules/capability_module/manifest.sig 2>&1 || echo \"no manifest.sig \u2014 embedded package\"\n", "exit_code": 0, "kind": "run", "note": "", "output": "\"version\": \"1.0.0\"\nls: bin-bundle-dir-inspector/modules/capability_module/manifest.sig: No such file or directory\nno manifest.sig \u2014 embedded package\n", "status": "pass"}], "md": "### 4.10 Confirm the embedded dependency carries no signature\n\nThe premise of the `signer_unknown` case: `capability_module` ships\ninside the bundle, so there is no `manifest.sig` for a pin to check\nagainst \u2014 by construction, not by accident.\n\n```bash\ngrep -o '\"version\": \"[^\"]*\"' bin-bundle-dir-inspector/modules/capability_module/manifest.json\nls bin-bundle-dir-inspector/modules/capability_module/manifest.sig 2>&1 || echo \"no manifest.sig \u2014 embedded package\"\n\n```"}, {"execs": [], "md": "## Step 5: Seed the seven apps\n\nEach app is four files: the root `manifest.json` the scanner reads, the\nmodule's own `metadata.json`, a QML view, and a `qmldir`. The view\nrenders a give-away line naming its own package \u2014 the load is asserted by\nthat text appearing, and for the three blocked apps by it never\nappearing."}, {"execs": [{"cmd": "DID_A=$(cat build/depgate/keys/publisher-a.did)\nDID_B=$(cat build/depgate/keys/publisher-b.did)\nseed() {\n  name=$1; display=$2; deps=$3\n  d=\"testdata/depgate-user/plugins/$name\"; mkdir -p \"$d\"\n  cat > \"$d/manifest.json\" <<EOF\n{\n  \"author\": \"\",\n  \"category\": \"testing\",\n  \"dependencies\": [$deps],\n  \"description\": \"Dependency-gate doc-test fixture\",\n  \"display_name\": \"$display\",\n  \"icon\": \"\",\n  \"main\": {},\n  \"manifestVersion\": \"0.3.0\",\n  \"name\": \"$name\",\n  \"type\": \"ui_qml\",\n  \"version\": \"0.1.0\",\n  \"view\": \"Main.qml\"\n}\nEOF\n  cat > \"$d/metadata.json\" <<EOF\n{\n  \"name\": \"$name\",\n  \"display_name\": \"$display\",\n  \"version\": \"0.1.0\",\n  \"type\": \"ui_qml\",\n  \"category\": \"testing\",\n  \"description\": \"Dependency-gate doc-test fixture\",\n  \"view\": \"Main.qml\",\n  \"dependencies\": [$deps]\n}\nEOF\n  cat > \"$d/Main.qml\" <<EOF\nimport QtQuick\nRectangle {\n    color: \"#1e1e1e\"\n    Text {\n        anchors.centerIn: parent\n        color: \"#ffffff\"\n        font.pixelSize: 18\n        text: \"$name loaded \u2014 the gate admitted it\"\n    }\n}\nEOF\n  printf 'module com.logos.module.%s\\n' \"$name\" > \"$d/qmldir\"\n}\n\n# \u2500\u2500 the gate must ADMIT these four \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\nseed dg_ok_exact    \"Gate OK Exact\"    \"{\\\"n  was required and the key that actually signed. Checking those\nagainst the two keys generated at the start closes the last gap \u2014 the\nmismatch really is `publisher-a` vs `publisher-b`, and not an unparseable\npin that happens to report the same status."}, {"execs": [{"cmd": "DID_A=$(cat build/depgate/keys/publisher-a.did)\nDID_B=$(cat build/depgate/keys/publisher-b.did)\n# The Windows script keeps each step's app log under ui-test-logs/.\nlog=ui-test-app.log\n[ -f \"$log\" ] || log=$(ls ui-test-logs/*.log | tail -1)\ngrep -o 'blocked by deps ( \"[a-z]*\" )' \"$log\" | sort -u\ngrep -q \"pinned to signer $DID_A\" \"$log\" \\\n  && echo \"pin required publisher-a\"\ngrep -q \"it is signed by $DID_B\" \"$log\" \\\n  && echo \"installed package signed by publisher-b\"\ngrep -q \"not a did:jwk carrying an Ed25519 key\" \"$log\" \\\n  || echo \"every pin carried a real key\"\n", "exit_code": 0, "kind": "run", "note": "", "output": "blocked by deps ( \"absent\" )\nblocked by deps ( \"mismatch\" )\nblocked by deps ( \"signer\" )\npin required publisher-a\ninstalled package signed by publisher-b\nevery pin carried a real key\n", "status": "pass"}], "md": "### 7.1 Check the log against the generated keys\n\n```bash\nDID_A=$(cat build/depgate/keys/publisher-a.did)\nDID_B=$(cat build/depgate/keys/publisher-b.did)\n# The Windows script keeps each step's app log under ui-test-logs/.\nlog=ui-test-app.log\n[ -f \"$log\" ] || log=$(ls ui-test-logs/*.log | tail -1)\ngrep -o 'blocked by deps ( \"[a-z]*\" )' \"$log\" | sort -u\ngrep -q \"pinned to signer $DID_A\" \"$log\" \\\n  && echo \"pin required publisher-a\"\ngrep -q \"it is signed by $DID_B\" \"$log\" \\\n  && echo \"installed package signed by publisher-b\"\ngrep -q \"not a did:jwk carrying an Ed25519 key\" \"$log\" \\\n  || echo \"every pin carried a real key\"\n\n```\n\nThree verdicts, three distinct words, from the same run that produced\nthe three distinct dialogs \u2014 and the signer refusal is provably the\ntwo real keys disagreeing, not a pin the verifier could not read.\n\nOne launch covered the gate's whole vocabulary: it admits a satisfied\nrange, a satisfied signer pin, and a pin it cannot check, and refuses\nan absent dependency, a rejected version, and a foreign publisher \u2014\neach in words the other two never use."}]}], "version": 1}</script>
<script>
  const DATA = JSON.parse(document.getElementById("report-data").textContent);
  if (window.marked) { marked.setOptions({ gfm: true, breaks: false }); }
  const mdToHtml = (s) => window.marked ? marked.parse(s || "") : ("<pre>" + (s || "") + "</pre>");

  const sum = DATA.summary;
  document.getElementById("summary").innerHTML =
    `<span class="pill pass">${sum.passed} passed</span> ` +
    (sum.failed ? `<span class="pill fail">${sum.failed} failed</span> ` : "") +
    (sum.skipped ? `<span class="pill skip">${sum.skipped} skipped</span>` : "");

  const picker = document.getElementById("picker");
  DATA.tutorials.forEach((t, i) => {
    const o = document.createElement("option");
    o.value = i; o.textContent = t.meta.name; picker.appendChild(o);
  });

  function execHtml(e) {
    const badge = `<span class="badge ${e.status}">${e.status.toUpperCase()}</span>`;
    const kind = `<span class="kind">${e.kind}${e.platform ? " · " + e.platform : ""}${e.exit_code !== undefined ? " · exit " + e.exit_code : ""}</span>`;
    let h = `<div class="exec"><div class="exec-head">${badge}${kind}</div>`;
    if (e.note) h += `<div class="note">${escapeHtml(e.note)}</div>`;
    if (e.cmd) h += `<pre class="cmd">${escapeHtml(e.cmd)}</pre>`;
    if (e.runner_cmd) h += `<pre class="cmd">${escapeHtml(e.runner_cmd)}</pre>`;
    if (e.actions) {
      const passed = e.actions.filter(a => a.status === "pass").length;
      h += `<div class="kind">UI actions: ${passed}/${e.actions.length} passed</div>`;
      h += `<table class="ui-actions"><tbody>`;
      for (const a of e.actions) {
        const label = a.status === "not_run" ? "NOT RUN" :
          a.status === "running" ? "INTERRUPTED" : a.status.toUpperCase();
        h += `<tr><td>${a.index}</td><td><span class="badge ${a.status}">${label}</span></td>`;
        h += `<td>${escapeHtml(a.description)}`;
        if (a.error) h += `<div class="note">${escapeHtml(a.error)}</div>`;
        h += `</td><td>${a.duration_ms !== undefined ? a.duration_ms + " ms" : ""}</td></tr>`;
      }
      h += `</tbody></table>`;
    }
    const out = (e.output || "").trim();
    if (out) {
      const long = out.split("\n").length > 12;
      if (long) {
        h += `<details><summary>output (${out.split("\n").length} lines)</summary><pre class="output">${escapeHtml(out)}</pre></details>`;
      } else {
        h += `<pre class="output">${escapeHtml(out)}</pre>`;
      }
    }
    h += `</div>`;
    return h;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  }

  function render(idx) {
    const t = DATA.tutorials[idx];
    const main = document.getElementById("main");
    main.innerHTML = "";
    const h = document.createElement("div");
    h.className = "tutorial-title";
    h.textContent = t.meta.name + "  —  " + t.meta.platform;
    main.appendChild(h);

    t.rows.forEach(row => {
      const isStructural = row.execs.length === 0 &&
        (/^#\s|^##\s/.test(row.md.trim()));
      const div = document.createElement("div");
      const hasExec = row.execs.length > 0;
      const hasFail = row.execs.some(e => e.status === "fail");
      div.className = "row" + (hasExec ? "" : (isStructural ? " section" : " preamble")) +
        (hasFail ? " has-fail" : "");

      const left = document.createElement("div");
      left.className = "col left";
      left.innerHTML = `<div class="md">${mdToHtml(row.md)}</div>`;
      div.appendChild(left);

      if (hasExec || !isStructural) {
        const right = document.createElement("div");
        right.className = "col right";
        if (hasExec) {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            row.execs.map(execHtml).join("");
        } else {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            `<div class="empty">No commands run for this step.</div>`;
        }
        div.appendChild(right);
      }
      main.appendChild(div);
    });

    addAnchors(main, slug(t.meta.name));
  }

  function slug(s) {
    return String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  }

  // Octicon "link" — the same glyph GitHub puts next to markdown headings.
  const LINK_ICON =
    '<svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d=' +
    '"M7.775 3.275a.75.75 0 0 0 1.06 1.06l1.25-1.25a2 2 0 1 1 2.83 2.83l-2.5 2.5a2 2 0 0 1-2.83 0 ' +
    '.75.75 0 0 0-1.06 1.06 3.5 3.5 0 0 0 4.95 0l2.5-2.5a3.5 3.5 0 0 0-4.95-4.95l-1.25 1.25Zm-4.69 ' +
    '9.64a2 2 0 0 1 0-2.83l2.5-2.5a2 2 0 0 1 2.83 0 .75.75 0 0 0 1.06-1.06 3.5 3.5 0 0 0-4.95 0l-2.5 ' +
    '2.5a3.5 3.5 0 0 0 4.95 4.95l1.25-1.25a.75.75 0 0 0-1.06-1.06l-1.25 1.25a2 2 0 0 1-2.83 0Z"></path></svg>';

  // Give every heading a stable slug id (deduplicated the way GitHub does, with
  // -1/-2 suffixes) and a permalink whose href is "#<tutorial>/<heading>".
  function addAnchors(container, tutSlug) {
    const used = new Map();
    const nodes = container.querySelectorAll(
      ".tutorial-title, .md h1, .md h2, .md h3, .md h4, .md h5, .md h6"
    );
    nodes.forEach(node => {
      const text = node.textContent.trim();
      const isTitle = node.classList.contains("tutorial-title");
      let href = "#" + tutSlug;
      if (!isTitle) {
        const base = slug(text) || "section";
        const n = (used.get(base) || 0) + 1;
        used.set(base, n);
        node.id = n > 1 ? base + "-" + n : base;
        href += "/" + node.id;
      }
      node.classList.add("heading-anchored");
      const a = document.createElement("a");
      a.className = "anchor";
      a.href = href;
      a.title = "Copy link to this section";
      a.setAttribute("aria-label", "Permalink: " + text);
      a.innerHTML = LINK_ICON;
      node.insertBefore(a, node.firstChild);
    });
  }

  let toastTimer = null;
  function toast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 1600);
  }

  // navigator.clipboard needs a secure context; reports are often opened over
  // file://, so fall back to the old execCommand path there.
  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(
        () => toast("Link copied"),
        () => toast(text)
      );
      return;
    }
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    toast(ok ? "Link copied" : text);
  }

  function scrollToId(id) {
    if (!id) { window.scrollTo(0, 0); return; }
    const el = document.getElementById(id);
    if (!el) return;
    el.scrollIntoView({ block: "start" });
    el.classList.remove("flash");
    void el.offsetWidth;  // restart the animation on a repeat click
    el.classList.add("flash");
  }

  document.addEventListener("click", ev => {
    const a = ev.target.closest && ev.target.closest("a.anchor");
    if (!a) return;
    ev.preventDefault();
    const href = a.getAttribute("href");
    copyText(location.href.split("#")[0] + href);
    if (location.hash === href) scrollToId(a.parentNode.id);
    else location.hash = href;  // hashchange scrolls
  });

  // "#<tutorial>" (name, slug, or index) optionally followed by "/<heading>".
  function parseHash() {
    const raw = decodeURIComponent(location.hash.replace(/^#/, ""));
    if (!raw) return { idx: 0, frag: "" };
    const cut = raw.indexOf("/");
    const tut = cut >= 0 ? raw.slice(0, cut) : raw;
    const frag = cut >= 0 ? raw.slice(cut + 1) : "";
    if (/^\d+$/.test(tut) && +tut < DATA.tutorials.length) return { idx: +tut, frag };
    const i = DATA.tutorials.findIndex(
      t => slug(t.meta.name) === tut || t.meta.name === tut
    );
    if (i >= 0) return { idx: i, frag };
    // No tutorial matched: treat a bare hash as a heading in the current one.
    return { idx: currentIdx >= 0 ? currentIdx : 0, frag: cut >= 0 ? frag : raw };
  }

  let currentIdx = -1;
  function show(idx, frag) {
    if (idx !== currentIdx) {
      picker.value = idx;
      render(idx);
      currentIdx = idx;
    }
    if (frag) requestAnimationFrame(() => scrollToId(frag));
  }
  picker.addEventListener("change", () => {
    location.hash = slug(DATA.tutorials[+picker.value].meta.name);
    show(+picker.value);
  });
  window.addEventListener("hashchange", () => {
    const h = parseHash();
    show(h.idx, h.frag);
  });
  const initial = parseHash();
  show(initial.idx, initial.frag);
  // Inlined screenshots have no intrinsic size until decoded, so the first
  // scroll can land short; re-anchor once everything has loaded.
  if (initial.frag) {
    window.addEventListener("load", () => scrollToId(initial.frag), { once: true });
  }
</script>
</body>
</html>
