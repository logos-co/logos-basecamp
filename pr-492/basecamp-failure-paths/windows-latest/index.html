<script id="report-data" type="application/json">{"generated_platform": "windows-latest", "summary": {"failed": 0, "passed": 7, "skipped": 0}, "tutorials": [{"meta": {"name": "When installs go wrong: Basecamp's failure paths", "output": "basecamp-failure-paths.md"}, "rows": [{"execs": [], "md": "# When installs go wrong: Basecamp's failure paths\n\nEvery other doc-test in this suite ends green on purpose \u2014 install works,\nupgrade works, the app comes back after a restart. This one asks the\nopposite question: **what does the user see when a package is broken?**\n\nThe everyday way to get a broken package is a download cut short or a file\ncorrupted in transit: the `.lgx` on disk is not what the publisher built.\nThis doc-test manufactures exactly that \u2014 it crafts a **valid** QML-only\npackage (the same hand-built recipe the package-lifecycle doc-test\ndocuments), then derives two broken files from it:\n\n1. a **truncated** copy \u2014 the honest simulation of an interrupted download:\n   the first few hundred bytes of the real package, then nothing;\n2. a file that is **not an archive at all** \u2014 plain text renamed to `.lgx`.\n\nEach is handed to the bundled Package Manager the same way a real local\ninstall starts. The package manager tries to read the archive, fails, and\nreports the failure \u2014 and Basecamp surfaces it as an **Install Failed**\ndialog naming the file and quoting the package manager's error, instead of\nsilently doing nothing. The run closes with the proof that nothing was\nwedged along the way: the **same package, intact**, handed over one more\ntime, sails straight to the regular install gate.\n\nThe failure surfacing under test is deliberately layered the way the\ninstall flow itself is layered: `package_manager_ui` initiates installs\nand reports progress \u2014 including failures \u2014 over its module interface;\n**Basecamp**, which owns every confirmation dialog in the app, listens to\nthose reports and raises the dialog for the failed ones. A failure that\naborts *before* the manifest can be read never reaches the install gate \u2014\nthere is no name or version to confirm \u2014 so the error notice appears in\nits place.\n\nThe run is **hermetic**: the fixture is hand-crafted in the spec, the\ncorrupt copies are derived from it locally, and everything runs against a\nthrowaway `--user-dir`. Nothing is ever actually installed \u2014 that is the\npoint.\n\n**What you'll build:** The inspector-enabled Basecamp bundle and the logos-qt-mcp UI driver, one\nvalid hand-crafted `.lgx` package plus two broken derivatives (a truncated\ncopy and a text file in disguise), and a headless UI run that feeds both\nbroken files to the Package Manager, asserts Basecamp's Install Failed\ndialog surfaces each error, and then proves the intact package still\nreaches the normal install gate.\n\n\n**What you'll learn:**\n\n- What happens when the package manager is handed a truncated or invalid `.lgx` \u2014 the archive fails to load, and the error is reported rather than swallowed\n- Where install failures surface \u2014 Basecamp's global dialog layer raises an \"Install Failed\" notice naming the file and quoting the package manager's error\n- Why a corrupt file never reaches the install gate \u2014 gating needs the manifest's name and version, and a broken archive has neither\n- That a failed install leaves no pending state behind \u2014 the very same package, intact, still gates as a fresh install afterwards\n- How to drive and assert failure paths headlessly with logos-qt-mcp (dialog `visible` properties + stable objectNames, not just text waits)\n\n## Prerequisites\n\n- **Nix** with flakes enabled. Install from [nixos.org](https://nixos.org/download.html), then enable flakes:\n\n```bash\nmkdir -p ~/.config/nix\necho 'experimental-features = nix-command flakes' >> ~/.config/nix/nix.conf\n```\n\nVerify: `nix flake --help >/dev/null 2>&1 && echo \"Flakes enabled\"`\n\n- **Windows:** the outputs the build steps below link, staged as `bin-bundle-dir-inspector/`, `logos-qt-mcp/` and `lgx/`, plus Git Bash, Python 3 and Node.js.\n- **Linux, macOS or Windows.** The app runs headless via `QT_QPA_PLATFORM=offscreen`, so no display is required. Network access is needed to fetch the flakes and the Nix binary cache; during the run Basecamp may refresh its default catalog in the background, but nothing from it is downloaded or installed here."}, {"execs": [], "md": "## Step 1: Build the UI test driver\n\n[`logos-qt-mcp`](https://github.com/logos-co/logos-qt-mcp) is the harness\nthe doc-test uses to connect to the app's QML inspector and drive it."}, {"execs": [], "md": "### 1.1 Build logos-qt-mcp\n\n```bash\nnix build 'github:logos-co/logos-basecamp#logos-qt-mcp' -o logos-qt-mcp\n```"}, {"execs": [], "md": "### 1.2 Build the lgx packaging CLI\n\n[`lgx`](https://github.com/logos-co/logos-package) is the packaging\ntool \u2014 used below to add the payload to the fixture package and stamp\nits content hashes. (Only the *valid* package needs it; breaking a\nfile requires no tooling at all.)\n\n```bash\nnix build 'github:logos-co/logos-package#lgx' -o lgx\n```"}, {"execs": [], "md": "## Step 2: Build the Basecamp bundle\n\nBuild **this** basecamp commit as the portable bundle \u2014 the same\nself-contained directory you ship, with the QML inspector compiled in so\nthe driver can attach (`#bin-bundle-dir-inspector`, the inspector-enabled\ntwin of `#bin-bundle-dir`)."}, {"execs": [], "md": "### 2.1 Build the bundle\n\n```bash\n# From inside the clone this is simply: nix build '.#bin-bundle-dir-inspector'\nnix build 'github:logos-co/logos-basecamp#bin-bundle-dir-inspector' -o bin-bundle-dir-inspector\n```"}, {"execs": [], "md": "## Step 3: Craft one valid package \u2014 and break it twice\n\nThe valid fixture is a QML-only (`ui_qml`) app, hand-built exactly the\nway the package-lifecycle doc-test documents: a stamped `manifest.json`\nseeded into a plain-**ustar** gzipped tar, payload injected and content\nhashes stamped by [`lgx add`](https://github.com/logos-co/logos-package).\nFrom that one good file the two broken ones are derived mechanically \u2014\nno packaging tool involved, because breaking things is easy."}, {"execs": [{"cmd": "write build/failpath/manifest.json", "exit_code": 0, "kind": "file", "output": "wrote build/failpath/manifest.json\n", "status": "pass"}], "md": "### 3.1 Write the manifest\n\n```json\n{\n  \"author\": \"\",\n  \"category\": \"testing\",\n  \"dependencies\": [],\n  \"description\": \"Failure-path doc-test fixture (QML-only app)\",\n  \"display_name\": \"Failure Demo\",\n  \"icon\": \"\",\n  \"main\": {},\n  \"manifestVersion\": \"0.3.0\",\n  \"name\": \"test_failpath_qml\",\n  \"type\": \"ui_qml\",\n  \"version\": \"0.1.1\",\n  \"view\": \"Main.qml\"\n}\n```"}, {"execs": [{"cmd": "write build/failpath/payload/metadata.json", "exit_code": 0, "kind": "file", "output": "wrote build/failpath/payload/metadata.json\n", "status": "pass"}], "md": "### 3.2 Write the module metadata\n\n```json\n{\n  \"name\": \"test_failpath_qml\",\n  \"display_name\": \"Failure Demo\",\n  \"version\": \"0.1.1\",\n  \"type\": \"ui_qml\",\n  \"category\": \"testing\",\n  \"description\": \"Failure-path doc-test fixture (QML-only app)\",\n  \"view\": \"Main.qml\",\n  \"dependencies\": []\n}\n```"}, {"execs": [{"cmd": "write build/failpath/payload/Main.qml", "exit_code": 0, "kind": "file", "output": "wrote build/failpath/payload/Main.qml\n", "status": "pass"}], "md": "### 3.3 Write the QML view\n\n```qml\nimport QtQuick\n\nRectangle {\n    id: root\n    color: \"#1e1e1e\"\n    Text {\n        anchors.centerIn: parent\n        text: \"Failure demo view v0.1.1\"\n        color: \"#ffffff\"\n        font.pixelSize: 24\n    }\n}\n```"}, {"execs": [{"cmd": "write build/failpath/payload/qmldir", "exit_code": 0, "kind": "file", "output": "wrote build/failpath/payload/qmldir\n", "status": "pass"}], "md": "### 3.4 Write the qmldir\n\n```text\nmodule com.logos.module.test_failpath_qml\n```"}, {"execs": [], "md": "### 3.5 Pick the platform variant and where the files go\n\nEverything lands at a **fixed absolute path**\n(`/tmp/basecamp-failpath/`) because the UI run passes these paths\ninto the app over the inspector, where a relative path would be\nambiguous.\n\n```bash\ncase \"$(uname -s) $(uname -m)\" in\n  \"Linux x86_64\")   VARIANT=linux-x86_64 ;;\n  \"Linux aarch64\")  VARIANT=linux-arm64 ;;\n  \"Darwin arm64\")   VARIANT=darwin-arm64 ;;\n  \"Darwin x86_64\")  VARIANT=darwin-x86_64 ;;\n  *) echo \"unsupported platform: $(uname -sm)\" >&2; exit 1 ;;\nesac\necho \"$VARIANT\" > build/failpath/variant\necho /tmp/basecamp-failpath > build/failpath/dir\ncat build/failpath/variant build/failpath/dir\n\n```"}, {"execs": [{"cmd": "echo windows-x86_64 > build/failpath/variant\ncygpath -u \"$(pwd -W | cut -c1-2)/tmp/basecamp-failpath\" > build/failpath/dir\ncat build/failpath/variant build/failpath/dir\n", "exit_code": 0, "kind": "run", "output": "windows-x86_64\n/d/tmp/basecamp-failpath\n", "status": "pass"}], "md": "### 3.6 On Windows: the platform variant and where the files go\n\nThe app turns `file:///tmp/basecamp-failpath/\u2026` into `\\tmp\\basecamp-failpath\\\u2026`\non the drive it runs from, while Git Bash's `/tmp` is the user's temp\ndirectory. So the files go to that drive's `\\tmp`, and the error\nmessages quote the same `/tmp/\u2026` paths as on Linux and macOS.\n\n```bash\necho windows-x86_64 > build/failpath/variant\ncygpath -u \"$(pwd -W | cut -c1-2)/tmp/basecamp-failpath\" > build/failpath/dir\ncat build/failpath/variant build/failpath/dir\n\n```"}, {"execs": [{"cmd": "VARIANT=$(cat build/failpath/variant)\nDIR=$(cat build/failpath/dir)\nchmod -R u+w \"$DIR\" 2>/dev/null || true\nrm -rf \"$DIR\"\nmkdir -p \"$DIR\"\nseed=\"build/failpath/seed\"\nrm -rf \"$seed\"\nmkdir -p \"$seed/variants\"\ncp build/failpath/manifest.json \"$seed/manifest.json\"\ntar --format ustar -C \"$seed\" -czf \"$DIR/test_failpath_qml-0.1.1.lgx\" manifest.json variants\n./lgx/bin/lgx.exe add \"$DIR/test_failpath_qml-0.1.1.lgx\" \\\n  --variant \"$VARIANT\" --files build/failpath/payload -y\n./lgx/bin/lgx.exe verify \"$DIR/test_failpath_qml-0.1.1.lgx\"\nhead -c 400 \"$DIR/test_failpath_qml-0.1.1.lgx\" \\\n  > \"$DIR/test_failpath_qml-truncated.lgx\"\nprintf 'This is not an LGX package, whatever the extension claims.\\n' \\\n  > \"$DIR/not-a-package.lgx\"\nchmod -R u+w testdata/failpath-user 2>/dev/null || true\nrm -rf testdata/failpath-user\nmkdir -p testdata/failpath-user/modules testdata/failpath-user/plugins\nls \"$DIR\"\n", "exit_code": 0, "kind": "run", "output": "Added variant 'windows-x86_64' to D:/tmp/basecamp-failpath/test_failpath_qml-0.1.1.lgx\nPackage structure is valid: D:/tmp/basecamp-failpath/test_failpath_qml-0.1.1.lgx\nPackage is unsigned\nnot-a-package.lgx\ntest_failpath_qml-0.1.1.lgx\ntest_failpath_qml-truncated.lgx\n", "status": "pass"}], "md": "### 3.7 Pack the valid .lgx, then derive the two broken files\n\nBuild the valid package (`lgx verify` proves it), then break it:\n\n- **`test_failpath_qml-truncated.lgx`** \u2014 the first 400 bytes of the\n  valid package. That's a well-formed gzip *header* followed by a\n  cliff: exactly what an interrupted download leaves behind.\n- **`not-a-package.lgx`** \u2014 a sentence of plain text with an `.lgx`\n  extension. Not gzip, not tar, not close.\n\nA fresh, empty `--user-dir` is created alongside \u2014 and\nsince nothing in this spec ever completes an install, it is expected\nto stay empty.\n\n```bash\nVARIANT=$(cat build/failpath/variant)\nDIR=$(cat build/failpath/dir)\nchmod -R u+w \"$DIR\" 2>/dev/null || true\nrm -rf \"$DIR\"\nmkdir -p \"$DIR\"\nseed=\"build/failpath/seed\"\nrm -rf \"$seed\"\nmkdir -p \"$seed/variants\"\ncp build/failpath/manifest.json \"$seed/manifest.json\"\ntar --format ustar -C \"$seed\" -czf \"$DIR/test_failpath_qml-0.1.1.lgx\" manifest.json variants\n./lgx/bin/lgx add \"$DIR/test_failpath_qml-0.1.1.lgx\" \\\n  --variant \"$VARIANT\" --files build/failpath/payload -y\n./lgx/bin/lgx verify \"$DIR/test_failpath_qml-0.1.1.lgx\"\nhead -c 400 \"$DIR/test_failpath_qml-0.1.1.lgx\" \\\n  > \"$DIR/test_failpath_qml-truncated.lgx\"\nprintf 'This is not an LGX package, whatever the extension claims.\\n' \\\n  > \"$DIR/not-a-package.lgx\"\nchmod -R u+w testdata/failpath-user 2>/dev/null || true\nrm -rf testdata/failpath-user\nmkdir -p testdata/failpath-user/modules testdata/failpath-user/plugins\nls \"$DIR\"\n\n```"}, {"execs": [], "md": "## Step 4: Feed the broken files to the Package Manager\n\nLaunch the bundle headless against the empty user-dir and hand each\nbroken file to the bundled **Package Manager** app the way every local\ninstall starts: PMU's `installLocalPackage` slot (the code path behind\nits \"Select LGX Package\" file picker, which a headless driver can't\noperate), invoked via the inspector on the `pmui.BackendStore` hook with\nan explicit `file://` URL.\n\nFor a *valid* file this kicks off inspect \u2192 install gate \u2192 confirm \u2192\ninstall. For a broken file the very first step \u2014 reading the archive \u2014\nfails, and the flow is over before any gate could open. The assertions\nare therefore dialog-identity assertions: the **Install Failed** notice\n(and no other dialog) must become visible, carry the failing file's\nname, and quote the package manager's error. Buttons are clicked by\ntheir stable `objectName`s, and dialog identity is asserted via the\nper-mode dialog instances' `visible` properties \u2014 the same conventions\nthe package-lifecycle doc-test established."}, {"execs": [{"actions": [{"description": "App window opens with the sidebar visible: wait for ['Applications', 'Settings']", "duration_ms": 71, "index": 1, "status": "pass"}, {"description": "Open the Package Manager: click 'Package Manager'", "duration_ms": 1, "index": 2, "status": "pass"}, {"description": "The Package Manager view loads: wait for ['Manage your plug   document.getElementById("summary").innerHTML =
    `<span class="pill pass">${sum.passed} passed</span> ` +
    (sum.failed ? `<span class="pill fail">${sum.failed} failed</span> ` : "") +
    (sum.skipped ? `<span class="pill skip">${sum.skipped} skipped</span>` : "");

  const picker = document.getElementById("picker");
  DATA.tutorials.forEach((t, i) => {
    const o = document.createElement("option");
    o.value = i; o.textContent = t.meta.name; picker.appendChild(o);
  });

  function execHtml(e) {
    const badge = `<span class="badge ${e.status}">${e.status.toUpperCase()}</span>`;
    const kind = `<span class="kind">${e.kind}${e.platform ? " · " + e.platform : ""}${e.exit_code !== undefined ? " · exit " + e.exit_code : ""}</span>`;
    let h = `<div class="exec"><div class="exec-head">${badge}${kind}</div>`;
    if (e.note) h += `<div class="note">${escapeHtml(e.note)}</div>`;
    if (e.cmd) h += `<pre class="cmd">${escapeHtml(e.cmd)}</pre>`;
    if (e.runner_cmd) h += `<pre class="cmd">${escapeHtml(e.runner_cmd)}</pre>`;
    if (e.actions) {
      const passed = e.actions.filter(a => a.status === "pass").length;
      h += `<div class="kind">UI actions: ${passed}/${e.actions.length} passed</div>`;
      h += `<table class="ui-actions"><tbody>`;
      for (const a of e.actions) {
        const label = a.status === "not_run" ? "NOT RUN" :
          a.status === "running" ? "INTERRUPTED" : a.status.toUpperCase();
        h += `<tr><td>${a.index}</td><td><span class="badge ${a.status}">${label}</span></td>`;
        h += `<td>${escapeHtml(a.description)}`;
        if (a.error) h += `<div class="note">${escapeHtml(a.error)}</div>`;
        h += `</td><td>${a.duration_ms !== undefined ? a.duration_ms + " ms" : ""}</td></tr>`;
      }
      h += `</tbody></table>`;
    }
    const out = (e.output || "").trim();
    if (out) {
      const long = out.split("\n").length > 12;
      if (long) {
        h += `<details><summary>output (${out.split("\n").length} lines)</summary><pre class="output">${escapeHtml(out)}</pre></details>`;
      } else {
        h += `<pre class="output">${escapeHtml(out)}</pre>`;
      }
    }
    h += `</div>`;
    return h;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  }

  function render(idx) {
    const t = DATA.tutorials[idx];
    const main = document.getElementById("main");
    main.innerHTML = "";
    const h = document.createElement("div");
    h.className = "tutorial-title";
    h.textContent = t.meta.name + "  —  " + t.meta.platform;
    main.appendChild(h);

    t.rows.forEach(row => {
      const isStructural = row.execs.length === 0 &&
        (/^#\s|^##\s/.test(row.md.trim()));
      const div = document.createElement("div");
      const hasExec = row.execs.length > 0;
      const hasFail = row.execs.some(e => e.status === "fail");
      div.className = "row" + (hasExec ? "" : (isStructural ? " section" : " preamble")) +
        (hasFail ? " has-fail" : "");

      const left = document.createElement("div");
      left.className = "col left";
      left.innerHTML = `<div class="md">${mdToHtml(row.md)}</div>`;
      div.appendChild(left);

      if (hasExec || !isStructural) {
        const right = document.createElement("div");
        right.className = "col right";
        if (hasExec) {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            row.execs.map(execHtml).join("");
        } else {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            `<div class="empty">No commands run for this step.</div>`;
        }
        div.appendChild(right);
      }
      main.appendChild(div);
    });

    addAnchors(main, slug(t.meta.name));
  }

  function slug(s) {
    return String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  }

  // Octicon "link" — the same glyph GitHub puts next to markdown headings.
  const LINK_ICON =
    '<svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d=' +
    '"M7.775 3.275a.75.75 0 0 0 1.06 1.06l1.25-1.25a2 2 0 1 1 2.83 2.83l-2.5 2.5a2 2 0 0 1-2.83 0 ' +
    '.75.75 0 0 0-1.06 1.06 3.5 3.5 0 0 0 4.95 0l2.5-2.5a3.5 3.5 0 0 0-4.95-4.95l-1.25 1.25Zm-4.69 ' +
    '9.64a2 2 0 0 1 0-2.83l2.5-2.5a2 2 0 0 1 2.83 0 .75.75 0 0 0 1.06-1.06 3.5 3.5 0 0 0-4.95 0l-2.5 ' +
    '2.5a3.5 3.5 0 0 0 4.95 4.95l1.25-1.25a.75.75 0 0 0-1.06-1.06l-1.25 1.25a2 2 0 0 1-2.83 0Z"></path></svg>';

  // Give every heading a stable slug id (deduplicated the way GitHub does, with
  // -1/-2 suffixes) and a permalink whose href is "#<tutorial>/<heading>".
  function addAnchors(container, tutSlug) {
    const used = new Map();
    const nodes = container.querySelectorAll(
      ".tutorial-title, .md h1, .md h2, .md h3, .md h4, .md h5, .md h6"
    );
    nodes.forEach(node => {
      const text = node.textContent.trim();
      const isTitle = node.classList.contains("tutorial-title");
      let href = "#" + tutSlug;
      if (!isTitle) {
        const base = slug(text) || "section";
        const n = (used.get(base) || 0) + 1;
        used.set(base, n);
        node.id = n > 1 ? base + "-" + n : base;
        href += "/" + node.id;
      }
      node.classList.add("heading-anchored");
      const a = document.createElement("a");
      a.className = "anchor";
      a.href = href;
      a.title = "Copy link to this section";
      a.setAttribute("aria-label", "Permalink: " + text);
      a.innerHTML = LINK_ICON;
      node.insertBefore(a, node.firstChild);
    });
  }

  let toastTimer = null;
  function toast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 1600);
  }

  // navigator.clipboard needs a secure context; reports are often opened over
  // file://, so fall back to the old execCommand path there.
  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(
        () => toast("Link copied"),
        () => toast(text)
      );
      return;
    }
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    toast(ok ? "Link copied" : text);
  }

  function scrollToId(id) {
    if (!id) { window.scrollTo(0, 0); return; }
    const el = document.getElementById(id);
    if (!el) return;
    el.scrollIntoView({ block: "start" });
    el.classList.remove("flash");
    void el.offsetWidth;  // restart the animation on a repeat click
    el.classList.add("flash");
  }

  document.addEventListener("click", ev => {
    const a = ev.target.closest && ev.target.closest("a.anchor");
    if (!a) return;
    ev.preventDefault();
    const href = a.getAttribute("href");
    copyText(location.href.split("#")[0] + href);
    if (location.hash === href) scrollToId(a.parentNode.id);
    else location.hash = href;  // hashchange scrolls
  });

  // "#<tutorial>" (name, slug, or index) optionally followed by "/<heading>".
  function parseHash() {
    const raw = decodeURIComponent(location.hash.replace(/^#/, ""));
    if (!raw) return { idx: 0, frag: "" };
    const cut = raw.indexOf("/");
    const tut = cut >= 0 ? raw.slice(0, cut) : raw;
    const frag = cut >= 0 ? raw.slice(cut + 1) : "";
    if (/^\d+$/.test(tut) && +tut < DATA.tutorials.length) return { idx: +tut, frag };
    const i = DATA.tutorials.findIndex(
      t => slug(t.meta.name) === tut || t.meta.name === tut
    );
    if (i >= 0) return { idx: i, frag };
    // No tutorial matched: treat a bare hash as a heading in the current one.
    return { idx: currentIdx >= 0 ? currentIdx : 0, frag: cut >= 0 ? frag : raw };
  }

  let currentIdx = -1;
  function show(idx, frag) {
    if (idx !== currentIdx) {
      picker.value = idx;
      render(idx);
      currentIdx = idx;
    }
    if (frag) requestAnimationFrame(() => scrollToId(frag));
  }
  picker.addEventListener("change", () => {
    location.hash = slug(DATA.tutorials[+picker.value].meta.name);
    show(+picker.value);
  });
  window.addEventListener("hashchange", () => {
    const h = parseHash();
    show(h.idx, h.frag);
  });
  const initial = parseHash();
  show(initial.idx, initial.frag);
  // Inlined screenshots have no intrinsic size until decoded, so the first
  // scroll can land short; re-anchor once everything has loaded.
  if (initial.frag) {
    window.addEventListener("load", () => scrollToId(initial.frag), { once: true });
  }
</script>
</body>
</html>
