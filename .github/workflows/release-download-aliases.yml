name: Stable release downloads

on:
  release:
    types: [published, released]
  workflow_dispatch:
    inputs:
      tag:
        description: Draft or published full release tag (for example, 0.3.1)
        required: true
        type: string
  pull_request:
    paths:
      - '.github/workflows/release-download-aliases.yml'
      - 'scripts/release-download-aliases.py'
      - 'tests/test_release_download_aliases.py'

permissions:
  contents: read

concurrency:
  group: stable-downloads-${{ github.event.release.tag_name || inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.ref || github.event.repository.default_branch }}
      - run: python3 -m unittest discover -s tests -p test_release_download_aliases.py

  publish:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'release' && !github.event.release.prerelease)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      # Old release tags do not contain this helper; backfills use the default branch.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Add stable download names
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: python3 scripts/release-download-aliases.py --repo "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" --wait-seconds 600
