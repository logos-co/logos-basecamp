name: Build & Release

on:
  push:
    branches:
      - master
      - 'release/**'
  pull_request:
    branches: [master]

# Nix and the Logos cache come from logos-co/setup-nix-cache-action, which owns
# the installer, the substituters, the trusted keys, which cache is written
# (public on master/main, ci elsewhere) and the push itself. This file used to
# own all of that four times over.
#
# The ATTIC_CACHE / ATTIC_ENDPOINT env pair that lived here is gone: the first is
# the shared action's decision, and the second existed only to feed `if:` guards
# that skipped the push on fork PRs. The shared action needs no guard -- with no
# token it configures the substituters anyway and skips the push, which is the
# behaviour those guards were approximating. The repo's ATTIC_ENDPOINT secret is
# consequently unused here; the action's default endpoint is the same host this
# file already pointed at.

jobs:
  build-appimage:
    environment: ${{ github.ref == 'refs/heads/master' && 'public-cache' || '' }}
    strategy:
      matrix:
        include:
          - arch: x86_64-linux
            runner: ubuntu-latest
          - arch: aarch64-linux
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - uses: logos-co/setup-nix-cache-action@v1
        with:
          attic-token-ci: ${{ secrets.ATTIC_TOKEN_CI }}
          attic-token-public: ${{ secrets.ATTIC_TOKEN_PUBLIC }}

      - name: Build bin-appimage
        run: nix build .#bin-appimage

      - name: Smoke test
        run: |
          nix build .#smoke-test --out-link result-smoke -L
          cat result-smoke/smoke-test.log

      - name: Rename AppImage with architecture
        run: |
          arch="${{ matrix.arch }}"
          arch_short="${arch%%-*}"
          src=$(find result/ -name '*.AppImage' -print -quit)
          cp "$src" "logos-basecamp-${arch_short}.AppImage"

      - uses: actions/upload-artifact@v4
        with:
          name: appimage-${{ matrix.arch }}
          path: logos-basecamp-*.AppImage

  build-macos-app:
    environment: ${{ github.ref == 'refs/heads/master' && 'public-cache' || '' }}
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: logos-co/setup-nix-cache-action@v1
        with:
          attic-token-ci: ${{ secrets.ATTIC_TOKEN_CI }}
          attic-token-public: ${{ secrets.ATTIC_TOKEN_PUBLIC }}

      - name: Build bin-macos-app
        run: nix build .#bin-macos-app

      - name: Smoke test
        run: |
          nix build .#smoke-test-bundle --out-link result-smoke -L
          cat result-smoke/smoke-test.log

      - name: Package app bundle as tarball
        run: |
          app=$(find result/ -name '*.app' -maxdepth 1 -print -quit)
          tar -czf logos-basecamp-aarch64-unsigned.app.tar.gz -C result "$(basename "$app")"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-app-aarch64-darwin
          path: logos-basecamp-aarch64-unsigned.app.tar.gz

  test-linux:
    environment: ${{ github.ref == 'refs/heads/master' && 'public-cache' || '' }}
    strategy:
      matrix:
        include:
          - arch: x86_64-linux
            runner: ubuntu-latest
          - arch: aarch64-linux
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - uses: logos-co/setup-nix-cache-action@v1
        with:
          attic-token-ci: ${{ secrets.ATTIC_TOKEN_CI }}
          attic-token-public: ${{ secrets.ATTIC_TOKEN_PUBLIC }}

      - name: Unit tests
        run: nix build .#unit-tests -L

      - name: QML tests
        run: nix build .#qml-tests -L

      - name: Sandbox test
        run: nix build .#sandbox-test -L

      - name: Integration test (UI tests)
        run: nix build .#integration-test -L

      # Report-only non-blocking for now
      - name: Coverage report
        continue-on-error: true
        run: |
          nix build .#coverage -L
          {
            echo '## Unit-test coverage'
            echo '```'
            cat result/coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: result/
          if-no-files-found: ignore

  test-macos:
    environment: ${{ github.ref == 'refs/heads/master' && 'public-cache' || '' }}
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: logos-co/setup-nix-cache-action@v1
        with:
          attic-token-ci: ${{ secrets.ATTIC_TOKEN_CI }}
          attic-token-public: ${{ secrets.ATTIC_TOKEN_PUBLIC }}

      - name: Unit tests
        run: nix build .#unit-tests -L

      - name: QML tests
        run: nix build .#qml-tests -L

      - name: Sandbox test
        run: nix build .#sandbox-test -L

      - name: Integration test (UI tests)
        run: nix build .#integration-test-bundle -L

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')
    needs: [build-appimage, build-macos-app]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: appimage-x86_64-linux
          path: artifacts/

      - uses: actions/download-artifact@v4
        with:
          name: appimage-aarch64-linux
          path: artifacts/

      - uses: actions/download-artifact@v4
        with:
          name: macos-app-aarch64-darwin
          path: artifacts/

      - name: Generate tag
        id: tag
        run: echo "tag=pre-release-${GITHUB_SHA::7}-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Pre-release ${{ steps.tag.outputs.tag }}
          prerelease: true
          files: |
            artifacts/*.AppImage
            artifacts/*.app.tar.gz
