name: Nightly

# The lifecycle suite (tests/lifecycle-tests.mjs, nix/lifecycle-test.nix): a
# fresh app per test, too slow for the PR gate's budget, so it runs here —
# every night, on every push to a release branch or to a test/mcp-lifecycle*
# branch (the branches the suite itself is developed on), and on demand.

on:
  schedule:
    - cron: '0 3 * * *'
  push:
    branches:
      - 'release/**'
      - 'test/mcp-lifecycle**'
  workflow_dispatch:

jobs:
  lifecycle-linux:
    environment: ${{ github.ref == 'refs/heads/master' && 'public-cache' || '' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: logos-co/setup-nix-cache-action@v1
        with:
          attic-token-ci: ${{ secrets.ATTIC_TOKEN_CI }}
          attic-token-public: ${{ secrets.ATTIC_TOKEN_PUBLIC }}

      - name: Lifecycle tests
        run: nix build .#lifecycle-test -L

      - name: Report elapsed time
        run: |
          {
            echo '## Lifecycle tests'
            echo "Elapsed: $(cat result/elapsed-seconds)s"
          } >> "$GITHUB_STEP_SUMMARY"
