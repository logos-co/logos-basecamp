  :root {

  .col.left { border-right: 1px solid var(--border); }
  .row.preamble .col.left, .row.section .col.left { border-right: none; }

     impossible to miss when scanning the report. */
  .row.has-fail { border-color: var(--fail); box-shadow: 0 0 0 1px var(--fail); }

  .row.has-fail .col.right { background: rgba(248,81,73,.12); }

  .md h1 { font-size: 22px; } .md h2 { font-size: 18px; } .md h3 { font-size: 15px; }

  .exec:last-child { margin-bottom: 0; }
  .exec-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .badge { font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 4px; }

  .badge.fail { background: rgba(248,81,73,.15); color: var(--fail); }
  .badge.info { background: rgba(210,153,34,.15); color: var(--info); }

  .badge.running { background: rgba(248,81,73,.15); color: var(--fail); }
  .ui-actions { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 12px; }

  .kind { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .note { color: var(--muted); font-size: 12.5px; margin-bottom: 6px; }
  pre.cmd { background: var(--code-bg); border: 1px solid var(--border); border-left: 3px solid var(--accent); border-radius: 6px; padding: 10px 12px; margin: 0 0 6px; overflow-x: auto; white-space: pre-wrap; word-break: break-word; }

  .heading-anchored { position: relative; scroll-margin-top: 76px; }

<script id="report-data" type="application/json">{"generated_platform": "Linux", "summary": {"failed": 0, "passed": 3, "skipped": 0}, "tutorials": [{"meta": {"name": "App-wide QML shortcuts in Basecamp (\u2318K focuses the search bar)", "platform": "Linux (ext=so)", "release": "(none)"}, "rows": [{"execs": [], "md": "# App-wide QML shortcuts in Basecamp (\u2318K focuses the search bar)\n\n[`logos-basecamp`](https://github.com/logos-co/logos-basecamp) hosts UI\nplugins inside its own process, each rendered by a `QQuickWidget`. UI plugins\nare free to declare keyboard shortcuts in QML the same way any Qt Quick app\nwould:\n\n```qml\nShortcut {\n    sequence: \"Ctrl+K\"\n    onActivated: searchBar.textInput.forceActiveFocus()\n}\n```\n\nThere is a subtle Qt limitation that gets in the way here: a `QQuickShortcut`\nwith `Qt.WindowShortcut` context checks the containing `QQuickWindow`'s\n`active` property before firing, and inside a `QQuickWidget` the QML runs\nagainst an **offscreen** `QQuickWindow` that never activates the way Qt's\nshortcut matcher expects. Left alone, the QML `Shortcut { }` sits registered\nbut silent \u2014 the user presses \u2318K and nothing happens.\n\nBasecamp works around this with a `ShortcutBridge`. It walks the current\npane's QML tree, finds every `QQuickShortcut`, and mirrors each as a real\nC++ `QShortcut` on the host `QWidget` (context = `ApplicationShortcut`, which\nfires reliably). When a mirror activates, the bridge re-emits `activated()`\non the original QML shortcut so its `onActivated:` handler runs unchanged.\nThe plugin author writes nothing new \u2014 declaring a `Shortcut { }` block in\nQML is enough.\n\nThis doc-test builds **this** basecamp commit as its portable bundle with the\ninspector (`#bin-bundle-dir-inspector`), launches it headless, opens the\n**Applications** view (which\ndeclares `Shortcut { sequence: \"Ctrl+K\"; onActivated: \u2026 }` in\n`AppManagerView.qml`), and drives the bridge end-to-end: it locates the\nmirror the bridge installed for that \u2318K, fires it via the inspector, and\ncaptures the resulting focused search bar. A green run is real evidence that\nthis commit still ships a working bridge \u2014 that the QML shortcut got\nmirrored on pane switch and that firing the mirror does run the plugin's\n`onActivated` handler.\n\n**What you'll build:** This `logos-basecamp` commit, built as the portable bundle with the inspector compiled in (`#bin-bundle-dir-inspector`). The **Applications** pane's QML declares a \u2318K shortcut; the bridge inside basecamp mirrors it as a real C++ QShortcut, which this doc-test exercises through the QML inspector.\n\n**What you'll learn:**\n\n- Why QML `Shortcut { }` blocks inside a `QQuickWidget` don't fire on their own \u2014 the offscreen `QQuickWindow` never satisfies `Qt.WindowShortcut`'s activeness check\n- How `ShortcutBridge` inside `MainContainer` mirrors every QML shortcut it finds under the current pane as a C++ `QShortcut` with `Qt.ApplicationShortcut` context\n- How firing a mirror re-emits `activated()` on the original QML shortcut so the plugin's `onActivated:` handler runs unchanged \u2014 plugin code stays 100% ordinary QML\n- How to write a new app-wide shortcut in a plugin: just declare `Shortcut { sequence: \u2026; onActivated: \u2026 }`. No changes to `MainContainer.cpp` or `ShortcutBridge.cpp`, ever.\n- How to drive a QML shortcut from the outside via `logos-qt-mcp`'s `callMethod` RPC, without needing to synthesise real keyboard input\n\n## Prerequisites\n\n- **Nix** with flakes enabled. Install from [nixos.org](https://nixos.org/download.html), then enable flakes:\n\n```bash\nmkdir -p ~/.config/nix\necho 'experimental-features = nix-command flakes' >> ~/.config/nix/nix.conf\n```\n\nVerify: `nix flake --help >/dev/null 2>&1 && echo \"Flakes enabled\"`\n\n- **Linux, macOS or Windows.** The app runs headless via `QT_QPA_PLATFORM=offscreen`, so no display is required. No network access is needed.\n- **Windows:** the two outputs the build steps below link, staged as `bin-bundle-dir-inspector/` and `logos-qt-mcp/`, plus Git Bash, Python 3 and Node.js."}, {"execs": [], "md": "## Why the bridge exists\n\nIn a plain Qt Quick app, a QML `Shortcut { }` \"just works\" \u2014 its\n`QQuickShortcut` gets registered against a real top-level `QQuickWindow`\nthat Qt activates alongside the OS window, and `Qt.WindowShortcut`'s\ncontext matcher returns true on key press.\n\nBasecamp is a `QWidget`-based shell that hosts its QML views (including\nevery UI plugin) via `QQuickWidget`. `QQuickWidget` renders its QML into\nan **offscreen** `QQuickWindow`, and that offscreen window never gets\nthe \"active\" signal Qt's shortcut matcher requires. On macOS the effect\nis that the plugin's `Shortcut { sequence: \"Ctrl+K\" }` silently fails\nto fire on the first press; on other platforms it may not fire at all.\n\n`ShortcutBridge` (see `src/ShortcutBridge.h`, in the main_ui plugin) fixes this without asking\nplugin authors to change anything. It scans the current pane's QML tree\nfor `QQuickShortcut` objects and, for each one, installs a matching C++\n`QShortcut` on the host `MainContainer` with `Qt::ApplicationShortcut`\ncontext. When the mirror activates (either the normal `activated` path\nor, on macOS, via the `activatedAmbiguously` cycling path), the bridge\ninvokes `activated()` on the original QML shortcut \u2014 the same signal\nthe plugin's `onActivated:` handler is already connected to."}, {"execs": [], "md": "## Step 1: Build the qt-mcp test driver\n\n[`logos-qt-mcp`](https://github.com/logos-co/logos-qt-mcp) is the\nharness the doc-test uses to connect to the app's QML inspector and\ndrive it. Build it once and link it as `./logos-qt-mcp`."}, {"execs": [{"cmd": "if [ -n \"${BASECAMP_QT_MCP:-}\" ]; then ln -sfn \"$BASECAMP_QT_MCP\" logos-qt-mcp\nelse nix build 'github:logos-co/logos-basecamp/e69d124f7e8165cef00a8d6a572d4f780785e91e#logos-qt-mcp' -o logos-qt-mcp; fi\n", "exit_code": 0, "kind": "run", "note": "", "output": "", "status": "pass"}], "md": "### 1.1 Build logos-qt-mcp\n\n```bash\nnix build 'github:logos-co/logos-basecamp/e69d124f7e8165cef00a8d6a572d4f780785e91e#logos-qt-mcp' -o logos-qt-mcp\n```"}, {"execs": [], "md": "## Step 2: Build the basecamp bundle\n\nBuild **this** basecamp commit as the portable bundle with the inspector\ncompiled in, so the driver can attach."}, {"execs": [{"cmd": "if [ -n \"${BASECAMP_BUNDLE:-}\" ]; then ln -sfn \"$BASECAMP_BUNDLE\" bin-bundle-dir-inspector\nelse nix build 'github:logos-co/logos-basecamp/e69d124f7e8165cef00a8d6a572d4f780785e91e#bin-bundle-dir-inspector' -o bin-bundle-dir-inspector; fi\n", "exit_code": 0, "kind": "run", "note": "", "output": "", "status": "pass"}], "md": "### 2.1 Build the bundle\n\n```bash\n# From inside the clone this is simply: nix build '.#bin-bundle-dir-inspector'\nnix build 'github:logos-co/logos-basecamp/e69d124f7e8165cef00a8d6a572d4f780785e91e#bin-bundle-dir-inspector' -o bin-bundle-dir-inspector\n```"}, {"execs": [], "md": "## Step 3: Drive the \u2318K shortcut through the bridge\n\nLaunch the bundle headless, open **Applications**, then use the\ninspector to locate the C++ `QShortcut` mirror the bridge installed for\n\u2318K and fire it. The fact that the mirror is present at all is what\nproves the bridge ran on pane switch; firing its `activated` signal\nthen runs the plugin's `onActivated:` handler, which focuses the search\nbar's inner `TextInput`."}, {"execs": [{"actions": [{"description": "First-run onboarding shows: expect objectName='onboardingQuickSetupButton' .visible == True", "duration_ms": 10, "index": 1, "status": "pass"}, {"description": "Let's go: click objectName='onboardingQuickSetupButton'", "duration_ms": 10, "index": 2, "status": "pass"}, {"description": "App window opens with the sidebar visible: wait for ['Applications', 'Package Manager', 'Settings']", "duration_ms": 64, "index": 3, "status": "pass"}, {"description": "Open the Applications view: cl   DATA.tutorials.forEach((t, i) => {
    const o = document.createElement("option");
    o.value = i; o.textContent = t.meta.name; picker.appendChild(o);
  });

  function execHtml(e) {
    const badge = `<span class="badge ${e.status}">${e.status.toUpperCase()}</span>`;
    const kind = `<span class="kind">${e.kind}${e.platform ? " · " + e.platform : ""}${e.exit_code !== undefined ? " · exit " + e.exit_code : ""}</span>`;
    let h = `<div class="exec"><div class="exec-head">${badge}${kind}</div>`;
    if (e.note) h += `<div class="note">${escapeHtml(e.note)}</div>`;
    if (e.cmd) h += `<pre class="cmd">${escapeHtml(e.cmd)}</pre>`;
    if (e.runner_cmd) h += `<pre class="cmd">${escapeHtml(e.runner_cmd)}</pre>`;
    if (e.actions) {
      const passed = e.actions.filter(a => a.status === "pass").length;
      h += `<div class="kind">UI actions: ${passed}/${e.actions.length} passed</div>`;
      h += `<table class="ui-actions"><tbody>`;
      for (const a of e.actions) {
        const label = a.status === "not_run" ? "NOT RUN" :
          a.status === "running" ? "INTERRUPTED" : a.status.toUpperCase();
        h += `<tr><td>${a.index}</td><td><span class="badge ${a.status}">${label}</span></td>`;
        h += `<td>${escapeHtml(a.description)}`;
        if (a.error) h += `<div class="note">${escapeHtml(a.error)}</div>`;
        h += `</td><td>${a.duration_ms !== undefined ? a.duration_ms + " ms" : ""}</td></tr>`;
      }
      h += `</tbody></table>`;
    }
    const out = (e.output || "").trim();
    if (out) {
      const long = out.split("\n").length > 12;
      if (long) {
        h += `<details><summary>output (${out.split("\n").length} lines)</summary><pre class="output">${escapeHtml(out)}</pre></details>`;
      } else {
        h += `<pre class="output">${escapeHtml(out)}</pre>`;
      }
    }
    h += `</div>`;
    return h;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  }

  function render(idx) {
    const t = DATA.tutorials[idx];
    const main = document.getElementById("main");
    main.innerHTML = "";
    const h = document.createElement("div");
    h.className = "tutorial-title";
    h.textContent = t.meta.name + "  —  " + t.meta.platform;
    main.appendChild(h);

    t.rows.forEach(row => {
      const isStructural = row.execs.length === 0 &&
        (/^#\s|^##\s/.test(row.md.trim()));
      const div = document.createElement("div");
      const hasExec = row.execs.length > 0;
      const hasFail = row.execs.some(e => e.status === "fail");
      div.className = "row" + (hasExec ? "" : (isStructural ? " section" : " preamble")) +
        (hasFail ? " has-fail" : "");

      const left = document.createElement("div");
      left.className = "col left";
      left.innerHTML = `<div class="md">${mdToHtml(row.md)}</div>`;
      div.appendChild(left);

      if (hasExec || !isStructural) {
        const right = document.createElement("div");
        right.className = "col right";
        if (hasExec) {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            row.execs.map(execHtml).join("");
        } else {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            `<div class="empty">No commands run for this step.</div>`;
        }
        div.appendChild(right);
      }
      main.appendChild(div);
    });

    addAnchors(main, slug(t.meta.name));
  }

  function slug(s) {
    return String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  }

  // Octicon "link" — the same glyph GitHub puts next to markdown headings.
  const LINK_ICON =
    '<svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d=' +
    '"M7.775 3.275a.75.75 0 0 0 1.06 1.06l1.25-1.25a2 2 0 1 1 2.83 2.83l-2.5 2.5a2 2 0 0 1-2.83 0 ' +
    '.75.75 0 0 0-1.06 1.06 3.5 3.5 0 0 0 4.95 0l2.5-2.5a3.5 3.5 0 0 0-4.95-4.95l-1.25 1.25Zm-4.69 ' +
    '9.64a2 2 0 0 1 0-2.83l2.5-2.5a2 2 0 0 1 2.83 0 .75.75 0 0 0 1.06-1.06 3.5 3.5 0 0 0-4.95 0l-2.5 ' +
    '2.5a3.5 3.5 0 0 0 4.95 4.95l1.25-1.25a.75.75 0 0 0-1.06-1.06l-1.25 1.25a2 2 0 0 1-2.83 0Z"></path></svg>';

  // Give every heading a stable slug id (deduplicated the way GitHub does, with
  // -1/-2 suffixes) and a permalink whose href is "#<tutorial>/<heading>".
  function addAnchors(container, tutSlug) {
    const used = new Map();
    const nodes = container.querySelectorAll(
      ".tutorial-title, .md h1, .md h2, .md h3, .md h4, .md h5, .md h6"
    );
    nodes.forEach(node => {
      const text = node.textContent.trim();
      const isTitle = node.classList.contains("tutorial-title");
      let href = "#" + tutSlug;
      if (!isTitle) {
        const base = slug(text) || "section";
        const n = (used.get(base) || 0) + 1;
        used.set(base, n);
        node.id = n > 1 ? base + "-" + n : base;
        href += "/" + node.id;
      }
      node.classList.add("heading-anchored");
      const a = document.createElement("a");
      a.className = "anchor";
      a.href = href;
      a.title = "Copy link to this section";
      a.setAttribute("aria-label", "Permalink: " + text);
      a.innerHTML = LINK_ICON;
      node.insertBefore(a, node.firstChild);
    });
  }

  let toastTimer = null;
  function toast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 1600);
  }

  // navigator.clipboard needs a secure context; reports are often opened over
  // file://, so fall back to the old execCommand path there.
  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(
        () => toast("Link copied"),
        () => toast(text)
      );
      return;
    }
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    toast(ok ? "Link copied" : text);
  }

  function scrollToId(id) {
    if (!id) { window.scrollTo(0, 0); return; }
    const el = document.getElementById(id);
    if (!el) return;
    el.scrollIntoView({ block: "start" });
    el.classList.remove("flash");
    void el.offsetWidth;  // restart the animation on a repeat click
    el.classList.add("flash");
  }

  document.addEventListener("click", ev => {
    const a = ev.target.closest && ev.target.closest("a.anchor");
    if (!a) return;
    ev.preventDefault();
    const href = a.getAttribute("href");
    copyText(location.href.split("#")[0] + href);
    if (location.hash === href) scrollToId(a.parentNode.id);
    else location.hash = href;  // hashchange scrolls
  });

  // "#<tutorial>" (name, slug, or index) optionally followed by "/<heading>".
  function parseHash() {
    const raw = decodeURIComponent(location.hash.replace(/^#/, ""));
    if (!raw) return { idx: 0, frag: "" };
    const cut = raw.indexOf("/");
    const tut = cut >= 0 ? raw.slice(0, cut) : raw;
    const frag = cut >= 0 ? raw.slice(cut + 1) : "";
    if (/^\d+$/.test(tut) && +tut < DATA.tutorials.length) return { idx: +tut, frag };
    const i = DATA.tutorials.findIndex(
      t => slug(t.meta.name) === tut || t.meta.name === tut
    );
    if (i >= 0) return { idx: i, frag };
    // No tutorial matched: treat a bare hash as a heading in the current one.
    return { idx: currentIdx >= 0 ? currentIdx : 0, frag: cut >= 0 ? frag : raw };
  }

  let currentIdx = -1;
  function show(idx, frag) {
    if (idx !== currentIdx) {
      picker.value = idx;
      render(idx);
      currentIdx = idx;
    }
    if (frag) requestAnimationFrame(() => scrollToId(frag));
  }
  picker.addEventListener("change", () => {
    location.hash = slug(DATA.tutorials[+picker.value].meta.name);
    show(+picker.value);
  });
  window.addEventListener("hashchange", () => {
    const h = parseHash();
    show(h.idx, h.frag);
  });
  const initial = parseHash();
  show(initial.idx, initial.frag);
  // Inlined screenshots have no intrinsic size until decoded, so the first
  // scroll can land short; re-anchor once everything has loaded.
  if (initial.frag) {
    window.addEventListener("load", () => scrollToId(initial.frag), { once: true });
  }
</script>
</body>
</html>
