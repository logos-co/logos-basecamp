<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --border: #30363d;
    --text: #c9d1d9; --muted: #8b949e; --accent: #58a6ff;
    --pass: #2ea043; --fail: #f85149; --info: #d29922;
    --code-bg: #0b0f14;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  header {
    position: sticky; top: 0; z-index: 10; background: var(--panel);
    border-bottom: 1px solid var(--border); padding: 12px 20px;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  .pill { padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .pill.pass { background: rgba(46,160,67,.15); color: var(--pass); }
  .pill.fail { background: rgba(248,81,73,.15); color: var(--fail); }
  .pill.skip { background: rgba(210,153,34,.15); color: var(--info); }
  select { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; }
  main { max-width: 1600px; margin: 0 auto; padding: 16px; }
  .tutorial-title { font-size: 20px; font-weight: 700; margin: 24px 0 8px; color: #fff; }
  .row {
    display: grid; grid-template-columns: 1fr 1fr; gap: 0;
    border: 1px solid var(--border); border-radius: 8px; margin: 10px 0; overflow: hidden;
  }
  .row.preamble, .row.section { grid-template-columns: 1fr; }
  .col { padding: 14px 18px; min-width: 0; }
  .col.left { border-right: 1px solid var(--border); }
  .row.preamble .col.left, .row.section .col.left { border-right: none; }
  .col.right { background: var(--panel); }
  /* A row containing any failed step is tinted red end-to-end so it's
     impossible to miss when scanning the report. */
  .row.has-fail { border-color: var(--fail); box-shadow: 0 0 0 1px var(--fail); }
  .row.has-fail .col.left { background: rgba(248,81,73,.07); border-right-color: var(--fail); }
  .row.has-fail .col.right { background: rgba(248,81,73,.12); }
  .col-label { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 8px; }
  .md :first-child { margin-top: 0; }
  .md h1 { font-size: 22px; } .md h2 { font-size: 18px; } .md h3 { font-size: 15px; }
  .md pre { background: var(--code-bg); border: 1px solid var(--border); border-radius: 6px; padding: 12px; overflow-x: auto; }
  .md code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; }
  .md :not(pre) > code { background: rgba(110,118,129,.2); padding: .15em .4em; border-radius: 4px; }
  .md table { border-collapse: collapse; margin: 8px 0; }
  .md th, .md td { border: 1px solid var(--border); padding: 5px 10px; }
  .md blockquote { border-left: 3px solid var(--border); margin: 8px 0; padding: 2px 12px; color: var(--muted); }
  .md img { width: 100%; height: auto; border: 1px solid var(--border); border-radius: 6px; }
  .exec { margin-bottom: 14px; }
  .exec:last-child { margin-bottom: 0; }
  .exec-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .badge { font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 4px; }
  .badge.pass { background: rgba(46,160,67,.15); color: var(--pass); }
  .badge.fail { background: rgba(248,81,73,.15); color: var(--fail); }
  .badge.info { background: rgba(210,153,34,.15); color: var(--info); }
  .badge.not_run { background: var(--bg); color: var(--muted); white-space: nowrap; }
  .badge.running { background: rgba(248,81,73,.15); color: var(--fail); }
  .ui-actions { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 12px; }
  .ui-actions td { padding: 6px; border-bottom: 1px solid var(--border); vertical-align: top; }
  .ui-actions td:last-child { white-space: nowrap; color: var(--muted); }
  .kind { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .note { color: var(--muted); font-size: 12.5px; margin-bottom: 6px; }
  pre.cmd { background: var(--code-bg); border: 1px solid var(--border); border-left: 3px solid var(--accent); border-radius: 6px; padding: 10px 12px; margin: 0 0 6px; overflow-x: auto; white-space: pre-wrap; word-break: break-word; }
  pre.output { background: #010409; border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; margin: 0; overflow-x: auto; max-height: 360px; overflow-y: auto; color: #b9c1ca; }
  pre.cmd, pre.output { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; line-height: 1.45; }
  .empty { color: var(--muted); font-style: italic; font-size: 12.5px; }
  details summary { cursor: pointer; color: var(--accent); font-size: 12px; margin-bottom: 4px; }
  /* GitHub-style permalinks: every heading carries a link icon in the left
     gutter (revealed on hover/focus) that copies a deep link to that section.
     scroll-margin-top keeps the target clear of the sticky header. */
  .heading-anchored { position: relative; scroll-margin-top: 76px; }
  a.anchor {
    position: absolute; left: -18px; top: 0; width: 16px; height: 1.55em;
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--muted); opacity: 0; text-decoration: none;
    transition: opacity .1s ease-in;
  }
  a.anchor svg { width: 14px; height: 14px; display: block; }
  .heading-anchored:hover > a.anchor, a.anchor:focus { opacity: 1; }
  a.anchor:hover { color: var(--accent); }
  .heading-anchored.flash { animation: flash 1.4s ease-out; border-radius: 4px; }
  @keyframes flash {
    from { background: rgba(88,166,255,.28); box-shadow: 0 0 0 4px rgba(88,166,255,.28); }
    to { background: transparent; box-shadow: 0 0 0 4px transparent; }
  }
  #toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: var(--panel); border: 1px solid var(--border); color: var(--text);
    border-radius: 6px; padding: 7px 14px; font-size: 12.5px; z-index: 20;
    opacity: 0; pointer-events: none; transition: opacity .15s ease-in-out;
  }
  #toast.show { opacity: 1; }
</style>
</head>

<script id="report-data" type="application/json">{"generated_platform": "windows-latest", "summary": {"failed": 0, "passed": 2, "skipped": 0}, "tutorials": [{"meta": {"name": "Driving the full API surface through a UI plugin in Basecamp", "output": "basecamp-fullapi-ui.md"}, "rows": [{"execs": [], "md": "# Driving the full API surface through a UI plugin in Basecamp\n\nThis doc-test drives the **entire supported API surface** of a Logos module\nthrough a **QML+Qt UI plugin** running inside Basecamp. The plugin\n(`test_fullapi_ui`) consumes the `full_api` contract via an **interface\ndependency**: its backend binds the interface to a runtime-chosen provider,\ncalls every method type \u2014 both **synchronously** and through the non-blocking\n`<method>Async` wrappers \u2014 and subscribes to every event, surfacing the results\nand the most recent event to the QML view, which we assert on.\n\nEverything is built from `logos-test-modules` and the Nix binary cache and\ninstalled into a local `--user-dir`: there is **no package-catalog download and\nno network peer connection**, so the check is fully hermetic. It replaces the\nflaky cross-version chat check, which needed a live catalog fetch and a Waku\nnode connection.\n\nOn top of the same-version run, two **cross-version** cases rebuild the chain's\ncomponents from *different* module-builder toolchains \u2014 the latest release\n(`0.2.3`) vs master \u2014 and drive the full method surface through the\nUI \u2192 proxy \u2192 provider boundary, so a component built one way is proven to\ninteroperate with one built the other way (a hermetic replacement for the old\nchat test's \"fresh build vs latest release\" coverage).\n\n**What you'll build:** The Basecamp bundle (inspector-enabled) and the logos-qt-mcp UI driver, a\nuser-dir containing two providers, a proxy, and the full_api UI plugin, a\nheadless UI run that clicks through the plugin and asserts method + event\nresults, and two more user-dirs whose UI / proxy / provider are built from a\nmix of the module-builder release and master.\n\n\n**What you'll learn:**\n\n- How a ui_qml plugin consumes another module's full API via an interface dependency\n- How to stage locally-built modules into a Basecamp `--user-dir` (no catalog)\n- How the UI drives every method type and receives typed events at runtime\n- How the UI drives the same surface through the non-blocking async wrappers\n- How the same UI drives a C++ provider and a Rust provider interchangeably\n- How the UI \u2192 proxy \u2192 provider chain holds up when its components are built from different module-builder toolchains (release vs master)\n\n## Prerequisites\n\n- **Nix** with flakes enabled. Install from [nixos.org](https://nixos.org/download.html), then enable flakes:\n\n```bash\nmkdir -p ~/.config/nix\necho 'experimental-features = nix-command flakes' >> ~/.config/nix/nix.conf\n```\n\nVerify: `nix flake --help >/dev/null 2>&1 && echo \"Flakes enabled\"`\n\n- **Network access** to fetch the flakes and Nix binary cache. Once everything\nis built, the run itself is offline \u2014 no catalog download, no peer connection.\n\n- **Windows** runs the main walk, not the cross-version ones: the build steps' outputs, staged as `bin-bundle-dir-inspector/`, `logos-qt-mcp/` and one `port-<module>/` per module, plus Git Bash, Python 3 and Node.js."}, {"execs": [], "md": "## Step 1: Build the UI test driver\n\nBuild the logos-qt-mcp driver that connects to the app's QML inspector."}, {"execs": [], "md": "### 1.1 Build logos-qt-mcp\n\n```bash\nnix build '.#logos-qt-mcp' -o logos-qt-mcp\n```"}, {"execs": [], "md": "## Step 2: Build the Basecamp bundle\n\nBuild the inspector-enabled portable bundle \u2014 the same shippable dir bundle,\nwith the QML inspector compiled in so the driver can attach."}, {"execs": [], "md": "### 2.1 Build the bundle\n\n```bash\nnix build '.#bin-bundle-dir-inspector' -o bin-bundle-dir-inspector\n```"}, {"execs": [], "md": "## Step 3: Install the full_api modules into a user-dir\n\nBuild the two providers, the proxy, and the UI plugin from\n`logos-test-modules` as **portable** install outputs, then assemble a\n`--user-dir` by plain copy: core modules under `modules/`, the UI plugin\nunder `plugins/`. No `lgpd`, no catalog, no network."}, {"execs": [], "md": "### 3.1 Build the modules\n\n```bash\nset -e\nSYSTEM=$(nix eval --impure --raw --expr 'builtins.currentSystem')\nfor m in test_fullapi_cpp test_fullapi_rust test_fullapi_proxy test_fullapi_ui; do\n  nix build \"github:logos-co/logos-test-modules#modules.$SYSTEM.$m.install-portable\" --out-link \"port-$m\"\ndone\n\n```"}, {"execs": [{"cmd": "set -e\nrm -rf testdata/fullapi\nmkdir -p testdata/fullapi/modules testdata/fullapi/plugins\nfor m in test_fullapi_cpp test_fullapi_rust test_fullapi_proxy; do\n  cp -RL \"port-$m/modules/.\" testdata/fullapi/modules/\ndone\ncp -RL port-test_fullapi_ui/plugins/. testdata/fullapi/plugins/\nchmod -R u+w testdata/fullapi\necho \"modules:\"; ls testdata/fullapi/modules\necho \"plugins:\"; ls testdata/fullapi/plugins\n", "exit_code": 0, "kind": "run", "output": "modules:\ntest_fullapi_cpp\ntest_fullapi_proxy\ntest_fullapi_rust\nplugins:\ntest_fullapi_ui\n", "status": "pass"}], "md": "### 3.2 Stage them into a user-dir\n\n```bash\nset -e\nrm -rf testdata/fullapi\nmkdir -p testdata/fullapi/modules testdata/fullapi/plugins\nfor m in test_fullapi_cpp test_fullapi_rust test_fullapi_proxy; do\n  cp -RL \"port-$m/modules/.\" testdata/fullapi/modules/\ndone\ncp -RL port-test_fullapi_ui/plugins/. testdata/fullapi/plugins/\nchmod -R u+w testdata/fullapi\necho \"modules:\"; ls testdata/fullapi/modules\necho \"plugins:\"; ls testdata/fullapi/plugins\n\n```"}, {"execs": [], "md": "## Step 4: Launch Basecamp and drive the UI plugin\n\nLaunch the bundle against the assembled user-dir and drive the Full API UI\nplugin headlessly: open it, run every method type against the C++ provider,\nre-bind to the Rust provider, and finally fire events and confi wAAAIBIE2ABAAAAEGkCLAAAAAAiTYAFAAAAQKQJsAAAAACItP8P37lIe9O+wWEAAAAASUVORK5CYII=)"}, {"execs": [], "md": "## Step 5: Cross-version A \u2014 UI + provider from the module-builder release, proxy from master\n\nThe same `full_api` chain, but with its components built from **different\nmodule-builder toolchains**: the UI plugin and the C++ provider from the\nlatest release (`0.2.3`), the proxy from master. The release-toolchain\nmodules are built from a release-era `logos-test-modules` revision (source\nand toolchain travel together \u2014 master source tracks master's codegen), so\nthe mix models the real scenario: modules built at release time\ninteroperating with a master-built one. Everything is still\nassembled the hermetic way \u2014 plain copy of `install-portable` outputs into\na fresh `--user-dir`, no catalog, no network. Driving it through the\nUI \u2192 proxy \u2192 provider boundary proves a module built one way still\ninteroperates with a module built the other way. (`install-portable` is\nsingle-module, so the versions never clobber each other; `capability_module`\ncomes from the Basecamp bundle.)"}, {"execs": [], "md": "### 5.1 Build the version-mixed modules (UI@release, proxy@master, provider@release)\n\n```bash\nset -e\nSYSTEM=$(nix eval --impure --raw --expr 'builtins.currentSystem')\nMB_RELEASE=\"github:logos-co/logos-module-builder/0.2.3\"\n# Release-toolchain modules must be built from release-era SOURCE too:\n# test-modules master tracks module-builder master's codegen (e.g. the\n# void-method signature change in logos-test-modules#30) and no longer\n# compiles with the 0.2.3 generator. Bump this together with MB_RELEASE.\nTM_RELEASE=\"github:logos-co/logos-test-modules/d4c0d04644ca93ba7eaaa2f231d4d428a87cec9d\"\nrm -rf testdata/fullapi-xva\nmkdir -p testdata/fullapi-xva/modules testdata/fullapi-xva/plugins\n# C++ provider (the one the proxy forwards to) \u2014 release toolchain\nnix build \"$TM_RELEASE#modules.$SYSTEM.test_fullapi_cpp.install-portable\" \\\n  --override-input logos-module-builder \"$MB_RELEASE\" --out-link result-xva-cpp\ncp -RL result-xva-cpp/modules/. testdata/fullapi-xva/modules/\n# Rust provider \u2014 release toolchain. The proxy declares BOTH providers\n# as dependencies, so it needs this present to load even though it\n# forwards to the C++ one by default.\nnix build \"$TM_RELEASE#modules.$SYSTEM.test_fullapi_rust.install-portable\" \\\n  --override-input logos-module-builder \"$MB_RELEASE\" --out-link result-xva-rust\ncp -RL result-xva-rust/modules/. testdata/fullapi-xva/modules/\n# proxy \u2014 master toolchain\nnix build \"github:logos-co/logos-test-modules#modules.$SYSTEM.test_fullapi_proxy.install-portable\" \\\n  --out-link result-xva-proxy\ncp -RL result-xva-proxy/modules/. testdata/fullapi-xva/modules/\n# UI plugin \u2014 release toolchain\nnix build \"$TM_RELEASE#modules.$SYSTEM.test_fullapi_ui.install-portable\" \\\n  --override-input logos-module-builder \"$MB_RELEASE\" --out-link result-xva-ui\ncp -RL result-xva-ui/plugins/. testdata/fullapi-xva/plugins/\nchmod -R u+w testdata/fullapi-xva\necho \"modules:\"; ls testdata/fullapi-xva/modules\necho \"plugins:\"; ls testdata/fullapi-xva/plugins\n\n```"}, {"execs": [], "md": "### 5.2 Drive the version-mixed chain (UI@release \u2192 proxy@master \u2192 provider@release)\n\n```bash\nenv HOME=\"$PWD/testdata/fullapi-xva-home\" USERPROFILE=\"$PWD/testdata/fullapi-xva-home\" LOGOS_NO_SCHEME_REGISTER=1 ./bin-bundle-dir-inspector/bin/LogosBasecamp --user-dir \"$PWD/testdata/fullapi-xva\"\n```\n\n![App window opens (cross-version A)](images/fullapi-xva-launch.png)\n\nThe release-built UI drives the master-built proxy, which forwards to the release-built C++ provider; the whole method surface round-trips and the token names the resolved provider.\n\n![Every method type round-trips across the version mix](images/fullapi-xva-results.png)\n\nThe non-blocking wrappers hold up across the release/master boundary too: the release-built UI fires async calls through the master-built proxy to the release-built provider.\n\n![The async client path also round-trips UI \u2192 proxy \u2192 provider across versions](images/fullapi-xva-async-results.png)"}, {"execs": [], "md": "## Step 6: Cross-version B \u2014 UI + provider from master, proxy from the release\n\nThe mirror image: UI plugin and C++ provider from master, proxy from the\nrelease (`0.2.3`). Same hermetic assembly and drive, with the release/master\nsplit on the opposite components."}, {"execs": [], "md": "### 6.1 Build the version-mixed modules (UI@master, proxy@release, provider@master)\n\n```bash\nset -e\nSYSTEM=$(nix eval --impure --raw --expr 'builtins.currentSystem')\nMB_RELEASE=\"github:logos-co/logos-module-builder/0.2.3\"\n# Release-era source for the release-toolchain build (see cross-version\n# A for why). Bump together with MB_RELEASE.\nTM_RELEASE=\"github:logos-co/logos-test-modules/d4c0d04644ca93ba7eaaa2f231d4d428a87cec9d\"\nrm -rf testdata/fullapi-xvb\nmkdir -p testdata/fullapi-xvb/modules testdata/fullapi-xvb/plugins\n# C++ provider (the one the proxy forwards to) \u2014 master toolchain\nnix build \"github:logos-co/logos-test-modules#modules.$SYSTEM.test_fullapi_cpp.install-portable\" \\\n  --out-link result-xvb-cpp\ncp -RL result-xvb-cpp/modules/. testdata/fullapi-xvb/modules/\n# Rust provider \u2014 master toolchain. The proxy declares BOTH providers\n# as dependencies, so it needs this present to load even though it\n# forwards to the C++ one by default.\nnix build \"github:logos-co/logos-test-modules#modules.$SYSTEM.test_fullapi_rust.install-portable\" \\\n  --out-link result-xvb-rust\ncp -RL result-xvb-rust/modules/. testdata/fullapi-xvb/modules/\n# proxy \u2014 release toolchain\nnix build \"$TM_RELEASE#modules.$SYSTEM.test_fullapi_proxy.install-portable\" \\\n  --override-input logos-module-builder \"$MB_RELEASE\" --out-link result-xvb-proxy\ncp -RL result-xvb-proxy/modules/. testdata/fullapi-xvb/modules/\n# UI plugin \u2014 master toolchain\nnix build \"github:logos-co/logos-test-modules#modules.$SYSTEM.test_fullapi_ui.install-portable\" \\\n  --out-link result-xvb-ui\ncp -RL result-xvb-ui/plugins/. testdata/fullapi-xvb/plugins/\nchmod -R u+w testdata/fullapi-xvb\necho \"modules:\"; ls testdata/fullapi-xvb/modules\necho \"plugins:\"; ls testdata/fullapi-xvb/plugins\n\n```"}, {"execs": [], "md": "### 6.2 Drive the version-mixed chain (UI@master \u2192 proxy@release \u2192 provider@master)\n\n```bash\nenv HOME=\"$PWD/testdata/fullapi-xvb-home\" USERPROFILE=\"$PWD/testdata/fullapi-xvb-home\" LOGOS_NO_SCHEME_REGISTER=1 ./bin-bundle-dir-inspector/bin/LogosBasecamp --user-dir \"$PWD/testdata/fullapi-xvb\"\n```\n\n![App window opens (cross-version B)](images/fullapi-xvb-launch.png)\n\n![Every method type round-trips across the version mix](images/fullapi-xvb-results.png)\n\nThe non-blocking wrappers hold up across the master/release boundary too: the master-built UI fires async calls through the release-built proxy to the master-built provider.\n\n![The async client path also round-trips UI \u2192 proxy \u2192 provider across versions](images/fullapi-xvb-async-results.png)"}]}], "version": 1}</script>
<script>
  const DATA = JSON.parse(document.getElementById("report-data").textContent);
  if (window.marked) { marked.setOptions({ gfm: true, breaks: false }); }
  const mdToHtml = (s) => window.marked ? marked.parse(s || "") : ("<pre>" + (s || "") + "</pre>");

  const sum = DATA.summary;
  document.getElementById("summary").innerHTML =
    `<span class="pill pass">${sum.passed} passed</span> ` +
    (sum.failed ? `<span class="pill fail">${sum.failed} failed</span> ` : "") +
    (sum.skipped ? `<span class="pill skip">${sum.skipped} skipped</span>` : "");

  const picker = document.getElementById("picker");
  DATA.tutorials.forEach((t, i) => {
    const o = document.createElement("option");
    o.value = i; o.textContent = t.meta.name; picker.appendChild(o);
  });

  function execHtml(e) {
    const badge = `<span class="badge ${e.status}">${e.status.toUpperCase()}</span>`;
    const kind = `<span class="kind">${e.kind}${e.platform ? " · " + e.platform : ""}${e.exit_code !== undefined ? " · exit " + e.exit_code : ""}</span>`;
    let h = `<div class="exec"><div class="exec-head">${badge}${kind}</div>`;
    if (e.note) h += `<div class="note">${escapeHtml(e.note)}</div>`;
    if (e.cmd) h += `<pre class="cmd">${escapeHtml(e.cmd)}</pre>`;
    if (e.runner_cmd) h += `<pre class="cmd">${escapeHtml(e.runner_cmd)}</pre>`;
    if (e.actions) {
      const passed = e.actions.filter(a => a.status === "pass").length;
      h += `<div class="kind">UI actions: ${passed}/${e.actions.length} passed</div>`;
      h += `<table class="ui-actions"><tbody>`;
      for (const a of e.actions) {
        const label = a.status === "not_run" ? "NOT RUN" :
          a.status === "running" ? "INTERRUPTED" : a.status.toUpperCase();
        h += `<tr><td>${a.index}</td><td><span class="badge ${a.status}">${label}</span></td>`;
        h += `<td>${escapeHtml(a.description)}`;
        if (a.error) h += `<div class="note">${escapeHtml(a.error)}</div>`;
        h += `</td><td>${a.duration_ms !== undefined ? a.duration_ms + " ms" : ""}</td></tr>`;
      }
      h += `</tbody></table>`;
    }
    const out = (e.output || "").trim();
    if (out) {
      const long = out.split("\n").length > 12;
      if (long) {
        h += `<details><summary>output (${out.split("\n").length} lines)</summary><pre class="output">${escapeHtml(out)}</pre></details>`;
      } else {
        h += `<pre class="output">${escapeHtml(out)}</pre>`;
      }
    }
    h += `</div>`;
    return h;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  }

  function render(idx) {
    const t = DATA.tutorials[idx];
    const main = document.getElementById("main");
    main.innerHTML = "";
    const h = document.createElement("div");
    h.className = "tutorial-title";
    h.textContent = t.meta.name + "  —  " + t.meta.platform;
    main.appendChild(h);

    t.rows.forEach(row => {
      const isStructural = row.execs.length === 0 &&
        (/^#\s|^##\s/.test(row.md.trim()));
      const div = document.createElement("div");
      const hasExec = row.execs.length > 0;
      const hasFail = row.execs.some(e => e.status === "fail");
      div.className = "row" + (hasExec ? "" : (isStructural ? " section" : " preamble")) +
        (hasFail ? " has-fail" : "");

      const left = document.createElement("div");
      left.className = "col left";
      left.innerHTML = `<div class="md">${mdToHtml(row.md)}</div>`;
      div.appendChild(left);

      if (hasExec || !isStructural) {
        const right = document.createElement("div");
        right.className = "col right";
        if (hasExec) {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            row.execs.map(execHtml).join("");
        } else {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            `<div class="empty">No commands run for this step.</div>`;
        }
        div.appendChild(right);
      }
      main.appendChild(div);
    });

    addAnchors(main, slug(t.meta.name));
  }

  function slug(s) {
    return String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  }

  // Octicon "link" — the same glyph GitHub puts next to markdown headings.
  const LINK_ICON =
    '<svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d=' +
    '"M7.775 3.275a.75.75 0 0 0 1.06 1.06l1.25-1.25a2 2 0 1 1 2.83 2.83l-2.5 2.5a2 2 0 0 1-2.83 0 ' +
    '.75.75 0 0 0-1.06 1.06 3.5 3.5 0 0 0 4.95 0l2.5-2.5a3.5 3.5 0 0 0-4.95-4.95l-1.25 1.25Zm-4.69 ' +
    '9.64a2 2 0 0 1 0-2.83l2.5-2.5a2 2 0 0 1 2.83 0 .75.75 0 0 0 1.06-1.06 3.5 3.5 0 0 0-4.95 0l-2.5 ' +
    '2.5a3.5 3.5 0 0 0 4.95 4.95l1.25-1.25a.75.75 0 0 0-1.06-1.06l-1.25 1.25a2 2 0 0 1-2.83 0Z"></path></svg>';

  // Give every heading a stable slug id (deduplicated the way GitHub does, with
  // -1/-2 suffixes) and a permalink whose href is "#<tutorial>/<heading>".
  function addAnchors(container, tutSlug) {
    const used = new Map();
    const nodes = container.querySelectorAll(
      ".tutorial-title, .md h1, .md h2, .md h3, .md h4, .md h5, .md h6"
    );
    nodes.forEach(node => {
      const text = node.textContent.trim();
      const isTitle = node.classList.contains("tutorial-title");
      let href = "#" + tutSlug;
      if (!isTitle) {
        const base = slug(text) || "section";
        const n = (used.get(base) || 0) + 1;
        used.set(base, n);
        node.id = n > 1 ? base + "-" + n : base;
        href += "/" + node.id;
      }
      node.classList.add("heading-anchored");
      const a = document.createElement("a");
      a.className = "anchor";
      a.href = href;
      a.title = "Copy link to this section";
      a.setAttribute("aria-label", "Permalink: " + text);
      a.innerHTML = LINK_ICON;
      node.insertBefore(a, node.firstChild);
    });
  }

  let toastTimer = null;
  function toast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 1600);
  }

  // navigator.clipboard needs a secure context; reports are often opened over
  // file://, so fall back to the old execCommand path there.
  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(
        () => toast("Link copied"),
        () => toast(text)
      );
      return;
    }
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    toast(ok ? "Link copied" : text);
  }

  function scrollToId(id) {
    if (!id) { window.scrollTo(0, 0); return; }
    const el = document.getElementById(id);
    if (!el) return;
    el.scrollIntoView({ block: "start" });
    el.classList.remove("flash");
    void el.offsetWidth;  // restart the animation on a repeat click
    el.classList.add("flash");
  }

  document.addEventListener("click", ev => {
    const a = ev.target.closest && ev.target.closest("a.anchor");
    if (!a) return;
    ev.preventDefault();
    const href = a.getAttribute("href");
    copyText(location.href.split("#")[0] + href);
    if (location.hash === href) scrollToId(a.parentNode.id);
    else location.hash = href;  // hashchange scrolls
  });

  // "#<tutorial>" (name, slug, or index) optionally followed by "/<heading>".
  function parseHash() {
    const raw = decodeURIComponent(location.hash.replace(/^#/, ""));
    if (!raw) return { idx: 0, frag: "" };
    const cut = raw.indexOf("/");
    const tut = cut >= 0 ? raw.slice(0, cut) : raw;
    const frag = cut >= 0 ? raw.slice(cut + 1) : "";
    if (/^\d+$/.test(tut) && +tut < DATA.tutorials.length) return { idx: +tut, frag };
    const i = DATA.tutorials.findIndex(
      t => slug(t.meta.name) === tut || t.meta.name === tut
    );
    if (i >= 0) return { idx: i, frag };
    // No tutorial matched: treat a bare hash as a heading in the current one.
    return { idx: currentIdx >= 0 ? currentIdx : 0, frag: cut >= 0 ? frag : raw };
  }

  let currentIdx = -1;
  function show(idx, frag) {
    if (idx !== currentIdx) {
      picker.value = idx;
      render(idx);
      currentIdx = idx;
    }
    if (frag) requestAnimationFrame(() => scrollToId(frag));
  }
  picker.addEventListener("change", () => {
    location.hash = slug(DATA.tutorials[+picker.value].meta.name);
    show(+picker.value);
  });
  window.addEventListener("hashchange", () => {
    const h = parseHash();
    show(h.idx, h.frag);
  });
  const initial = parseHash();
  show(initial.idx, initial.frag);
  // Inlined screenshots have no intrinsic size until decoded, so the first
  // scroll can land short; re-anchor once everything has loaded.
  if (initial.frag) {
    window.addEventListener("load", () => scrollToId(initial.frag), { once: true });
  }
</script>
</body>
</html>
