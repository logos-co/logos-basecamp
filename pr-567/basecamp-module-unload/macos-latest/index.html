<script id="report-data" type="application/json">{"generated_platform": "Darwin", "summary": {"failed": 1, "passed": 5, "skipped": 0}, "tutorials": [{"meta": {"name": "Unloading modules in Basecamp: protected modules, leaf unloads, dependency cascades, and reload", "platform": "Darwin (ext=dylib)", "release": "(none)"}, "rows": [{"execs": [], "md": "# Unloading modules in Basecamp: protected modules, leaf unloads, dependency cascades, and reload\n\nBasecamp's **Settings \u2192 Module Inspector** is where you manage the\nbackground modules loaded into the runtime \u2014 each row carries a\n**Load / Unload** toggle. Two rules govern that toggle. First, the modules\nBasecamp itself runs on \u2014 the package pipeline (`package_manager`,\n`package_downloader`) and the auth-token registry (`capability_module`) \u2014\nare **protected**: their toggle renders disabled, because unloading any of\nthem would take the app's own plumbing down. Second, for everything else,\nBasecamp refuses to silently strand a running module's dependents:\nunloading a module that others are running on top of raises a **cascade\nconfirmation** listing exactly what would be terminated with it.\n\nThis doc-test builds **this** basecamp commit as the portable bundle,\nstages the `logos-test-modules` full-API chain into a `--user-dir` (a real\nthree-level dependency graph that is *not* protected), launches the app\nheadless, and drives five stories end to end:\n\n1. **Protected modules** \u2014 the three baked-in core modules report\n   **Loaded**, and their Load/Unload toggle is disabled.\n2. **Leaf load + unload** \u2014 load `test_fullapi_cpp` while nothing runs on\n   top of it, then unload it again: the row flips with no dialog.\n3. **Cascade unload** \u2014 open the **Full API UI** app (which loads\n   `test_fullapi_ui` on top of `test_fullapi_proxy`, which in turn pulls in\n   both providers), then unload `test_fullapi_cpp` from the Module\n   Inspector: the cascade dialog appears, lists the loaded dependents, and\n   confirming it unloads the whole chain \u2014 while the unrelated\n   `test_fullapi_rust` stays loaded.\n4. **Reload after cascade** \u2014 click the **Full API UI** sidebar entry\n   again: the plugin and the core modules underneath it load back.\n5. **Cascade goes up, not down** \u2014 with the chain loaded again, unload\n   `test_fullapi_proxy` directly: the dialog lists only the **Full API\n   UI**, confirming tears down the proxy and the plugin \u2014 and the proxy's\n   own dependencies (`test_fullapi_cpp`, `test_fullapi_rust`) stay loaded.\n\nEverything is driven through the QML inspector with\n[`logos-qt-mcp`](https://github.com/logos-co/logos-qt-mcp): per-row buttons\nare clicked by their stable `objectName`s, row and dialog state is asserted\nwith `expect_property`, and a screenshot is captured at each step.\n\n**What you'll build:** This `logos-basecamp` commit built as the portable bundle\n(`#bin-bundle-dir-inspector`), the logos-qt-mcp UI driver, and a staged\n`--user-dir` carrying the `test_fullapi_*` module chain \u2014 plus a headless UI\nrun that verifies the protected core modules cannot be unloaded, loads and\nunloads a leaf core module, triggers and confirms the unload-cascade dialog\nfor a module with running dependents, reloads the app the cascade tore\ndown, and confirms that a cascade only ever takes dependents with it \u2014 never\nthe target's own dependencies.\n\n\n**What you'll learn:**\n\n- Which core modules Basecamp protects from Load/Unload in the **Module Inspector**, and why (`package_manager`, `package_downloader`, `capability_module`)\n- Why unloading a *leaf* module (no loaded dependents) needs no confirmation\n- How Basecamp detects loaded dependents and raises the **Unload Dependent Modules?** cascade dialog instead of stranding them\n- What confirming the cascade does \u2014 the core module and every loaded dependent (core modules and UI plugins alike) are torn down together, and nothing else is\n- How a UI plugin recovers after it was cascade-unloaded \u2014 clicking its sidebar entry loads the plugin and its core modules back\n- That a cascade only walks *up* the dependency graph (dependents), never *down* \u2014 unloading a module leaves the modules it depends on loaded\n- How to drive per-row module actions headlessly with logos-qt-mcp (stable per-module objectNames + expect_property, not ambiguous text clicks)\n\n## Prerequisites\n\n- **Nix** with flakes enabled. Install from [nixos.org](https://nixos.org/download.html), then enable flakes:\n\n```bash\nmkdir -p ~/.config/nix\necho 'experimental-features = nix-command flakes' >> ~/.config/nix/nix.conf\n```\n\nVerify: `nix flake --help >/dev/null 2>&1 && echo \"Flakes enabled\"`\n\n- **Windows:** the build steps' outputs, staged as `bin-bundle-dir-inspector/`, `logos-qt-mcp/` and one `port-<module>/` per module, plus Git Bash, Python 3 and Node.js.\n- **Linux, macOS or Windows.** The app runs headless via `QT_QPA_PLATFORM=offscreen`, so no display is required. Network access is only needed to fetch the flakes and the Nix binary cache \u2014 the run itself is offline."}, {"execs": [], "md": "## Who depends on whom\n\nThe bundle carries three core modules, all of them protected, and the\nstaged user-dir adds a three-level chain from\n[`logos-test-modules`](https://github.com/logos-co/logos-test-modules)\nwith every edge declared in the modules' `metadata.json`:\n\n```\nBundle (protected \u2014 Load/Unload disabled):\npackage_manager, package_downloader, capability_module\n\nUser-dir (unprotected):\ntest_fullapi_ui   (UI plugin, \"Full API UI\")\n    \u2514\u2500\u25ba test_fullapi_proxy   (core)\n            \u251c\u2500\u25ba test_fullapi_cpp   (core)\n            \u2514\u2500\u25ba test_fullapi_rust  (core)\n```\n\nThe protected modules auto-load at startup. Nothing in the user-dir\ndoes \u2014 `test_fullapi_ui` loads the first time its sidebar entry is\nclicked, and pulls `test_fullapi_proxy` and both providers in as\ndependencies. That gives us both unload flavours from one launch:\n\n- Before the Full API UI has been opened, `test_fullapi_cpp` is a leaf \u2014\n  loading and unloading it needs no confirmation, because the only\n  modules that depend on it aren't running.\n- Once the Full API UI is open, `test_fullapi_cpp` has *loaded*\n  dependents (`test_fullapi_proxy` and `test_fullapi_ui`) \u2014 unloading it\n  must go through the cascade dialog. `test_fullapi_rust` does not\n  depend on it and must survive the cascade untouched.\n- Unloading `test_fullapi_proxy` while the Full API UI is open has one\n  loaded dependent (the UI) and two loaded *dependencies* (`cpp`,\n  `rust`) \u2014 the cascade must take the former and leave the latter."}, {"execs": [], "md": "## Step 1: Build the UI test driver\n\n[`logos-qt-mcp`](https://github.com/logos-co/logos-qt-mcp) is the harness\nthe doc-test uses to connect to the app's QML inspector and drive it."}, {"execs": [{"cmd": "if [ -n \"${BASECAMP_QT_MCP:-}\" ]; then ln -sfn \"$BASECAMP_QT_MCP\" logos-qt-mcp\nelse nix build 'github:logos-co/logos-basecamp/4c6ab642b42ff8fbc0bc0c02b0d6ad48647e7d13#logos-qt-mcp' -o logos-qt-mcp; fi\n", "exit_code": 0, "kind": "run", "note": "", "output": "", "status": "pass"}], "md": "### 1.1 Build logos-qt-mcp\n\n```bash\nnix build '.#logos-qt-mcp' -o logos-qt-mcp\n```"}, {"execs": [], "md": "## Step 2: Build the Basecamp bundle\n\nBuild **this** basecamp commit as the inspector-enabled portable bundle\nand link it as `./bin-bundle-dir-inspector`.\n\n> The `` in the URL pins the build to a specific commit: the\n> doc-test runner expands it to a concrete ref. Locally that is this\n> checkout's `HEAD` (see `run.sh`); in CI it is the commit being tested.\n> With no pin it falls back to the latest `master`."}, {"execs": [{"cmd": "if [ -n \"${BASECAMP_BUNDLE:-}\" ]; then ln -sfn \"$BASECAMP_BUNDLE\" bin-bundle-dir-inspector\nelse nix build \"${BASECAMP_FLAKE:-github:logos-co/logos-basecamp/4c6ab642b test_fullapi_cpp is not loaded again](images/unload-leaf-unloaded.png)\n\nClicking the **Full API UI** sidebar entry loads `test_fullapi_ui` \u2014 and, as its dependencies, `test_fullapi_proxy`, `test_fullapi_cpp` and `test_fullapi_rust`. From here on `test_fullapi_cpp` has running dependents.\n\n![Let the chain finish loading, then capture it](images/unload-fullapi-open.png)\n\nAll three user-dir core modules are **Loaded** now \u2014 pulled in as dependencies of the Full API UI.\n\n![\u2026and test_fullapi_proxy](images/unload-chain-loaded.png)\n\nSame button, different outcome: `test_fullapi_proxy` and `test_fullapi_ui` are running on top of `test_fullapi_cpp`, so instead of unloading, Basecamp raises the cascade confirmation.\n\nThe **Unload Dependent Modules?** dialog spells out the blast radius before anything happens: the proxy and the Full API UI are currently loaded, depend on this module, and will be terminated by the unload.\n\n![Let the dialog finish opening, then capture it](images/unload-cascade-dialog.png)\n\n**Unload All** runs the cascade: the runtime unloads `test_fullapi_cpp` together with its dependents, and Basecamp tears down the `test_fullapi_ui` widget it was hosting.\n\nEvery side of the cascade landed, and only those: `test_fullapi_cpp` and `test_fullapi_proxy` report **Not loaded**, the Full API UI tile reports not-loaded \u2014 while `test_fullapi_rust`, which never depended on the target, is still **Loaded**.\n\n![\u2026and test_fullapi_rust is untouched](images/unload-cascade-done.png)\n\nThe sidebar entry works again immediately: Basecamp notices the plugin is gone and loads `test_fullapi_ui` \u2014 pulling `test_fullapi_proxy` and `test_fullapi_cpp` back into the runtime as its dependencies.\n\n![Let the chain load back, then capture it](images/unload-fullapi-reopened.png)\n\nThe closing proof: `test_fullapi_cpp` and `test_fullapi_proxy` are **Loaded** again \u2014 pulled back into the runtime as dependencies of the reloaded Full API UI. The app survives a full cascade-unload/reload cycle.\n\n![\u2026and test_fullapi_proxy is loaded again](images/unload-chain-reloaded.png)\n\nThis time the target is `test_fullapi_proxy` \u2014 the module the Full API UI depends on *directly*. Its only running dependent is the UI plugin, so that is all the dialog lists; the providers underneath it are dependencies, not dependents, and don't appear.\n\n![Let the proxy dialog finish opening, then capture it](images/unload-proxy-cascade-dialog.png)\n\n**Unload All** unloads `test_fullapi_proxy` and tears down the Full API UI on top of it.\n\nThe cascade walked *up* the graph only: the proxy and the UI plugin that depended on it are gone, while both providers the proxy itself depended on \u2014 `test_fullapi_cpp` and `test_fullapi_rust` \u2014 are still **Loaded**. Unloading a module never drags its own dependencies down with it.\n\n![\u2026and so is test_fullapi_rust](images/unload-proxy-cascade-done.png)\n\nOne green run proved all five stories against this commit: the\nthree core modules Basecamp runs on (`package_manager`,\n`package_downloader`, `capability_module`) are **Loaded** and their\nLoad/Unload toggle is **disabled**; a leaf core module\n(`test_fullapi_cpp`) loads and unloads with no confirmation; once\nthe Full API UI is running on top of it, unloading it raises the\n**Unload Dependent Modules?** dialog listing `test_fullapi_proxy`\nand the Full API UI, and **Unload All** tears down exactly those \u2014\nleaving `test_fullapi_rust` loaded; clicking the Full API UI entry\nagain brings the plugin and its core modules back; and unloading\n`test_fullapi_proxy` directly cascades to the Full API UI alone,\nleaving the providers it depends on loaded. The captured\nscreenshots are embedded above and in the CI report."}]}], "version": 1}</script>
<script>
  const DATA = JSON.parse(document.getElementById("report-data").textContent);
  if (window.marked) { marked.setOptions({ gfm: true, breaks: false }); }
  const mdToHtml = (s) => window.marked ? marked.parse(s || "") : ("<pre>" + (s || "") + "</pre>");

  const sum = DATA.summary;
  document.getElementById("summary").innerHTML =
    `<span class="pill pass">${sum.passed} passed</span> ` +
    (sum.failed ? `<span class="pill fail">${sum.failed} failed</span> ` : "") +
    (sum.skipped ? `<span class="pill skip">${sum.skipped} skipped</span>` : "");

  const picker = document.getElementById("picker");
  DATA.tutorials.forEach((t, i) => {
    const o = document.createElement("option");
    o.value = i; o.textContent = t.meta.name; picker.appendChild(o);
  });

  function execHtml(e) {
    const badge = `<span class="badge ${e.status}">${e.status.toUpperCase()}</span>`;
    const kind = `<span class="kind">${e.kind}${e.platform ? " · " + e.platform : ""}${e.exit_code !== undefined ? " · exit " + e.exit_code : ""}</span>`;
    let h = `<div class="exec"><div class="exec-head">${badge}${kind}</div>`;
    if (e.note) h += `<div class="note">${escapeHtml(e.note)}</div>`;
    if (e.cmd) h += `<pre class="cmd">${escapeHtml(e.cmd)}</pre>`;
    if (e.runner_cmd) h += `<pre class="cmd">${escapeHtml(e.runner_cmd)}</pre>`;
    if (e.actions) {
      const passed = e.actions.filter(a => a.status === "pass").length;
      h += `<div class="kind">UI actions: ${passed}/${e.actions.length} passed</div>`;
      h += `<table class="ui-actions"><tbody>`;
      for (const a of e.actions) {
        const label = a.status === "not_run" ? "NOT RUN" :
          a.status === "running" ? "INTERRUPTED" : a.status.toUpperCase();
        h += `<tr><td>${a.index}</td><td><span class="badge ${a.status}">${label}</span></td>`;
        h += `<td>${escapeHtml(a.description)}`;
        if (a.error) h += `<div class="note">${escapeHtml(a.error)}</div>`;
        h += `</td><td>${a.duration_ms !== undefined ? a.duration_ms + " ms" : ""}</td></tr>`;
      }
      h += `</tbody></table>`;
    }
    const out = (e.output || "").trim();
    if (out) {
      const long = out.split("\n").length > 12;
      if (long) {
        h += `<details><summary>output (${out.split("\n").length} lines)</summary><pre class="output">${escapeHtml(out)}</pre></details>`;
      } else {
        h += `<pre class="output">${escapeHtml(out)}</pre>`;
      }
    }
    h += `</div>`;
    return h;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  }

  function render(idx) {
    const t = DATA.tutorials[idx];
    const main = document.getElementById("main");
    main.innerHTML = "";
    const h = document.createElement("div");
    h.className = "tutorial-title";
    h.textContent = t.meta.name + "  —  " + t.meta.platform;
    main.appendChild(h);

    t.rows.forEach(row => {
      const isStructural = row.execs.length === 0 &&
        (/^#\s|^##\s/.test(row.md.trim()));
      const div = document.createElement("div");
      const hasExec = row.execs.length > 0;
      const hasFail = row.execs.some(e => e.status === "fail");
      div.className = "row" + (hasExec ? "" : (isStructural ? " section" : " preamble")) +
        (hasFail ? " has-fail" : "");

      const left = document.createElement("div");
      left.className = "col left";
      left.innerHTML = `<div class="md">${mdToHtml(row.md)}</div>`;
      div.appendChild(left);

      if (hasExec || !isStructural) {
        const right = document.createElement("div");
        right.className = "col right";
        if (hasExec) {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            row.execs.map(execHtml).join("");
        } else {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            `<div class="empty">No commands run for this step.</div>`;
        }
        div.appendChild(right);
      }
      main.appendChild(div);
    });

    addAnchors(main, slug(t.meta.name));
  }

  function slug(s) {
    return String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  }

  // Octicon "link" — the same glyph GitHub puts next to markdown headings.
  const LINK_ICON =
    '<svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d=' +
    '"M7.775 3.275a.75.75 0 0 0 1.06 1.06l1.25-1.25a2 2 0 1 1 2.83 2.83l-2.5 2.5a2 2 0 0 1-2.83 0 ' +
    '.75.75 0 0 0-1.06 1.06 3.5 3.5 0 0 0 4.95 0l2.5-2.5a3.5 3.5 0 0 0-4.95-4.95l-1.25 1.25Zm-4.69 ' +
    '9.64a2 2 0 0 1 0-2.83l2.5-2.5a2 2 0 0 1 2.83 0 .75.75 0 0 0 1.06-1.06 3.5 3.5 0 0 0-4.95 0l-2.5 ' +
    '2.5a3.5 3.5 0 0 0 4.95 4.95l1.25-1.25a.75.75 0 0 0-1.06-1.06l-1.25 1.25a2 2 0 0 1-2.83 0Z"></path></svg>';

  // Give every heading a stable slug id (deduplicated the way GitHub does, with
  // -1/-2 suffixes) and a permalink whose href is "#<tutorial>/<heading>".
  function addAnchors(container, tutSlug) {
    const used = new Map();
    const nodes = container.querySelectorAll(
      ".tutorial-title, .md h1, .md h2, .md h3, .md h4, .md h5, .md h6"
    );
    nodes.forEach(node => {
      const text = node.textContent.trim();
      const isTitle = node.classList.contains("tutorial-title");
      let href = "#" + tutSlug;
      if (!isTitle) {
        const base = slug(text) || "section";
        const n = (used.get(base) || 0) + 1;
        used.set(base, n);
        node.id = n > 1 ? base + "-" + n : base;
        href += "/" + node.id;
      }
      node.classList.add("heading-anchored");
      const a = document.createElement("a");
      a.className = "anchor";
      a.href = href;
      a.title = "Copy link to this section";
      a.setAttribute("aria-label", "Permalink: " + text);
      a.innerHTML = LINK_ICON;
      node.insertBefore(a, node.firstChild);
    });
  }

  let toastTimer = null;
  function toast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 1600);
  }

  // navigator.clipboard needs a secure context; reports are often opened over
  // file://, so fall back to the old execCommand path there.
  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(
        () => toast("Link copied"),
        () => toast(text)
      );
      return;
    }
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    toast(ok ? "Link copied" : text);
  }

  function scrollToId(id) {
    if (!id) { window.scrollTo(0, 0); return; }
    const el = document.getElementById(id);
    if (!el) return;
    el.scrollIntoView({ block: "start" });
    el.classList.remove("flash");
    void el.offsetWidth;  // restart the animation on a repeat click
    el.classList.add("flash");
  }

  document.addEventListener("click", ev => {
    const a = ev.target.closest && ev.target.closest("a.anchor");
    if (!a) return;
    ev.preventDefault();
    const href = a.getAttribute("href");
    copyText(location.href.split("#")[0] + href);
    if (location.hash === href) scrollToId(a.parentNode.id);
    else location.hash = href;  // hashchange scrolls
  });

  // "#<tutorial>" (name, slug, or index) optionally followed by "/<heading>".
  function parseHash() {
    const raw = decodeURIComponent(location.hash.replace(/^#/, ""));
    if (!raw) return { idx: 0, frag: "" };
    const cut = raw.indexOf("/");
    const tut = cut >= 0 ? raw.slice(0, cut) : raw;
    const frag = cut >= 0 ? raw.slice(cut + 1) : "";
    if (/^\d+$/.test(tut) && +tut < DATA.tutorials.length) return { idx: +tut, frag };
    const i = DATA.tutorials.findIndex(
      t => slug(t.meta.name) === tut || t.meta.name === tut
    );
    if (i >= 0) return { idx: i, frag };
    // No tutorial matched: treat a bare hash as a heading in the current one.
    return { idx: currentIdx >= 0 ? currentIdx : 0, frag: cut >= 0 ? frag : raw };
  }

  let currentIdx = -1;
  function show(idx, frag) {
    if (idx !== currentIdx) {
      picker.value = idx;
      render(idx);
      currentIdx = idx;
    }
    if (frag) requestAnimationFrame(() => scrollToId(frag));
  }
  picker.addEventListener("change", () => {
    location.hash = slug(DATA.tutorials[+picker.value].meta.name);
    show(+picker.value);
  });
  window.addEventListener("hashchange", () => {
    const h = parseHash();
    show(h.idx, h.frag);
  });
  const initial = parseHash();
  show(initial.idx, initial.frag);
  // Inlined screenshots have no intrinsic size until decoded, so the first
  // scroll can land short; re-anchor once everything has loaded.
  if (initial.frag) {
    window.addEventListener("load", () => scrollToId(initial.frag), { once: true });
  }
</script>
</body>
</html>
