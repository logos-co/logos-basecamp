name: "Unloading modules in Basecamp: leaf unloads, dependency cascades, and reload"
output: basecamp-module-unload.md
release: ""

intro: |
  Basecamp's **Settings → Module Inspector** is where you manage the
  background modules loaded into the runtime — each row carries a
  **Load / Unload** toggle. But modules depend on each other, and
  Basecamp refuses to silently strand a running module's dependents: unloading
  a module that others are running on top of raises a **cascade confirmation**
  listing exactly what would be terminated with it.

  This doc-test builds **this** basecamp commit as the normal development app
  (`#app`), launches it headless, and drives the three unload stories end to
  end:

  1. **Leaf unload** — unload the `package_downloader` module while nothing is
     running on top of it: the row flips to **Not loaded** with no dialog,
     and one more click loads it right back.
  2. **Cascade unload** — open the **Package Manager** (which loads the
     `package_manager_ui` plugin on top of the `package_manager` module), then
     unload `package_manager` from the Module Inspector: the cascade dialog
     appears, lists the dependent, and confirming it unloads **both**.
  3. **Reload after cascade** — click the **Package Manager** sidebar entry
     again: the plugin (and the core module underneath it) load back and the
     view renders. This is the regression guard for a real bug where a stale
     widget pointer left the Package Manager view permanently blank after an
     unload.

  The machinery under test is `UIPluginManager`'s unload cascade
  (`loadedDependentsOf` → `unloadCascadeConfirmationRequested` →
  `confirmUnloadCascade` → `unloadModuleWithDependents` + UI teardown), the
  dependency information `PackageCoordinator` assembles from the
  `package_manager` module's `resolveFlatDependents`, and `MainContainer`'s
  Package-Manager-view reload path.

what_you_build: |
  This `logos-basecamp` commit built as the development app (`#app`) and the
  logos-qt-mcp UI driver, plus a headless UI run that unloads and reloads a
  leaf core module, triggers and confirms the unload-cascade dialog for a
  module with a running dependent, and reloads the Package Manager view after
  the cascade tore it down.

what_you_learn:
  - How **Settings → Module Inspector** loads and unloads runtime modules, and how the row state (Loaded/Not loaded status badge, live stats) tracks it
  - Why unloading a *leaf* module (no loaded dependents) needs no confirmation
  - How Basecamp detects loaded dependents and raises the **Unload Dependent Modules?** cascade dialog instead of stranding them
  - What confirming the cascade does — the core module and every loaded dependent (including UI plugins) are torn down together
  - How the Package Manager view recovers after its plugin was cascade-unloaded — clicking the sidebar entry loads the plugin and its core modules back
  - How to drive per-row module actions headlessly with logos-qt-mcp (stable per-module objectNames + expect_property, not ambiguous text clicks)

prerequisites:
  - |
    **Nix** with flakes enabled. Install from [nixos.org](https://nixos.org/download.html), then enable flakes:

    ```bash
    mkdir -p ~/.config/nix
    echo 'experimental-features = nix-command flakes' >> ~/.config/nix/nix.conf
    ```

    Verify: `nix flake --help >/dev/null 2>&1 && echo "Flakes enabled"`
  - "**A Linux or macOS machine.** The app runs headless via `QT_QPA_PLATFORM=offscreen`, so no display is required. Network access is only needed to fetch the flakes and the Nix binary cache — the run itself is offline."

sections:
  - title: "Who depends on whom"
    text: |
      The dev app ships three core modules and two UI plugins, with one
      dependency edge that matters here:

      ```
      package_manager_ui  (UI plugin, "Package Manager")
          ├─► package_manager     (core, "Package Manager")
          └─► package_downloader  (core, "Package Downloader")
      capability_module           (core, "Capabilities" — no dependents)
      ```

      The three core modules auto-load at startup. `package_manager_ui` does
      **not** — it loads the first time the **Package Manager** sidebar entry
      is clicked. That gives us both unload flavors from one build:

      - While `package_manager_ui` is *not* loaded, every core module is
        effectively a leaf — unloading `package_downloader` needs no
        confirmation, because the only module that depends on it isn't
        running.
      - Once the Package Manager has been opened, `package_manager` has a
        *loaded* dependent — unloading it must go through the cascade dialog.

  - title: "Build the UI test driver"
    step: true
    text: |
      [`logos-qt-mcp`](https://github.com/logos-co/logos-qt-mcp) is the harness
      the doc-test uses to connect to the app's QML inspector and drive it.
    steps:
      - title: "Build logos-qt-mcp"
        run: 'nix build "${QT_MCP_FLAKE:-github:logos-co/logos-qt-mcp}" -o result-mcp'
        code_block: "nix build 'github:logos-co/logos-qt-mcp' -o result-mcp"
        check_file: "result-mcp"

  - title: "Build the basecamp dev app"
    step: true
    text: |
      Build **this** basecamp commit as the development app — the same thing a
      plain `nix build` gives you — and link it as `./result-app`.

      > The `{release}` in the URL pins the build to a specific commit: the
      > doc-test runner expands it to a concrete ref. Locally that is this
      > checkout's `HEAD` (see `run.sh`); in CI it is the commit being tested.
      > With no pin it falls back to the latest `master`.
    steps:
      - title: "Build the dev app"
        text: |
          This is the normal development build — `#app` is the default package,
          so from inside the clone it is simply `nix build`:
        run: "nix build \"${BASECAMP_FLAKE:-github:logos-co/logos-basecamp{release}}#app\" -o result-app"
        code_block: |
          # From inside the clone this is simply: nix build
          nix build 'github:logos-co/logos-basecamp{release}#app' -o result-app
        check_file: "result-app/bin/LogosBasecamp"

      - title: "Confirm the baked-in core modules"
        text: |
          The modules the Module Inspector will manage are installed under
          `modules/` next to the binary:
        run: "ls result-app/modules"
        expect_contains:
          - "package_manager"
          - "package_downloader"
          - "capability_module"

  - title: "Unload, cascade, and reload — one narrative"
    step: true
    text: |
      Launch the dev app headless and drive all three stories in one session.
      Per-row buttons are clicked by their stable `objectName`s
      (`coreModules.<name>.toggleButton`) rather than by visible text — every
      loaded row carries an identical "Unload" label, so text clicks would be
      ambiguous. Row state is asserted the same way, via each row's
      `coreModules.<name>.status` / `uiModules.<name>.status` status badge.

      The same rule governs the *assertions*, not just the clicks. Basecamp
      instantiates every Settings section and both content views up front, and
      keeps all five confirmation dialogs in the object tree while they are
      closed — so a text search finds headings, module rows and dialog titles
      regardless of what is actually on screen. Text polls here are therefore
      only ever a **settle** (wait for a model to populate); the load-bearing
      checks are `expect_property` against a property that genuinely tracks
      state: `checked` on the sidebar buttons, `highlighted` on the Settings
      rail, `visible` on the dialog, `text` on the per-row status badge.
    steps:
      - title: "Drive the unload flows"
        ui_test:
          launch: "./result-app/bin/LogosBasecamp"
          qt_mcp: "result-mcp"
          launch_timeout: 300
          tests:
            - name: "App window opens with the sidebar visible"
              action: wait_for
              texts: ["Applications", "Package Manager", "Settings"]
              timeout: 60000
              text: "The dev app launches headless onto the empty Workspace. The three core modules auto-loaded during startup; no UI plugin is open yet."
              screenshot: "unload-launch.png"

            # ── Story 1: leaf unload + reload ──────────────────────────────
            # Sidebar sections are clicked by objectName throughout: their
            # labels ("Package Manager", "Settings") also appear as module-row
            # texts once the Modules view is open, so by-text clicks would be
            # ambiguous.
            - name: "Open Settings"
              action: click_object
              find_by: "objectName"
              find_value: "sidebar.section.Settings"

            # ContentViews' StackLayout instantiates AppManagerView AND
            # SettingsView eagerly, so Settings' heading text is in the object
            # tree from launch — a text poll proves the app started, not that
            # we navigated. The sidebar button's `checked` (bound to
            # backend.currentActiveSectionIndex) is the actual witness; the
            # text wait stays as the settle in front of it because
            # expect_property is one-shot.
            - name: "Settings view loads"
              action: wait_for
              texts: ["Manage modules, apps and dashboards.", "Sections"]
              timeout: 30000

            - name: "…and Settings is the active section"
              action: expect_property
              find_by: "objectName"
              find_value: "sidebar.section.Settings"
              property: "checked"
              value: true

            # Settings sections are clicked by objectName as well: the rail
            # labels ("Apps Inspector", "Module Inspector") repeat as the
            # right-pane headings, so by-text clicks would be ambiguous.
            - name: "Open Settings → Module Inspector"
              action: click_object
              find_by: "objectName"
              find_value: "settings.section.moduleInspector"

            # Same caveat as the sidebar: every Settings section is
            # instantiated at once, so "Module Inspector" (rail label AND pane
            # heading) and the module rows are findable whichever section is
            # current. The rail delegate's `highlighted` (bound to
            # ListView.isCurrentItem) is what proves the switch happened; the
            # text wait settles on the core-module rows being populated.
            - name: "Core modules report as loaded"
              action: wait_for
              texts: ["Module Inspector", "Package Downloader", "Loaded"]
              timeout: 30000
              text: "The Module Inspector lists the three baked-in modules, all **Loaded** from startup."
              screenshot: "unload-core-modules.png"

            - name: "…and the Module Inspector is the selected section"
              action: expect_property
              find_by: "objectName"
              find_value: "settings.section.moduleInspector"
              property: "highlighted"
              value: true

            - name: "The Package Downloader row is loaded"
              action: expect_property
              find_by: "objectName"
              find_value: "coreModules.package_downloader.status"
              property: "text"
              value: "Loaded"

            # The Package Manager UI (the only module that depends on
            # package_downloader) has not been opened yet, so this is a leaf
            # unload: no dependents are running, no dialog is raised.
            - name: "Unload the Package Downloader"
              action: click_object
              find_by: "objectName"
              find_value: "coreModules.package_downloader.toggleButton"
              text: "Clicking **Unload** on the `package_downloader` row unloads it directly — Basecamp checks for *loaded* dependents, finds none (the Package Manager UI isn't running), and skips the confirmation."

            # Deliberately a sleep, not a `wait_for ["Not loaded"]`: that text
            # is no witness for this transition. Every Settings section is
            # instantiated from launch, so the hidden Apps Inspector has been
            # rendering a "Not loaded" badge for package_manager_ui the whole
            # time — the poll would return on its first tick and settle
            # nothing, leaving the one-shot expect_property below to race the
            # unload. The unload is doubly deferred (a QueuedConnection hop in
            # UIPluginManager::unloadCoreModule, then a nested event loop
            # inside logos_core_unload_module), so it gets the same explicit
            # settle as the reload and cascade steps.
            - name: "Give the unload a moment"
              action: sleep
              ms: 5000
              text: "The row flips to **Not loaded**, its stats columns blank out, and the button becomes **Load**."
              screenshot: "unload-leaf-unloaded.png"

            - name: "The Package Downloader row reports Not loaded"
              action: expect_property
              find_by: "objectName"
              find_value: "coreModules.package_downloader.status"
              property: "text"
              value: "Not loaded"

            - name: "Load it back"
              action: click_object
              find_by: "objectName"
              find_value: "coreModules.package_downloader.toggleButton"
              text: "The same button now reads **Load** — one click loads the module straight back into the runtime."

            - name: "Give the module load a moment"
              action: sleep
              ms: 5000

            - name: "The Package Downloader row is loaded again"
              action: expect_property
              find_by: "objectName"
              find_value: "coreModules.package_downloader.status"
              property: "text"
              value: "Loaded"
              screenshot: "unload-leaf-reloaded.png"

            # ── Story 2: cascade unload ────────────────────────────────────
            # Load package_manager_ui by opening the Package Manager view,
            # so package_manager now has a LOADED dependent.
            #
            # We deliberately do NOT assert on the package manager's own QML
            # text: PMUI runs in its own sandboxed QQmlEngine whose IPC-driven
            # catalog refresh can stall a deep inspector traversal. We click,
            # let it render, and capture a screenshot (framebuffer grab).
            - name: "Open the Package Manager"
              action: click_object
              find_by: "objectName"
              find_value: "sidebar.section.Package Manager"

            - name: "Let the Package Manager view render, then capture it"
              action: sleep
              ms: 10000
              text: "Clicking **Package Manager** loads the `package_manager_ui` plugin into the main content area. From here on, `package_manager` has a running dependent."
              screenshot: "unload-pm-open.png"

            - name: "The Package Manager is the active section"
              action: expect_property
              find_by: "objectName"
              find_value: "sidebar.section.Package Manager"
              property: "checked"
              value: true

            - name: "Back to Settings"
              action: click_object
              find_by: "objectName"
              find_value: "sidebar.section.Settings"

            - name: "Settings view loads again"
              action: wait_for
              texts: ["Manage modules, apps and dashboards.", "Sections"]
              timeout: 30000

            - name: "…and Settings is active again"
              action: expect_property
              find_by: "objectName"
              find_value: "sidebar.section.Settings"
              property: "checked"
              value: true

            - name: "Open Settings → Apps Inspector"
              action: click_object
              find_by: "objectName"
              find_value: "settings.section.appsInspector"

            - name: "Apps Inspector shows the installed UI plugins"
              action: wait_for
              texts: ["Apps Inspector", "UI plugins available in this installation."]
              timeout: 30000

            - name: "…and the Apps Inspector is the selected section"
              action: expect_property
              find_by: "objectName"
              find_value: "settings.section.appsInspector"
              property: "highlighted"
              value: true

            - name: "The package_manager_ui row is loaded"
              action: expect_property
              find_by: "objectName"
              find_value: "uiModules.package_manager_ui.status"
              property: "text"
              value: "Loaded"
              text: "The **Apps Inspector** confirms it: `package_manager_ui` is now **Loaded**."
              screenshot: "unload-pmui-loaded.png"

            - name: "Switch to the Module Inspector"
              action: click_object
              find_by: "objectName"
              find_value: "settings.section.moduleInspector"

            - name: "Module Inspector is up"
              action: wait_for
              texts: ["Module Inspector", "Core modules known to the runtime, with live resource usage."]
              timeout: 30000

            - name: "…and the Module Inspector is selected"
              action: expect_property
              find_by: "objectName"
              find_value: "settings.section.moduleInspector"
              property: "highlighted"
              value: true

            # The unload-cascade dialog must be CLOSED going in — otherwise the
            # `visible: true` assertion after the click below would pass on a
            # dialog that was already up, and the confirm click would be
            # dismissing something we never raised.
            - name: "No cascade dialog is open yet"
              action: expect_property
              find_by: "objectName"
              find_value: "confirmationDialog.unloadCascade"
              property: "visible"
              value: false

            - name: "Try to unload the Package Manager module"
              action: click_object
              find_by: "objectName"
              find_value: "coreModules.package_manager.toggleButton"
              text: "Same button, different outcome: `package_manager_ui` is running on top of `package_manager`, so instead of unloading, Basecamp raises the cascade confirmation."

            # The dialog body names the target; the list renders each loaded
            # dependent as "• <display name>" — package_manager_ui's display
            # name is "Package Manager".
            #
            # Text alone can't prove WHICH dialog is up: OverlayDialogs holds
            # five ConfirmationDialog instances that stay in the object tree
            # while closed, keeping their constant titles and whatever body
            # they last rendered. So the text poll is the settle, and the
            # `visible` assertion below — against the per-mode objectName
            # OverlayDialogs carries for exactly this purpose — is the proof.
            - name: "The cascade dialog lists the loaded dependent"
              action: wait_for
              texts:
                - "Unload Dependent Modules?"
                - "The following modules are currently loaded and depend on 'Package Manager'. Unloading will terminate them:"
                - "• Package Manager"
              timeout: 30000
              text: "The **Unload Dependent Modules?** dialog spells out the blast radius before anything happens: the Package Manager UI is currently loaded, depends on this module, and will be terminated by the unload."
              screenshot: "unload-cascade-dialog.png"

            - name: "…and it is the unload-cascade dialog that is open"
              action: expect_property
              find_by: "objectName"
              find_value: "confirmationDialog.unloadCascade"
              property: "visible"
              value: true

            - name: "Confirm — Unload All"
              action: click_object
              find_by: "objectName"
              find_value: "confirmationDialog.unloadCascade.confirm"
              text: "**Unload All** runs the cascade: the runtime unloads `package_manager` together with its dependents, and Basecamp tears down the `package_manager_ui` widget it was hosting."

            - name: "Give the cascade a moment to complete"
              action: sleep
              ms: 5000

            # Confirming must dismiss it. Without this the confirm click could
            # have missed (or hit a still-closed dialog) and the status checks
            # below would still pass on their own.
            - name: "The cascade dialog closed"
              action: expect_property
              find_by: "objectName"
              find_value: "confirmationDialog.unloadCascade"
              property: "visible"
              value: false

            - name: "The Package Manager core module is unloaded"
              action: expect_property
              find_by: "objectName"
              find_value: "coreModules.package_manager.status"
              property: "text"
              value: "Not loaded"

            - name: "…and the Package Manager UI plugin is gone too"
              action: expect_property
              find_by: "objectName"
              find_value: "uiModules.package_manager_ui.status"
              property: "text"
              value: "Not loaded"
              text: "Both sides of the cascade landed: the core module reports **Not loaded** in the Module Inspector, and the UI plugin that depended on it reports **Not loaded** in the Apps Inspector."
              screenshot: "unload-cascade-done.png"

            # ── Story 3: reload after the cascade ──────────────────────────
            # Clicking the Package Manager sidebar entry must load the plugin
            # (and the core modules under it) back. This is the regression
            # guard for the dangling-widget bug where a stale m_pmuiWidget
            # pointer made this click a silent no-op and left the view
            # permanently blank.
            - name: "Open the Package Manager again"
              action: click_object
              find_by: "objectName"
              find_value: "sidebar.section.Package Manager"

            - name: "Let the view load back, then capture it"
              action: sleep
              ms: 10000
              text: "The sidebar entry works again immediately: Basecamp notices the plugin is gone, shows the loading placeholder, and loads `package_manager_ui` — pulling `package_manager` back into the runtime as its dependency."
              screenshot: "unload-pm-reloaded.png"

            - name: "The Package Manager is the active section again"
              action: expect_property
              find_by: "objectName"
              find_value: "sidebar.section.Package Manager"
              property: "checked"
              value: true

            - name: "Back to Settings one last time"
              action: click_object
              find_by: "objectName"
              find_value: "sidebar.section.Settings"

            - name: "Settings view loads once more"
              action: wait_for
              texts: ["Manage modules, apps and dashboards.", "Sections"]
              timeout: 30000

            - name: "…and Settings is active once more"
              action: expect_property
              find_by: "objectName"
              find_value: "sidebar.section.Settings"
              property: "checked"
              value: true

            # Returning to Settings triggers a visibility refresh, and the
            # post-reload re-wire runs its own refresh — each reply rebuilds
            # the apps list model, so a one-shot assertion (or a fixed sleep)
            # races the delegate re-creation. "Main UI" only renders once the
            # list has rows (the empty list shows "No UI plugins found…"), so
            # retry on it. The Apps Inspector need not be the visible section
            # for this: the Settings StackLayout keeps every section
            # instantiated.
            - name: "The Apps Inspector list has repopulated"
              action: wait_for
              texts: ["Main UI"]
              timeout: 60000

            # The Settings rail remembers its last section (Module Inspector,
            # from the cascade story), so switch back to Apps Inspector
            # explicitly — the status assertion below would pass either way,
            # but the screenshot should show the section the narrative talks
            # about. Clicked by objectName (a by-text click on "Apps
            # Inspector" is ambiguous with the pane's own heading), and only
            # AFTER the list settled — a click synthesized while the refresh
            # storm is still rebuilding delegates can be dropped.
            - name: "Switch back to the Apps Inspector"
              action: click_object
              find_by: "objectName"
              find_value: "settings.section.appsInspector"

            - name: "Let the section switch land"
              action: sleep
              ms: 1000

            - name: "The Apps Inspector is the selected section again"
              action: expect_property
              find_by: "objectName"
              find_value: "settings.section.appsInspector"
              property: "highlighted"
              value: true

            # The Apps Inspector row is fed by an IPC refresh against the
            # RESTARTED package_manager module — this assertion is the
            # regression guard for the IPC re-wire fix: without it, the
            # refresh replies after a module reload were lost on a stale
            # replica and this list rendered empty until app restart.
            - name: "The package_manager_ui row is loaded again"
              action: expect_property
              find_by: "objectName"
              find_value: "uiModules.package_manager_ui.status"
              property: "text"
              value: "Loaded"
              text: "The **Apps Inspector** recovered too: its list is fed by an IPC refresh against the *restarted* `package_manager` module, and `package_manager_ui` reports **Loaded** — Basecamp re-wired its module IPC after the reload."
              screenshot: "unload-pmui-reloaded.png"

            # The core-module status comes straight from the runtime's C API
            # — it only flips back to Loaded if the sidebar click really
            # re-ran the plugin load, which is what this closing story guards.
            - name: "Switch to the Module Inspector for the closing check"
              action: click_object
              find_by: "objectName"
              find_value: "settings.section.moduleInspector"

            - name: "Module Inspector is up for the closing check"
              action: wait_for
              texts: ["Module Inspector", "Core modules known to the runtime, with live resource usage."]
              timeout: 30000

            - name: "…and the Module Inspector is selected for the closing check"
              action: expect_property
              find_by: "objectName"
              find_value: "settings.section.moduleInspector"
              property: "highlighted"
              value: true

            - name: "The Package Manager core module is loaded again"
              action: expect_property
              find_by: "objectName"
              find_value: "coreModules.package_manager.status"
              property: "text"
              value: "Loaded"
              text: "The closing proof: `package_manager` is **Loaded** again — pulled back into the runtime as a dependency of the reloaded `package_manager_ui`. The Package Manager view survives a full cascade-unload/reload cycle."
              screenshot: "unload-final-state.png"
        post_text: |
          One green run covered the full unload story: a **leaf module**
          unloaded and reloaded from the Module Inspector with no ceremony; a
          module with a running dependent raised the **Unload Dependent
          Modules?** cascade dialog naming exactly what would be terminated,
          and confirming it tore down both the core module and the
          `package_manager_ui` plugin riding on it; and the **Package Manager**
          sidebar entry loaded everything back afterwards — the view renders
          and both modules report **Loaded** again.