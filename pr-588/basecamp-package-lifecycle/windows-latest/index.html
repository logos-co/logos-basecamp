<script id="report-data" type="application/json">{"generated_platform": "windows-latest", "summary": {"failed": 0, "passed": 7, "skipped": 0}, "tutorials": [{"meta": {"name": "The package lifecycle in Basecamp: install, upgrade, uninstall", "output": "basecamp-package-lifecycle.md"}, "rows": [{"execs": [], "md": "# The package lifecycle in Basecamp: install, upgrade, uninstall\n\nEvery app in [`logos-basecamp`](https://github.com/logos-co/logos-basecamp)\narrives as an **`.lgx` package**. This doc-test drives one package through its\n**entire lifecycle** inside the real, shippable Basecamp bundle:\n\n1. **Install** a local `.lgx` (v0.1.1) \u2014 the Package Manager app inspects the\n   file and raises `basecamp.packages.confirm_install`; Basecamp services it\n   and shows the **install gate**\n   dialog (name, version, dependency changes). Confirming lets the Package\n   Manager install the file, and after a reload the app appears in the\n   sidebar. (The reload is a workaround for a current stack bug: the\n   module's `uiPluginFileInstalled` event isn't emitted for QML-only\n   packages, so nothing auto-refreshes after a fresh local install \u2014 the\n   spec marks the affected steps inline.)\n2. **Upgrade** it with a second `.lgx` (v0.2.1) \u2014 the same entry point detects\n   the package is already installed and routes through the **upgrade gate**\n   (`confirm_upgrade`) instead: the dialog leads with \"Upgrade \u2026 to v0.2.1\".\n   Confirming removes the old version, installs the new one, and opening the\n   app renders the **new** version's view.\n3. **Uninstall** it through the Package Manager \u2014 the confirmation appears\n   (Basecamp services PMU's `confirm_uninstall` intent and asks the user),\n   and confirming removes the package: the package manager no longer knows it.\n\nBasecamp initiates no installs of its own \u2014 the `package_manager_ui` plugin\ndoes, for both catalog downloads and local `.lgx` picks. The exercised\nmachinery is the app-to-app confirmation between the two: PMU's\n`installLocalPackage` \u2192 `inspectPackage` \u2192 one of the three\n`basecamp.packages.confirm_*` intents, `PackageCoordinator` raising the\nmatching dialog (`installGate`, `upgradeCascade`, `uninstallCascade`), and\nthe confirm/cancel decision returned as the intent's answer so PMU performs\n(or aborts) the actual file operation. For a removal that answer is also the\npermission: Basecamp unloads whatever depends on the package first, and PMU\ndeletes nothing until it arrives.\n\nThe **lifecycle itself is hermetic**: the two fixture packages are\nhand-crafted in the spec itself (an `.lgx` is just a gzipped tar with a\n`manifest.json` and a `variants/<platform>/` payload \u2014 for a QML-only app the\npayload is three tiny text files), the run installs into a throwaway\n`--user-dir`, and a gate-approved local install is satisfied straight from\nthe file already on disk. The bundle does fetch its default repository's\ncatalog in the background, but nothing from it is downloaded or installed\nhere.\n\n**What you'll build:** The inspector-enabled Basecamp bundle and the logos-qt-mcp UI driver, two\nhand-crafted `.lgx` packages of the same QML-only app at v0.1.1 and v0.2.1,\nand a headless UI run that installs, upgrades, opens, and uninstalls the app\nthrough Basecamp's real gate-confirmation dialogs.\n\n\n**What you'll learn:**\n\n- What an `.lgx` package for a QML-only (`ui_qml`) app contains, and how to build one by hand\n- Why every install is routed through the `package_manager_ui` plugin, and how Basecamp's install gate confirms it (`confirm_install` intent \u2192 dialog \u2192 `confirmInstallGate`)\n- How the same local-file entry point becomes an upgrade gate when the package is already installed, and how the dialog leads with the target version\n- How an installed app appears in the sidebar and as a \"local\" row in the Package Manager\n- How the confirmed uninstall works \u2014 PMU raises `confirm_uninstall`, Basecamp shows the confirmation and unloads dependents before answering, and only a user confirm destroys files\n- How to drive install/upgrade/uninstall headlessly with logos-qt-mcp (stable objectNames + `call_method`, not text clicks)\n\n## Prerequisites\n\n- **Nix** with flakes enabled. Install from [nixos.org](https://nixos.org/download.html), then enable flakes:\n\n```bash\nmkdir -p ~/.config/nix\necho 'experimental-features = nix-command flakes' >> ~/.config/nix/nix.conf\n```\n\nVerify: `nix flake --help >/dev/null 2>&1 && echo \"Flakes enabled\"`\n\n- **Windows:** the outputs the build steps below link, staged as `bin-bundle-dir-inspector/`, `logos-qt-mcp/` and `lgx/`, plus Git Bash, Python 3 and Node.js.\n- **Linux, macOS or Windows.** The app runs headless via `QT_QPA_PLATFORM=offscreen`, so no display is required. Network access is needed to fetch the flakes and the Nix binary cache; during the run Basecamp may refresh its default catalog in the background, but no catalog packages are downloaded or installed here.\n- **If upgrading from Basecamp 0.1.1 or lower:**\n\n> \u26a0\ufe0f **Please clear your user dir before running** \u26a0\ufe0f\n>\n> - macOS: `~/Library/Application Support/Logos/LogosBasecamp`\n> - Linux: `~/.config/Logos/LogosBasecamp` or `~/.local/share/Logos/LogosBasecamp`\n\nPackage state written by Basecamp 0.1.1 or older is not compatible with the\nlifecycle flows driven here. This doc-test itself is unaffected \u2014 it isolates\neverything under a throwaway `--user-dir` \u2014 but if you follow along against\nyour real Basecamp install (i.e. run the bundle *without* `--user-dir`), a\nstale user dir from an old version can make installs and uninstalls\nmisbehave."}, {"execs": [], "md": "## What an .lgx package is\n\nAn `.lgx` file is a **gzipped tar archive**: a `manifest.json` at the root\n(name, version, type, dependencies, display name) and the payload under\n`variants/<platform>/` \u2014 one directory per platform the package ships for.\nThe package manager reads the manifest to decide what the package is and\npicks the variant matching the host.\n\nFor a **QML-only app** (`type: ui_qml`) the variant payload is just three\ntext files \u2014 no compiled code at all:\n\n```\nmanifest.json                      package identity + version + content hashes\nvariants/<platform>/metadata.json  module metadata (view entry point)\nvariants/<platform>/Main.qml       the app's QML view\nvariants/<platform>/qmldir         QML module declaration\n```\n\nThat makes it the perfect lifecycle fixture: we can hand-craft two complete,\ninstallable versions of the same app right here in the spec, with no\ncompile step and no network. The app's view prints its own version, so\nafter the upgrade the UI itself proves which payload is running.\n\nTwo details keep a hand-built package valid:\n\n- The manifest must carry **content hashes** (a Merkle root over the\n  payload) \u2014 packages without them fail validation. The\n  [`lgx`](https://github.com/logos-co/logos-package) CLI computes them\n  whenever it modifies a package, so we hand-write the *manifest* and let\n  `lgx add` inject the payload and stamp the hashes.\n- The tar layer must be plain **ustar** \u2014 the LGX reader doesn't speak the\n  pax extended headers that macOS's `tar` emits by default (`--format\n  ustar` fixes that; `lgx` itself always writes canonical ustar)."}, {"execs": [], "md": "## Step 1: Build the UI test driver\n\n[`logos-qt-mcp`](https://github.com/logos-co/logos-qt-mcp) is the harness\nthe doc-test uses to connect to the app's QML inspector and drive it."}, {"execs": [], "md": "### 1.1 Build logos-qt-mcp\n\n```bash\nnix build 'github:logos-co/logos-basecamp#logos-qt-mcp' -o logos-qt-mcp\n```"}, {"execs": [], "md": "### 1.2 Build the lgx packaging CLI\n\n[`lgx`](https://github.com/logos-co/logos-package) is the packaging\ntool \u2014 used below to add the payload to each fixture package and stamp\nits content hashes.\n\n```bash\nnix build 'github:logos-co/logos-package#lgx' -o lgx\n```"}, {"execs": [], "md": "## Step 2: Build the Basecamp bundle\n\nBuild **this** basecamp commit as the portable bundle \u2014 the same\nself-contained directory you ship, with the QML inspector compiled in so\nthe driver can attach (`#bin-bundle-dir-inspector`, the inspector-enabled\ntwin of `#bin-bundle-dir`). The bundle carries the `package_manager`\nmodule that performs the actual installs, so this spec exercises the real\nshipping path."}, {"execs": [], "md": "### 2.1 Build the bundle\n\n```bash\n# From inside the clone this is simply: nix build '.#bin-bundle-dir-inspector'\nnix build 'github:logos-co/logos-basecamp#bin-bundle-dir-inspector' -o bin-bundle-dir-inspector\n```"}, {"execs": [], "md": "## Step 3: Craft the two LGX fixture packages\n\nWrite the package files once as templates, then stamp each of the two\nversions (**0.1.1** and **0.2.1**) into a manifest, a metadata file, and\nthe QML view, and tar each version up as an `.lgx`.\n\nThe manifest's `display_name` (\"Lifecycle Demo\") is what Basecamp shows in\nthe sidebar and dialogs; its `name` (`test_qml_only`) must match the QML\nmodule URI declared in `qmldir`. The packages are unsigned \u2014 the install\ndialog will flag that, which is itself worth seeing."}, {"execs": [{"cmd": "write build/pkglife/manifest.json.in", "exit_code": 0, "kind": "file", "output": "wrote build/pkglife/manifest.json.in\n", "status": "pass"}], "md": "### 3.1 Write the manifest template\n\nThe root `manifest.json`, with the version left as a placeholder. A\n`ui_qml` package has no binary entry points, so `main` stays empty and\n`view` names the QML file to load:\n\n```json\n{\n  \"author\": \"\",\n  \"category\": \"testing\",\n  \"dependencies\": [],\n  \"description\": \"Package-lifecycle doc-test fixture (QML-only app)\",\n  \"display_name\": \"Lifecycle Demo\",\n  \"icon\": \"\",\n  \"main\": {},\n  \"manifestVersion\": \"0.3.0\",\n  \"name\": \"test_qml_only\",\n  \"type\": \"ui_qml\",\n  \"version\": \"PLACEHOLDER_VERSION\",\n  \"view\": \"Main.qml\"\n}\n```"}, {"execs": [{"cmd": "write build/pkglife/metadata.json.in", "exit_code": 0, "kind": "file", "output": "wrote build/pkglife/metadata.json.in\n", "status": "pass"}], "md": "### 3.2 Write the module metadata template\n\nThe variant payload carries the module's own `metadata.json` \u2014 the\nsame identity the runtime reads when loading the plugin:\n\n```json\n{\n  \"name\": \"test_qml_only\",\n  \"display_name\": \"Lifecycle Demo\",\n  \"version\": \"PLACEHOLDER_VERSION\",\n  \"type\": \"ui_qml\",\n  \"category\": \"testing\",\n  \"description\": \"Package-lifecycle doc-test fixture (QML-only app)\",\n  \"view\": \"Main.qml\",\n  \"dependencies\": []\n}\n```"}, {"execs": [{"cmd": "write build/pkglife/Main.qml.in", "exit_code": 0, "kind": "file", "output": "wrote build/pkglife/Main.qml.in\n", "status": "pass"}], "md": "### 3.3 Write the QML view template\n\nThe app's whole UI. It renders its own version, so after the upgrade\nthe running view itself is the proof of which payload is installed.\n(The view brings its own background \u2014 plugin views render on whatever\nthe host workspace provides.)\n\n```qml\nimport QtQuick\n\nRectangle {\n    id: root\n    color: \"#1e1e1e\"\n    Text {\n        anchors.centerIn: parent\n        text: \"Lifecycle demo view vPLACEHOLDER_VERSION\"\n        color: \"#ffffff\"\n        font.pixelSize: 24\n    }\n}\n```"}, {"execs": [{"cmd": "write build/pkglife/qmldir", "exit_code": 0, "kind": "file", "output": "wrote build/pkglife/qmldir\n", "status": "pass"}], "md": "### 3.4 Write the qmldir\n\nThe QML module declaration \u2014 its URI is derived from the package name:\n\n```text\nmodule com.logos.module.test_qml_only\n```"}, {"execs": [], "md": "### 3.5 Pick the platform variant and where the packages go\n\nThe portable bundle installs plain variant names \u2014 no `-dev` suffix.\nThe archives land at a **fixed absolute path**\n(`/tmp/basecamp-pkglife/`) because the UI run later passes that path\ninto the app over the inspector, where a relative path would be\nambiguous.\n\n```bash\ncase \"$(uname -s) $(uname -m)\" in\n  \"Linux x86_64\")   VARIANT=linux-x86_64 ;;\n  \"Linux aarch64\")  VARIANT=linux-arm64 ;;\n  \"Darwin arm64\")   VARIANT=darwin-arm64 ;;\n  \"Darwin x86_64\")  VARIANT=darwin-x86_64 ;;\n  *) echo \"unsupported platform: $(uname -sm)\" >&2; exit 1 ;;\nesac\necho \"$VARIANT\" > build/pkglife/variant\necho /tmp/basecamp-pkglife > build/pkglife/dir\ncat build/pkglife/variant build/pkglife/dir\n\n```"}, {"execs": [{"cmd": "echo windows-x86_64 > build/pkglife/variant\ncygpath -u \"$(pwd -W | cut -c1-2)/tmp/basecamp-pkglife\" > build/pkglife/dir\ncat build/pkglife/variant build/pkglife/dir\n", "exit_code": 0, "kind": "run", "output": "windows-x86_64\n/d/tmp/basecamp-pkglife\n", "status": "pass"}], "md": "### 3.6 On Windows: the platform variant and where the packages go\n\nThe app turns `file:///tmp/basecamp-pkglife/\u2026` into `\\tmp\\basecamp-pkglife\\\u2026`\non the drive it runs from, while Git Bash's `/tmp` is the user's temp\ndirectory. So the packages go to that drive's `\\tmp`.\n\n```bash\necho windows-x86_64 > build/pkglife/variant\ncygpath -u \"$(pwd -W | cut -c1-2)/tmp/basecamp-pkglife\" > build/pkglife/dir\ncat build/pkglife/variant build/pkglife/dir\n\n```"}, {"execs": [{"cmd": "VARIANT=$(cat build/pkglife/variant)\nDIR=$(cat build/pkglife/dir)\nrm -rf \"$DIR\"\nmkdir -p \"$DIR\"\nfor v in 0.1.1 0.2.1; do\n  seed=\"build/pkglife/seed-$v\"\n  payload=\"build/pkglife/payload-$v\"\n  rm -rf \"$seed\" \"$payload\"\n  mkdir -p \"$seed/variants\" \"$payload\"\n  sed \"s/PLACEHOLDER_VERSION/$v/g\" build/pkglife/manifest.json.in > \"$seed/manifest.json\"\n  sed \"s/PLACEHOLDER_VERSION/$v/g\" build/pkglife/metadata.json.in > \"$payload/metadata.json\"\n  sed \"s/PLACEHOLDER_VERSION/$v/g\" build/pkglife/Main.qml.in      > \"$payload/Main.qml\"\n  cp build/pkglife/qmldir \"$payload/qmldir\"\n  tar --format ustar -C \"$seed\" -czf \"$DIR/test_qml_only-$v.lgx\" manifest.json variants\n  ./lgx/bin/lgx.exe add \"$DIR/test_qml_only-$v.lgx\" \\\n    --variant \"$VARIANT\" --files \"$payload\" -y\n  ./lgx/bin/lgx.exe verify \"$DIR/test_qml_only-$v.lgx\"\ndone\nchmod -R u+w testdata/pkglife-user 2>/dev/null || true\nrm -rf testdata/pkglife-user\nmkdir -p testdata/pkglife-user/modules testdata/pkglife-user/plugins\nls \"$DIR\"\n", "exit_code": 0, "kind": "run", "output": "Added variant 'windows-x86_64' to D:/tmp/basecamp-pkglife/test_qml_only-0.1.1.lgx\nPackage structure is valid: D:/tmp/basecamp-pkglife/test_qml_only-0.1.1.lgx\nPackage is unsigned\nAdded variant 'windows-x86_64' to D:/tmp/basecamp-pkglife/test_qml_only-0.2.1.lgx\nPackage structure is valid: D:/tmp/basecamp-pkglife/test_qml_only-0.2.1.lgx\nPackage is unsigned\ntest_qml_only-0.1.1.lgx\ntest_qml_only-0.2.1.lgx\n", "status": "pass"}], "md": "### 3.7 Stamp both versions and pack the .lgx files\n\nBuild each version in two\nmoves: seed a package that contains only the stamped manifest (a plain\n**ustar** tar \u2014 see above), then `lgx add` the payload directory into\nthe platform variant, which also computes and stamps the manifest's\ncontent hashes. `lgx verify` confirms each result is a valid (unsigned)\npackage. A fresh, empty `--user-dir` for the run is created\nalongside.\n\n```bash\nVARIANT=$(cat build/pkglife/variant)\nDIR=$(cat build/pkglife/dir)\nrm -rf \"$DIR\"\nmkdir -p \"$DIR\"\nfor v in 0.1.1 0.2.1; do\n  seed=\"build/pkglife/seed-$v\"\n  payload=\"build/pkglife/payload-$v\"\n  rm -rf \"$seed\" \"$payload\"\n  mkdir -p \"$seed/variants\" \"$payload\"\n  sed \"s/PLACEHOLDER_VERSION/$v/g\" build/pkglife/manifest.json.in > \"$seed/manifest.json\"\n  sed \"s/PLACEHOLDER_VERSION/$v/g\" build/pkglife/metadata.json.in > \"$payload/metadata.json\"\n  sed \"s/PLACEHOLDER_VERSION/$v/g\" build/pkglife/Main.qml.in      > \"$payload/Main.qml\"\n  cp build/pkglife/qmldir \"$payload/qmldir\"\n  tar --format ustar -C \"$seed\" -czf \"$DIR/test_qml_only-$v.lgx\" manifest.json variants\n  ./lgx/bin/lgx add \"$DIR/test_qml_only-$v.lgx\" \\\n    --variant \"$VARIANT\" --files \"$payload\" -y\n  ./lgx/bin/lgx verify \"$DIR/test_qml_only-$v.lgx\"\ndone\nchmod -R u+w testdata/pkglife-user 2>/dev/null || true\nrm -rf testdata/pkglife-user\nmkdir -p testdata/pkglife-user/modules testdata/pkglife-user/plugins\nls \"$DIR\"\n\n```"}, {"execs": [], "md": "## Step 4: Install, upgrade, and uninstall \u2014 one narrative\n\nLaunch the bundle headless against the empty user-dir and drive the whole\nlifecycle. Installs are initiated by the bundled **Package Manager** app\n(`package_manager_ui`) \u2014 Basecamp only confirms them. The local-file\ninstall is triggered through PMU's own code path (`installLocalPackage` \u2014\nthe same slot its \"Select LGX Package\" file picker reaches, which a\nheadless driver can't operate), invoked via the inspector on PMU's\n`pmui.BackendStore` hook with an explicit `file://` URL. The uninstall\ngoes through the same store (`uninstallPackage` \u2014 the slot behind the\nrow's Uninstall action). Dialog buttons are clicked by their stable\n`objectName`s rather than by visible text \u2014 labels like \"Uninstall\" also\nappear elsewhere, so text clicks would be ambiguous."}, {"execs": [{"actions": [{"description": "First-run onboarding shows: expect objectName='onboardingQuickSetupButton' .visible == True", "duration_ms": 13, "index": 1, "status": "pass"}, {"description": "Let's go: click objectName='onboardingQuickSetupButton'", "duration_ms": 13, "index": 2, "status": "pass"}, {"description": "App window opens with the sidebar visible: wait for ['Applications', 'Settings']", "duration_ms": 73, "index": 3, "status": "pass"}, {"description": "Open the Package Manager: click 'Package Manager'", "duration_ms": 2, "index": 4, "status": "pass"}, {"description": "The Package Manager view loads: wait for ['Manage your plugins and packages.']", "duration_ms": 515 all, upgrade, uninstall: Drive the package lifecycle\n\n1 passed, 0 failed\n\n", "runner_cmd": "node \"ui-test.mjs\" --verbose", "status": "pass"}], "md": "### 4.1 Drive the package lifecycle\n\n```bash\nenv HOME=\"$PWD/testdata/pkglife-home\" USERPROFILE=\"$PWD/testdata/pkglife-home\" LOGOS_NO_SCHEME_REGISTER=1 ./bin-bundle-dir-inspector/bin/LogosBasecamp --user-dir \"$PWD/testdata/pkglife-user\"\n```\n\nA new user dir opens on Basecamp's first-run onboarding.\n\n**Let's go** downloads from GitHub and Logos Storage and opens Basecamp.\n\nThe bundle launches headless against the empty user-dir. Only the baked-in apps are present \u2014 the sidebar has no Lifecycle Demo yet.\n\n![App window opens with the sidebar visible](data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABkAAAAOECAIAAAB2L2r1AAAACXBIWXMAAA7EAAAOxAGVKw4bAAAgAElEQVR4nOzdaXgU153v8VNVvXdrRxKLxCaB2BeDjTGrwcZ7bHNtj8niJZlnPHOfiZ34eTJOfOfeTHKTPNc3TjLOjeOMlyy2g5fE63i8Y8A2YLMaDAghQIBACLRLrd6r6r4oUm5raTV0q7uQvp8XPKXu6tOnTheF+sc5/5JKS0sFAAAAAAAAYFVytjsAAAAAAAAAJEKABQAAAAAAAEsjwAIAAAAAAIClEWABAAAAAADA0giwAAAAAAAAYGkEWAAAAAAAALA0AiwAAAAAAABYmu28X2m32202myzLkiQZf6axW6nTdV3TNOPPWCwWjUaz3SMAAAAAAACcj3MOsGRZdjqddrvdaolVD5IkKYpibDscDl3Xo9FoOBzWNC2LvbLb7Xa7XZbl3pGfkbVpmhaNRonbAAAAAAAATFJpaWnye7tcLqfTOXi9yYBwOBwKhTL/vna73eVyyXJSazY1TQuFQsRYAAAAAAAAQgjF5/Mls58sy16v1263D3aHBpvNZrPb7bFYTNf1jL2py+Vyu93Jz1mTJMmY4xaLxQa1YwAAAAAAANaX1IQgRVG8Xq+5Iu9Cl+HDOe9pa06n0+Vypb0/AAAAAAAAF5aBAyxZlj0eT5Jr3y4UGTsou90+YHo1v1D6u+K+p4MZ5cYGoV8AAAAAAAAXjIGLuA+99MpgZFh+v39Q3yXBFKrpBY6VZd4rRtsrHf692/1/EVKf5eVdLhfFsAAAAAAAwHA2QIDlcrmGzMrB3hRFcblcg1fT3bjhYJ9PeWzy76+qzHc7RKij7ai/UNKnOPT9kT6KZMmybLfbybAAAAAAAMCwlWhqlSzLF/o9BwfkdDoHb35ZgtV/t0zIzXc6hWzXHb6O0+Gooi929TkBa4B2AAAAAAAAhrxE2c2QT68Mg3eY/UVjNkncOcEjolGhaf7mYCxXOjKxcKlLPdd2AAAAAAAAhoNEycgwmfgzeIfZX/C0erSzzKaJUEAPR1qrD0urqk5o2phSzxR735OwCLAAAAAAAMBw1m8yYrfbJamPkkxDjyRJg5Rh9TmA+TbpvvEuEY2JcLCr/pR95ohDrcHWxg7b0spr3LHk2wEAAAAAABgm+g2wbLaBb1A4ZGTsYGUh/neFq0jSdVXVYnrrqdP5t8zbt7mu9VSXMn/0ygIpV9Iz0xMAAAAAAIA 14 the\nPackage Manager plugin gated by Basecamp's confirmations: **inspect \u2192\n`confirm_install` \u2192 install gate \u2192 install from disk \u2192 sidebar**,\n**inspect \u2192 `confirm_upgrade` \u2192 upgrade gate \u2192 payload swap \u2192 the\nrunning view prints the new version**, and **request \u2192\n`confirm_uninstall` \u2192 confirm \u2192 files gone \u2192 the package\nmanager gates the same LGX as a fresh install again**. Every\nconfirmation dialog on that path (`installGate` in fresh and\npost-uninstall runs, `upgradeCascade`, and the gated\n`uninstallCascade`) rendered and was driven exactly as a user would."}]}], "version": 1}</script>
<script>
  const DATA = JSON.parse(document.getElementById("report-data").textContent);
  if (window.marked) { marked.setOptions({ gfm: true, breaks: false }); }
  const mdToHtml = (s) => window.marked ? marked.parse(s || "") : ("<pre>" + (s || "") + "</pre>");

  const sum = DATA.summary;
  document.getElementById("summary").innerHTML =
    `<span class="pill pass">${sum.passed} passed</span> ` +
    (sum.failed ? `<span class="pill fail">${sum.failed} failed</span> ` : "") +
    (sum.skipped ? `<span class="pill skip">${sum.skipped} skipped</span>` : "");

  const picker = document.getElementById("picker");
  DATA.tutorials.forEach((t, i) => {
    const o = document.createElement("option");
    o.value = i; o.textContent = t.meta.name; picker.appendChild(o);
  });

  function execHtml(e) {
    const badge = `<span class="badge ${e.status}">${e.status.toUpperCase()}</span>`;
    const kind = `<span class="kind">${e.kind}${e.platform ? " · " + e.platform : ""}${e.exit_code !== undefined ? " · exit " + e.exit_code : ""}</span>`;
    let h = `<div class="exec"><div class="exec-head">${badge}${kind}</div>`;
    if (e.note) h += `<div class="note">${escapeHtml(e.note)}</div>`;
    if (e.cmd) h += `<pre class="cmd">${escapeHtml(e.cmd)}</pre>`;
    if (e.runner_cmd) h += `<pre class="cmd">${escapeHtml(e.runner_cmd)}</pre>`;
    if (e.actions) {
      const passed = e.actions.filter(a => a.status === "pass").length;
      h += `<div class="kind">UI actions: ${passed}/${e.actions.length} passed</div>`;
      h += `<table class="ui-actions"><tbody>`;
      for (const a of e.actions) {
        const label = a.status === "not_run" ? "NOT RUN" :
          a.status === "running" ? "INTERRUPTED" : a.status.toUpperCase();
        h += `<tr><td>${a.index}</td><td><span class="badge ${a.status}">${label}</span></td>`;
        h += `<td>${escapeHtml(a.description)}`;
        if (a.error) h += `<div class="note">${escapeHtml(a.error)}</div>`;
        h += `</td><td>${a.duration_ms !== undefined ? a.duration_ms + " ms" : ""}</td></tr>`;
      }
      h += `</tbody></table>`;
    }
    const out = (e.output || "").trim();
    if (out) {
      const long = out.split("\n").length > 12;
      if (long) {
        h += `<details><summary>output (${out.split("\n").length} lines)</summary><pre class="output">${escapeHtml(out)}</pre></details>`;
      } else {
        h += `<pre class="output">${escapeHtml(out)}</pre>`;
      }
    }
    h += `</div>`;
    return h;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  }

  function render(idx) {
    const t = DATA.tutorials[idx];
    const main = document.getElementById("main");
    main.innerHTML = "";
    const h = document.createElement("div");
    h.className = "tutorial-title";
    h.textContent = t.meta.name + "  —  " + t.meta.platform;
    main.appendChild(h);

    t.rows.forEach(row => {
      const isStructural = row.execs.length === 0 &&
        (/^#\s|^##\s/.test(row.md.trim()));
      const div = document.createElement("div");
      const hasExec = row.execs.length > 0;
      const hasFail = row.execs.some(e => e.status === "fail");
      div.className = "row" + (hasExec ? "" : (isStructural ? " section" : " preamble")) +
        (hasFail ? " has-fail" : "");

      const left = document.createElement("div");
      left.className = "col left";
      left.innerHTML = `<div class="md">${mdToHtml(row.md)}</div>`;
      div.appendChild(left);

      if (hasExec || !isStructural) {
        const right = document.createElement("div");
        right.className = "col right";
        if (hasExec) {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            row.execs.map(execHtml).join("");
        } else {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            `<div class="empty">No commands run for this step.</div>`;
        }
        div.appendChild(right);
      }
      main.appendChild(div);
    });

    addAnchors(main, slug(t.meta.name));
  }

  function slug(s) {
    return String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  }

  // Octicon "link" — the same glyph GitHub puts next to markdown headings.
  const LINK_ICON =
    '<svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d=' +
    '"M7.775 3.275a.75.75 0 0 0 1.06 1.06l1.25-1.25a2 2 0 1 1 2.83 2.83l-2.5 2.5a2 2 0 0 1-2.83 0 ' +
    '.75.75 0 0 0-1.06 1.06 3.5 3.5 0 0 0 4.95 0l2.5-2.5a3.5 3.5 0 0 0-4.95-4.95l-1.25 1.25Zm-4.69 ' +
    '9.64a2 2 0 0 1 0-2.83l2.5-2.5a2 2 0 0 1 2.83 0 .75.75 0 0 0 1.06-1.06 3.5 3.5 0 0 0-4.95 0l-2.5 ' +
    '2.5a3.5 3.5 0 0 0 4.95 4.95l1.25-1.25a.75.75 0 0 0-1.06-1.06l-1.25 1.25a2 2 0 0 1-2.83 0Z"></path></svg>';

  // Give every heading a stable slug id (deduplicated the way GitHub does, with
  // -1/-2 suffixes) and a permalink whose href is "#<tutorial>/<heading>".
  function addAnchors(container, tutSlug) {
    const used = new Map();
    const nodes = container.querySelectorAll(
      ".tutorial-title, .md h1, .md h2, .md h3, .md h4, .md h5, .md h6"
    );
    nodes.forEach(node => {
      const text = node.textContent.trim();
      const isTitle = node.classList.contains("tutorial-title");
      let href = "#" + tutSlug;
      if (!isTitle) {
        const base = slug(text) || "section";
        const n = (used.get(base) || 0) + 1;
        used.set(base, n);
        node.id = n > 1 ? base + "-" + n : base;
        href += "/" + node.id;
      }
      node.classList.add("heading-anchored");
      const a = document.createElement("a");
      a.className = "anchor";
      a.href = href;
      a.title = "Copy link to this section";
      a.setAttribute("aria-label", "Permalink: " + text);
      a.innerHTML = LINK_ICON;
      node.insertBefore(a, node.firstChild);
    });
  }

  let toastTimer = null;
  function toast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 1600);
  }

  // navigator.clipboard needs a secure context; reports are often opened over
  // file://, so fall back to the old execCommand path there.
  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(
        () => toast("Link copied"),
        () => toast(text)
      );
      return;
    }
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    toast(ok ? "Link copied" : text);
  }

  function scrollToId(id) {
    if (!id) { window.scrollTo(0, 0); return; }
    const el = document.getElementById(id);
    if (!el) return;
    el.scrollIntoView({ block: "start" });
    el.classList.remove("flash");
    void el.offsetWidth;  // restart the animation on a repeat click
    el.classList.add("flash");
  }

  document.addEventListener("click", ev => {
    const a = ev.target.closest && ev.target.closest("a.anchor");
    if (!a) return;
    ev.preventDefault();
    const href = a.getAttribute("href");
    copyText(location.href.split("#")[0] + href);
    if (location.hash === href) scrollToId(a.parentNode.id);
    else location.hash = href;  // hashchange scrolls
  });

  // "#<tutorial>" (name, slug, or index) optionally followed by "/<heading>".
  function parseHash() {
    const raw = decodeURIComponent(location.hash.replace(/^#/, ""));
    if (!raw) return { idx: 0, frag: "" };
    const cut = raw.indexOf("/");
    const tut = cut >= 0 ? raw.slice(0, cut) : raw;
    const frag = cut >= 0 ? raw.slice(cut + 1) : "";
    if (/^\d+$/.test(tut) && +tut < DATA.tutorials.length) return { idx: +tut, frag };
    const i = DATA.tutorials.findIndex(
      t => slug(t.meta.name) === tut || t.meta.name === tut
    );
    if (i >= 0) return { idx: i, frag };
    // No tutorial matched: treat a bare hash as a heading in the current one.
    return { idx: currentIdx >= 0 ? currentIdx : 0, frag: cut >= 0 ? frag : raw };
  }

  let currentIdx = -1;
  function show(idx, frag) {
    if (idx !== currentIdx) {
      picker.value = idx;
      render(idx);
      currentIdx = idx;
    }
    if (frag) requestAnimationFrame(() => scrollToId(frag));
  }
  picker.addEventListener("change", () => {
    location.hash = slug(DATA.tutorials[+picker.value].meta.name);
    show(+picker.value);
  });
  window.addEventListener("hashchange", () => {
    const h = parseHash();
    show(h.idx, h.frag);
  });
  const initial = parseHash();
  show(initial.idx, initial.frag);
  // Inlined screenshots have no intrinsic size until decoded, so the first
  // scroll can land short; re-anchor once everything has loaded.
  if (initial.frag) {
    window.addEventListener("load", () => scrollToId(initial.frag), { once: true });
  }
</script>
</body>
